name: DKD DraBornGo v0.0.5 Upgrade

on:
  push:
    paths:
      - ".github/workflows/dkd_v0_0_5_upgrade.yml"

permissions:
  contents: write

concurrency:
  group: dkd-draborngo-v0-0-5-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Apply DraBornGo v0.0.5 source upgrade
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          import re
          import shutil

          dkd_root_path = Path('.')
          dkd_version_name = '0.0.5'
          dkd_version_code = 5

          def dkd_read_text(dkd_path_value):
              return dkd_path_value.read_text(encoding='utf-8')

          def dkd_write_text(dkd_path_value, dkd_text_value):
              dkd_path_value.parent.mkdir(parents=True, exist_ok=True)
              dkd_path_value.write_text(dkd_text_value, encoding='utf-8')

          def dkd_write_json(dkd_path_value, dkd_data_value):
              dkd_write_text(dkd_path_value, json.dumps(dkd_data_value, ensure_ascii=False, indent=2) + '\n')

          dkd_package_path = dkd_root_path / 'package.json'
          dkd_package_value = json.loads(dkd_read_text(dkd_package_path))
          dkd_package_value['name'] = 'draborngo'
          dkd_package_value['version'] = dkd_version_name
          dkd_scripts_value = dkd_package_value.setdefault('scripts', {})
          dkd_scripts_value['postinstall'] = 'node ./scripts/dkd_restore_public_env.mjs && node ./scripts/dkd_clean_android_dependency_manifests.js'
          dkd_scripts_value['preandroid'] = 'npm run env:restore'
          dkd_scripts_value['prebuild'] = 'npm run env:restore'
          dkd_scripts_value['preexport'] = 'npm run env:restore'
          dkd_scripts_value['dkd:verify-v0.0.5'] = 'node ./scripts/dkd_verify_release_identity.mjs'
          dkd_write_json(dkd_package_path, dkd_package_value)

          dkd_app_path = dkd_root_path / 'app.json'
          dkd_app_value = json.loads(dkd_read_text(dkd_app_path))
          dkd_expo_value = dkd_app_value.setdefault('expo', {})
          dkd_expo_value['name'] = 'DraBornGo'
          dkd_expo_value['slug'] = 'draborngo'
          dkd_expo_value['version'] = dkd_version_name
          dkd_android_value = dkd_expo_value.setdefault('android', {})
          dkd_android_value['versionCode'] = dkd_version_code
          dkd_android_value['package'] = 'com.draborneagle.draborngo'
          dkd_write_json(dkd_app_path, dkd_app_value)

          dkd_public_env_value = {
              'EXPO_PUBLIC_SUPABASE_URL': 'https://guuwomvszlwhkmstewfl.supabase.co',
              'EXPO_PUBLIC_SUPABASE_ANON_KEY': 'sb_publishable_bf1URxrlLlvMQ8e1Z7oxkQ_jx9mvy5g',
              'EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY': 'sb_publishable_bf1URxrlLlvMQ8e1Z7oxkQ_jx9mvy5g',
              'EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN': 'pk.eyJ1IjoiZHJhYm9ybmVhZ2xlIiwiYSI6ImNtb2w4bzJqNTBnZDcyc3NiZzd5anJpYWYifQ.dtxvJcDCckwWCFGCk7ialg',
          }
          dkd_write_json(dkd_root_path / 'config' / 'dkd_public_env.defaults.json', dkd_public_env_value)

          dkd_active_roots = [
              dkd_root_path / 'src',
              dkd_root_path / 'scripts',
              dkd_root_path / 'tools',
              dkd_root_path / 'supabase' / 'functions',
              dkd_root_path / 'web' / 'DraBornGo' / 'App',
          ]
          dkd_active_files = [
              dkd_root_path / 'App.js',
              dkd_root_path / 'README.md',
              dkd_root_path / 'app.config.js',
              dkd_root_path / 'eas.json',
          ]
          dkd_text_suffix_values = {'.js', '.jsx', '.ts', '.tsx', '.mjs', '.cjs', '.json', '.md', '.html', '.yml', '.yaml', '.sh', '.txt'}

          dkd_rename_candidates = []
          for dkd_active_root_path in dkd_active_roots:
              if not dkd_active_root_path.exists():
                  continue
              for dkd_path_value in sorted(dkd_active_root_path.rglob('*'), key=lambda dkd_item_value: len(dkd_item_value.parts), reverse=True):
                  if not dkd_path_value.is_file():
                      continue
                  if 'Ally' not in dkd_path_value.name and 'ally' not in dkd_path_value.name:
                      continue
                  dkd_new_name_value = dkd_path_value.name.replace('Ally', 'DBG').replace('ally', 'dbg')
                  dkd_rename_candidates.append((dkd_path_value, dkd_path_value.with_name(dkd_new_name_value)))

          for dkd_old_path_value, dkd_new_path_value in dkd_rename_candidates:
              if dkd_old_path_value == dkd_new_path_value or not dkd_old_path_value.exists():
                  continue
              if dkd_new_path_value.exists():
                  dkd_new_path_value.unlink()
              dkd_old_path_value.rename(dkd_new_path_value)

          def dkd_replace_active_identity(dkd_text_value):
              dkd_next_text_value = dkd_text_value
              dkd_next_text_value = dkd_next_text_value.replace('LOOTONIA', 'DRABORNGO')
              dkd_next_text_value = dkd_next_text_value.replace('Lootonia', 'DraBornGo')
              dkd_next_text_value = dkd_next_text_value.replace('lootonia', 'draborngo')
              dkd_next_text_value = dkd_next_text_value.replace('ALLY', 'DBG')
              dkd_next_text_value = dkd_next_text_value.replace('Ally', 'DBG')
              dkd_next_text_value = re.sub(r'(?<![A-Za-z])ally(?=[A-Z_]|[^A-Za-z]|$)', 'dbg', dkd_next_text_value)
              return dkd_next_text_value

          dkd_paths_to_update = []
          for dkd_active_root_path in dkd_active_roots:
              if not dkd_active_root_path.exists():
                  continue
              dkd_paths_to_update.extend(
                  dkd_path_value
                  for dkd_path_value in dkd_active_root_path.rglob('*')
                  if dkd_path_value.is_file() and dkd_path_value.suffix.lower() in dkd_text_suffix_values
              )
          dkd_paths_to_update.extend(dkd_path_value for dkd_path_value in dkd_active_files if dkd_path_value.exists())

          for dkd_path_value in sorted(set(dkd_paths_to_update)):
              dkd_old_text_value = dkd_read_text(dkd_path_value)
              dkd_new_text_value = dkd_replace_active_identity(dkd_old_text_value)
              if dkd_new_text_value != dkd_old_text_value:
                  dkd_write_text(dkd_path_value, dkd_new_text_value)

          dkd_version_target_paths = [
              dkd_root_path / 'src' / 'services' / 'dkd_app_update_service.js',
              dkd_root_path / 'src' / 'features' / 'legal' / 'dkd_app_update_center_modal.js',
              dkd_root_path / 'src' / 'services' / 'dkd_policy_center_service.js',
              dkd_root_path / 'src' / 'features' / 'map' / 'MapHomeScreen.js',
              dkd_root_path / 'src' / 'features' / 'legal' / 'dkd_google_play_policy_center_modal.js',
              dkd_root_path / 'web' / 'DraBornGo' / 'App' / 'index.html',
              dkd_root_path / 'web' / 'DraBornGo' / 'App' / 'dkd_draborngo_update_manifest.json',
              dkd_root_path / 'web' / 'DraBornGo' / 'App' / 'dkd_draborngo_release_notes.html',
              dkd_root_path / '.github' / 'workflows' / 'dkdev_build_apk.yml',
              dkd_root_path / '.github' / 'workflows' / 'dkd_build_signed_apk.yml',
              dkd_root_path / '.github' / 'workflows' / 'dkd_build_signed_aab.yml',
          ]
          for dkd_path_value in dkd_version_target_paths:
              if not dkd_path_value.exists():
                  continue
              dkd_old_text_value = dkd_read_text(dkd_path_value)
              dkd_new_text_value = dkd_old_text_value.replace('0.0.4', dkd_version_name).replace('v0.0.4', 'v0.0.5')
              if dkd_path_value.name == 'dkd_app_update_service.js':
                  dkd_new_text_value = dkd_new_text_value.replace('|| 4;', '|| 5;')
              if dkd_path_value.name == 'dkd_app_update_center_modal.js':
                  dkd_new_text_value = dkd_new_text_value.replace('|| 4}', '|| 5}')
              if dkd_new_text_value != dkd_old_text_value:
                  dkd_write_text(dkd_path_value, dkd_new_text_value)

          dkd_update_modal_path = dkd_root_path / 'src' / 'features' / 'legal' / 'dkd_app_update_center_modal.js'
          if dkd_update_modal_path.exists():
              dkd_update_modal_text_value = dkd_read_text(dkd_update_modal_path)
              dkd_update_modal_text_value = re.sub(
                  r'\n\s*<View style=\{dkd_styles\.dkd_warning_card\}>\s*<MaterialCommunityIcons[^\n]*\n\s*<Text style=\{dkd_styles\.dkd_warning_text\}>Uygulama sessiz kurulum yapmaz\..*?</Text>\s*</View>\s*',
                  '\n',
                  dkd_update_modal_text_value,
                  flags=re.S,
              )
              dkd_update_modal_text_value = re.sub(r'\n\s*dkd_warning_card:\s*\{.*?\n\s*\},', '', dkd_update_modal_text_value, flags=re.S)
              dkd_update_modal_text_value = re.sub(r'\n\s*dkd_warning_text:\s*\{.*?\n\s*\},', '', dkd_update_modal_text_value, flags=re.S)
              dkd_write_text(dkd_update_modal_path, dkd_update_modal_text_value)

          dkd_verify_script_text_value = r'''import dkd_file_system_module from 'node:fs';
          import dkd_path_module from 'node:path';

          const dkd_root_path_value = process.cwd();
          const dkd_package_value = JSON.parse(dkd_file_system_module.readFileSync(dkd_path_module.join(dkd_root_path_value, 'package.json'), 'utf8'));
          const dkd_app_value = JSON.parse(dkd_file_system_module.readFileSync(dkd_path_module.join(dkd_root_path_value, 'app.json'), 'utf8'));
          const dkd_env_value = JSON.parse(dkd_file_system_module.readFileSync(dkd_path_module.join(dkd_root_path_value, 'config', 'dkd_public_env.defaults.json'), 'utf8'));

          const dkd_error_text_values = [];
          if (dkd_package_value.version !== '0.0.5') dkd_error_text_values.push('package.json version 0.0.5 değil.');
          if (dkd_app_value?.expo?.version !== '0.0.5') dkd_error_text_values.push('app.json expo.version 0.0.5 değil.');
          if (Number(dkd_app_value?.expo?.android?.versionCode) !== 5) dkd_error_text_values.push('Android versionCode 5 değil.');
          if (dkd_app_value?.expo?.name !== 'DraBornGo') dkd_error_text_values.push('Uygulama adı DraBornGo değil.');

          for (const dkd_key_name_value of ['EXPO_PUBLIC_SUPABASE_URL', 'EXPO_PUBLIC_SUPABASE_ANON_KEY', 'EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY', 'EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN']) {
            if (!String(dkd_env_value?.[dkd_key_name_value] || '').trim()) dkd_error_text_values.push(`${dkd_key_name_value} boş.`);
          }

          const dkd_scan_root_name_values = ['src', 'scripts', 'tools', 'supabase/functions'];
          const dkd_text_extension_values = new Set(['.js', '.jsx', '.ts', '.tsx', '.mjs', '.cjs', '.json', '.md', '.html', '.yml', '.yaml', '.sh', '.txt']);
          const dkd_forbidden_pattern_value = /Lootonia|lootonia|LOOTONIA|\bAlly\b|ally_id|AllyHub|allyService|useAllyHubState/;

          function dkd_scan_path_value(dkd_path_value) {
            if (!dkd_file_system_module.existsSync(dkd_path_value)) return;
            const dkd_stat_value = dkd_file_system_module.statSync(dkd_path_value);
            if (dkd_stat_value.isDirectory()) {
              for (const dkd_entry_name_value of dkd_file_system_module.readdirSync(dkd_path_value)) dkd_scan_path_value(dkd_path_module.join(dkd_path_value, dkd_entry_name_value));
              return;
            }
            if (!dkd_text_extension_values.has(dkd_path_module.extname(dkd_path_value).toLowerCase())) return;
            const dkd_text_value = dkd_file_system_module.readFileSync(dkd_path_value, 'utf8');
            if (dkd_forbidden_pattern_value.test(dkd_text_value)) dkd_error_text_values.push(`Eski kimlik kaldı: ${dkd_path_module.relative(dkd_root_path_value, dkd_path_value)}`);
          }

          for (const dkd_scan_root_name_value of dkd_scan_root_name_values) dkd_scan_path_value(dkd_path_module.join(dkd_root_path_value, dkd_scan_root_name_value));

          if (dkd_error_text_values.length) {
            console.error(dkd_error_text_values.join('\n'));
            process.exit(1);
          }
          console.log('DKD v0.0.5 kimlik, sürüm ve public env doğrulaması başarılı.');
          '''
          dkd_verify_script_text_value = '\n'.join(dkd_line_value[10:] if dkd_line_value.startswith('          ') else dkd_line_value for dkd_line_value in dkd_verify_script_text_value.splitlines()) + '\n'
          dkd_write_text(dkd_root_path / 'scripts' / 'dkd_verify_release_identity.mjs', dkd_verify_script_text_value)

          dkd_termux_script_text_value = r'''#!/data/data/com.termux/files/usr/bin/bash
          set -euo pipefail

          dkd_project_root="$HOME/Projects"
          dkd_target_path="$dkd_project_root/DraBornGo"
          dkd_legacy_path="$dkd_project_root/Lootonia"
          dkd_download_path="$HOME/storage/downloads"
          dkd_timestamp_value="$(date +%Y%m%d_%H%M%S)"
          dkd_backup_file="$dkd_download_path/DKD_DraBornGo_SourceCode_v0.0.4_${dkd_timestamp_value}.zip"
          dkd_latest_backup_file="$dkd_download_path/DKD_DraBornGo_SourceCode.zip"

          pkg update -y
          pkg install -y git nodejs-lts zip unzip
          termux-setup-storage >/dev/null 2>&1 || true
          mkdir -p "$dkd_project_root" "$dkd_download_path"

          if [ -d "$dkd_target_path" ]; then
            cd "$dkd_target_path"
            rm -f "$dkd_backup_file" "$dkd_latest_backup_file"
            zip -qr "$dkd_backup_file" . -x '.git/*' 'node_modules/*' '.expo/*' 'dist/*' '.dkd-export-check/*'
            cp -f "$dkd_backup_file" "$dkd_latest_backup_file"
          elif [ -d "$dkd_legacy_path" ]; then
            mv "$dkd_legacy_path" "$dkd_target_path"
          fi

          if [ ! -d "$dkd_target_path/.git" ]; then
            rm -rf "$dkd_target_path"
            git clone https://github.com/DrabornEagle/DraBornGo.git "$dkd_target_path"
          fi

          cd "$dkd_target_path"
          git remote set-url origin https://github.com/DrabornEagle/DraBornGo.git
          git fetch origin main
          git reset --hard origin/main
          git clean -fd -e .env -e .env.local -e .env.production
          npm install
          npm run env:restore
          npm run dkd:verify-v0.0.5
          npx expo start -c
          '''
          dkd_termux_script_text_value = '\n'.join(dkd_line_value[10:] if dkd_line_value.startswith('          ') else dkd_line_value for dkd_line_value in dkd_termux_script_text_value.splitlines()) + '\n'
          dkd_termux_script_path = dkd_root_path / 'scripts' / 'dkd_termux_update_v0_0_5.sh'
          dkd_write_text(dkd_termux_script_path, dkd_termux_script_text_value)
          dkd_termux_script_path.chmod(0o755)

          dkd_release_doc_text_value = '''# DraBornGo v0.0.5\n\n- Uygulama sürümü: `0.0.5`\n- Android versionCode: `5`\n- Proje klasörü: `~/Projects/DraBornGo`\n- Önceki sürüm yedeği: GitHub `backup/v0.0.4` dalı ve Termux ZIP yedeği\n- Public Supabase ve Mapbox ayarları `config/dkd_public_env.defaults.json` üzerinden otomatik geri yüklenir.\n- Aktif uygulama kodundaki Ally kimliği DBG, `ally_id` alanı `dbg_id` olarak taşınır.\n- Eski uygulanmış SQL migration dosyaları değiştirilmeyerek migration geçmişi korunur; canlı veritabanı için ileri yönlü v0.0.5 migration kullanılır.\n'''
          dkd_write_text(dkd_root_path / 'docs' / 'dkd_draborngo_v0_0_5_upgrade.md', dkd_release_doc_text_value)

          dkd_readme_path = dkd_root_path / 'README.md'
          if dkd_readme_path.exists():
              dkd_readme_text_value = dkd_read_text(dkd_readme_path)
              dkd_banner_value = '> Aktif sürüm: DraBornGo v0.0.5 • Android versionCode 5 • Termux proje yolu: `~/Projects/DraBornGo`\n\n'
              if dkd_banner_value not in dkd_readme_text_value:
                  dkd_readme_text_value = dkd_banner_value + dkd_readme_text_value
              dkd_write_text(dkd_readme_path, dkd_readme_text_value)
          PY

      - name: Install and align Expo SDK 54 packages
        shell: bash
        run: |
          npm install
          npx expo install --fix
          npm run env:restore

      - name: Verify release identity
        run: npm run dkd:verify-v0.0.5

      - name: Validate Expo config
        shell: bash
        run: |
          npx expo config --type public >/tmp/dkd_expo_public_config.json
          node -e "const c=require('/tmp/dkd_expo_public_config.json'); if(c.version!=='0.0.5'||Number(c.android?.versionCode)!==5) process.exit(1); console.log('Expo config v0.0.5 / 5 doğrulandı.');"

      - name: Bundle Android JavaScript
        shell: bash
        run: |
          rm -rf .dkd-export-check
          npx expo export --platform android --output-dir .dkd-export-check --clear
          rm -rf .dkd-export-check

      - name: Commit and push upgraded source
        shell: bash
        run: |
          git config user.name "DKD Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes were required."
            exit 0
          fi
          git commit -m "DraBornGo v0.0.5: Expo 54, DBG identity and fixed public env"
          git push origin HEAD:main
