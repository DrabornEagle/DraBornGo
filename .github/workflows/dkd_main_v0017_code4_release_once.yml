name: DraBornGo v0.0.17 code4 normal Release APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd_main_v0017_code4_release_once.yml'

permissions:
  contents: write

concurrency:
  group: draborngo-v0017-code4-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      DKD_ANDROID_KEYSTORE_BASE64: ${{ secrets.DKD_ANDROID_KEYSTORE_BASE64 }}
      DKD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DKD_ANDROID_KEYSTORE_PASSWORD }}
      DKD_ANDROID_KEY_ALIAS: ${{ secrets.DKD_ANDROID_KEY_ALIAS }}
      DKD_ANDROID_KEY_PASSWORD: ${{ secrets.DKD_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android release signing secrets
        shell: bash
        run: |
          for v in DKD_ANDROID_KEYSTORE_BASE64 DKD_ANDROID_KEYSTORE_PASSWORD DKD_ANDROID_KEY_ALIAS DKD_ANDROID_KEY_PASSWORD; do
            test -n "${!v}" || { echo "Missing $v"; exit 1; }
          done
          mkdir -p /tmp/dkd_keystore_precheck
          printf '%s' "$DKD_ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/dkd_keystore_precheck/release.jks
          keytool -list -keystore /tmp/dkd_keystore_precheck/release.jks -storepass "$DKD_ANDROID_KEYSTORE_PASSWORD" -alias "$DKD_ANDROID_KEY_ALIAS" >/dev/null
          rm -rf /tmp/dkd_keystore_precheck

      - name: Restore embedded public environment
        shell: bash
        run: |
          node ./scripts/dkd_restore_public_env.mjs
          set -a
          . ./.env
          set +a
          dkd_supabase_publishable_key_value="${EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-${EXPO_PUBLIC_SUPABASE_ANON_KEY}}"
          export EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$dkd_supabase_publishable_key_value"
          for dkd_secret_name in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN; do
            test -n "${!dkd_secret_name}" || { echo "Missing $dkd_secret_name"; exit 1; }
          done
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\n' "$EXPO_PUBLIC_SUPABASE_URL" > .env
          printf 'EXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$EXPO_PUBLIC_SUPABASE_ANON_KEY" >> .env
          printf 'EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" >> .env
          printf 'EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN=%s\n' "$EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN" >> .env
          cp .env .env.local
          cp .env .env.production
          node <<'NODE'
          const fs=require('fs');
          const keys=['EXPO_PUBLIC_SUPABASE_URL','EXPO_PUBLIC_SUPABASE_ANON_KEY','EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY','EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN'];
          const out={};
          for(const k of keys){const v=String(process.env[k]||'').trim();if(!v)throw new Error(`${k} missing`);out[k]=v;}
          fs.writeFileSync('src/lib/dkd_public_env.generated.js',`export const dkd_generated_public_env_value = ${JSON.stringify(out,null,2)};\n`);
          NODE

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Verify v0.0.17 code4 identity
        shell: bash
        run: |
          node <<'NODE'
          const a=require('./app.json').expo;
          const p=require('./package.json');
          if(a.version!=='0.0.17'||p.version!=='0.0.17') throw new Error('DraBornGo must be v0.0.17');
          if(Number(a.android.versionCode)!==4) throw new Error('DraBornGo versionCode must be 4');
          if(a.android.package!=='com.draborneagle.draborngo') throw new Error('Android package mismatch');
          console.log('DraBornGo v0.0.17 code4 identity OK');
          NODE
          npx expo-doctor@latest
          npx expo export --platform android --output-dir /tmp/dkd-main-release-export

      - name: Prepare Android SDK
        shell: bash
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Inject release signing
        shell: bash
        run: |
          mkdir -p android/app/dkd_secure
          printf '%s' "$DKD_ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/dkd_secure/dkd_release_keystore.jks
          cat > android/app/dkd_release_signing.gradle <<'GRADLE'
          android {
              signingConfigs {
                  dkdRelease {
                      storeFile file('dkd_secure/dkd_release_keystore.jks')
                      storePassword System.getenv('DKD_ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('DKD_ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('DKD_ANDROID_KEY_PASSWORD')
                  }
              }
              buildTypes { release { signingConfig signingConfigs.dkdRelease } }
          }
          GRADLE
          printf '\napply from: "dkd_release_signing.gradle"\n' >> android/app/build.gradle
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\norg.gradle.daemon=false\norg.gradle.parallel=false\n' >> android/gradle.properties

      - name: Build normal release APK
        shell: bash
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify and collect DraBornGo APK
        shell: bash
        run: |
          mkdir -p dkd_signed_apk_output
          dkd_apk_path="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$dkd_apk_path"
          cp "$dkd_apk_path" dkd_signed_apk_output/DraBornGo-v0.0.17-code4-release.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose dkd_signed_apk_output/DraBornGo-v0.0.17-code4-release.apk
          sha256sum dkd_signed_apk_output/DraBornGo-v0.0.17-code4-release.apk | tee dkd_signed_apk_output/SHA256.txt
          ls -lh dkd_signed_apk_output

      - uses: actions/upload-artifact@v4
        with:
          name: DraBornGo_Release_APK_v0_0_17_code4
          path: dkd_signed_apk_output/
          retention-days: 14

      - name: Update persistent release workflow and cleanup helper
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='.github/workflows/dkd_build_signed_apk.yml';
          let s=fs.readFileSync(p,'utf8');
          s=s.replaceAll('v0.0.17 code 3','v0.0.17 code 4');
          s=s.replaceAll('Number(a.android.versionCode)!==3','Number(a.android.versionCode)!==4');
          s=s.replaceAll('versionCode must be 3','versionCode must be 4');
          s=s.replaceAll('v0.0.17 / code 3','v0.0.17 / code 4');
          s=s.replaceAll('DraBornGo-v0.0.17-code3-release.apk','DraBornGo-v0.0.17-code4-release.apk');
          s=s.replaceAll('DraBornGo_Release_APK_v0_0_17_code3','DraBornGo_Release_APK_v0_0_17_code4');
          fs.writeFileSync(p,s);
          NODE
          rm -f .github/workflows/dkd_main_v0017_code4_release_once.yml
          git config user.name 'DraBornGo Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/dkd_build_signed_apk.yml .github/workflows/dkd_main_v0017_code4_release_once.yml
          git commit -m 'build: align DraBornGo release APK workflow with code4' || true
          git push origin HEAD:main
