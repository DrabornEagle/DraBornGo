name: Finalize DraBornGo v0.0.17 release identity once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dkd_patch_v0017_release_identity_once.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Patch release identity
        shell: bash
        run: |
          node <<'DKD_NODE'
          const fs=require('fs');
          const svc='src/services/dkd_app_update_service.js'; let s=fs.readFileSync(svc,'utf8');
          s=s.replace("const dkd_current_release_name_value = '0.0.16';","const dkd_current_release_name_value = '0.0.17';"); fs.writeFileSync(svc,s);
          const wf='.github/workflows/dkd_build_signed_apk.yml'; let w=fs.readFileSync(wf,'utf8');
          w=w.replaceAll('v0.0.16','v0.0.17').replaceAll("'0.0.16'","'0.0.17'").replaceAll('0_0_16','0_0_17'); fs.writeFileSync(wf,w);
          DKD_NODE
      - run: npm ci
      - run: npx expo export --platform android --output-dir dist-ci
      - name: Commit final identity
        shell: bash
        run: |
          printf 'DraBornGo v0.0.17 release identity and Android Metro export validated.\n' > .github/dkd-v0.0.17-release-final-validation.txt
          git add src/services/dkd_app_update_service.js .github/workflows/dkd_build_signed_apk.yml .github/dkd-v0.0.17-release-final-validation.txt
          if ! git diff --cached --quiet; then git commit -m 'release: finalize DraBornGo v0.0.17 identity'; git push; fi
