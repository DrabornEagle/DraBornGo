name: DKD Build Signed APK

on:
  workflow_dispatch:

concurrency:
  group: dkd-build-signed-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dkd_build_signed_apk:
    name: Dkd build signed APK only
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      DKD_ANDROID_KEYSTORE_BASE64: ${{ secrets.DKD_ANDROID_KEYSTORE_BASE64 }}
      DKD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DKD_ANDROID_KEYSTORE_PASSWORD }}
      DKD_ANDROID_KEY_ALIAS: ${{ secrets.DKD_ANDROID_KEY_ALIAS }}
      DKD_ANDROID_KEY_PASSWORD: ${{ secrets.DKD_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Dkd checkout
        uses: actions/checkout@v4

      - name: Dkd setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dkd setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dkd fast validate android signing secrets
        shell: bash
        run: |
          mkdir -p dkd_keystore_precheck
          printf '%s' "${DKD_ANDROID_KEYSTORE_BASE64}" | base64 --decode > dkd_keystore_precheck/dkd_release_keystore.jks
          if [ ! -s dkd_keystore_precheck/dkd_release_keystore.jks ]; then
            echo "DKD ERROR: DKD_ANDROID_KEYSTORE_BASE64 decoded keystore is empty."
            exit 1
          fi
          keytool -list -keystore dkd_keystore_precheck/dkd_release_keystore.jks -storepass "${DKD_ANDROID_KEYSTORE_PASSWORD}" -alias "${DKD_ANDROID_KEY_ALIAS}" >/dev/null
          pushd dkd_keystore_precheck >/dev/null
          printf 'dkd signing precheck\n' > dkd_precheck.txt
          jar cf dkd_precheck.jar dkd_precheck.txt
          jarsigner -keystore dkd_release_keystore.jks -storepass "${DKD_ANDROID_KEYSTORE_PASSWORD}" -keypass "${DKD_ANDROID_KEY_PASSWORD}" -signedjar dkd_precheck_signed.jar dkd_precheck.jar "${DKD_ANDROID_KEY_ALIAS}" >/dev/null
          jarsigner -verify dkd_precheck_signed.jar >/dev/null
          popd >/dev/null
          rm -rf dkd_keystore_precheck
          echo "DKD Android signing secrets verified before long Gradle build."

      - name: Dkd write embedded public env module
        shell: bash
        run: |
          node ./scripts/dkd_restore_public_env.mjs
          set -a
          . ./.env
          set +a

          dkd_supabase_publishable_key_value="${EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-${EXPO_PUBLIC_SUPABASE_ANON_KEY}}"
          export EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${dkd_supabase_publishable_key_value}"

          for dkd_secret_name in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN DKD_ANDROID_KEYSTORE_BASE64 DKD_ANDROID_KEYSTORE_PASSWORD DKD_ANDROID_KEY_ALIAS DKD_ANDROID_KEY_PASSWORD; do
            if [ -z "${!dkd_secret_name}" ]; then
              echo "DKD ERROR: ${dkd_secret_name} secret is empty."
              exit 1
            fi
          done

          if ! echo "${EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN}" | grep -q '^pk\.'; then
            echo "DKD ERROR: EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN must start with pk."
            exit 1
          fi

          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\n' "${EXPO_PUBLIC_SUPABASE_URL}" > .env
          printf 'EXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "${EXPO_PUBLIC_SUPABASE_ANON_KEY}" >> .env
          printf 'EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "${EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY}" >> .env
          printf 'EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN=%s\n' "${EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN}" >> .env
          cp .env .env.local
          cp .env .env.production

          node <<'DKD_NODE'
          const dkd_file_system_module = require('fs');
          const dkd_required_key_values = [
            'EXPO_PUBLIC_SUPABASE_URL',
            'EXPO_PUBLIC_SUPABASE_ANON_KEY',
            'EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY',
            'EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN'
          ];
          const dkd_generated_env_value = {};
          for (const dkd_key_name_value of dkd_required_key_values) {
            const dkd_runtime_value = String(process.env[dkd_key_name_value] || '').trim();
            if (!dkd_runtime_value) {
              throw new Error(`DKD ERROR: ${dkd_key_name_value} is empty before bundle generation.`);
            }
            dkd_generated_env_value[dkd_key_name_value] = dkd_runtime_value;
          }
          const dkd_generated_file_value = `export const dkd_generated_public_env_value = ${JSON.stringify(dkd_generated_env_value, null, 2)};\n`;
          dkd_file_system_module.writeFileSync('src/lib/dkd_public_env.generated.js', dkd_generated_file_value);
          console.log('DKD embedded public env module generated for APK build.');
          DKD_NODE

      - name: Dkd install npm packages
        run: npm install --no-package-lock

      - name: Dkd verify embedded runtime env
        shell: bash
        run: |
          npx expo config --json > dkd_expo_public_env_config.json
          node <<'DKD_NODE'
          const dkd_file_system_module = require('fs');
          const dkd_generated_file_value = dkd_file_system_module.readFileSync('src/lib/dkd_public_env.generated.js', 'utf8');
          const dkd_config_value = JSON.parse(dkd_file_system_module.readFileSync('dkd_expo_public_env_config.json', 'utf8'));
          const dkd_extra_value = dkd_config_value && dkd_config_value.extra ? dkd_config_value.extra : {};
          const dkd_public_env_value = dkd_extra_value.dkd_public_env || {};
          const dkd_required_key_values = [
            'EXPO_PUBLIC_SUPABASE_URL',
            'EXPO_PUBLIC_SUPABASE_ANON_KEY',
            'EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY',
            'EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN'
          ];
          for (const dkd_key_name_value of dkd_required_key_values) {
            const dkd_config_runtime_value = String(dkd_public_env_value[dkd_key_name_value] || dkd_extra_value[dkd_key_name_value] || '').trim();
            const dkd_generated_has_key_value = dkd_generated_file_value.includes(dkd_key_name_value);
            if (!dkd_config_runtime_value || !dkd_generated_has_key_value) {
              throw new Error(`DKD ERROR: ${dkd_key_name_value} was not embedded into app config and generated module.`);
            }
          }
          console.log('DKD Expo public env config and generated runtime module verified.');
          DKD_NODE

      - name: Dkd verify foreground service location permission removed
        shell: bash
        run: |
          npx expo config --json > dkd_expo_policy_config.json
          node <<'DKD_NODE'
          const dkd_file_system_module = require('fs');
          const dkd_config_value = JSON.parse(dkd_file_system_module.readFileSync('dkd_expo_policy_config.json', 'utf8'));
          const dkd_permission_values = Array.isArray(dkd_config_value?.android?.permissions) ? dkd_config_value.android.permissions : [];
          const dkd_forbidden_permission_value = ['android', 'permission'].join('.') + '.' + ['FOREGROUND', 'SERVICE', 'LOCATION'].join('_');
          if (dkd_permission_values.includes(dkd_forbidden_permission_value)) {
            throw new Error('DKD ERROR: Android foreground service location permission is still present in Expo config. Google Play foreground service declaration would be triggered.');
          }
          console.log('DKD Android policy config verified: Android foreground service location permission removed.');
          DKD_NODE

      - name: Dkd prepare android sdk
        shell: bash
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Dkd generate android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Dkd tune gradle release memory
        shell: bash
        run: |
          mkdir -p android
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\norg.gradle.daemon=false\norg.gradle.parallel=false\n' >> android/gradle.properties
          echo "DKD Gradle release memory tuned."

      - name: Dkd inject release signing config
        shell: bash
        run: |
          mkdir -p android/app/dkd_secure
          printf '%s' "${DKD_ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/dkd_secure/dkd_release_keystore.jks
          cat > android/app/dkd_release_signing.gradle <<'DKD_GRADLE'
          android {
              signingConfigs {
                  dkdRelease {
                      storeFile file('dkd_secure/dkd_release_keystore.jks')
                      storePassword System.getenv('DKD_ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('DKD_ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('DKD_ANDROID_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.dkdRelease
                  }
              }
          }
          DKD_GRADLE
          printf '\napply from: "dkd_release_signing.gradle"\n' >> android/app/build.gradle

      - name: Dkd build signed release APK
        shell: bash
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon

      - name: Dkd collect signed APK
        shell: bash
        run: |
          mkdir -p dkd_signed_apk_output
          cp android/app/build/outputs/apk/release/*.apk dkd_signed_apk_output/DraBornGo-v0.0.6-code6-release.apk
          ls -lh dkd_signed_apk_output

      - name: Dkd upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DKD_DraBornGo_v0_0_6_code6_signed_apk
          path: dkd_signed_apk_output/DraBornGo-v0.0.6-code6-release.apk
          retention-days: 14
