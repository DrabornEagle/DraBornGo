name: DraBornGo Release APK

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: draborngo-release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dkd_build_signed_apk:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.title == '[DKD] Build DraBornGo v0.0.14 Release'
    name: DraBornGo v0.0.14 signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      DKD_ANDROID_KEYSTORE_BASE64: ${{ secrets.DKD_ANDROID_KEYSTORE_BASE64 }}
      DKD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DKD_ANDROID_KEYSTORE_PASSWORD }}
      DKD_ANDROID_KEY_ALIAS: ${{ secrets.DKD_ANDROID_KEY_ALIAS }}
      DKD_ANDROID_KEY_PASSWORD: ${{ secrets.DKD_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Android signing secrets
        shell: bash
        run: |
          mkdir -p dkd_keystore_precheck
          printf '%s' "${DKD_ANDROID_KEYSTORE_BASE64}" | base64 --decode > dkd_keystore_precheck/dkd_release_keystore.jks
          test -s dkd_keystore_precheck/dkd_release_keystore.jks
          keytool -list -keystore dkd_keystore_precheck/dkd_release_keystore.jks -storepass "${DKD_ANDROID_KEYSTORE_PASSWORD}" -alias "${DKD_ANDROID_KEY_ALIAS}" >/dev/null
          pushd dkd_keystore_precheck >/dev/null
          printf 'dkd signing precheck\n' > dkd_precheck.txt
          jar cf dkd_precheck.jar dkd_precheck.txt
          jarsigner -keystore dkd_release_keystore.jks -storepass "${DKD_ANDROID_KEYSTORE_PASSWORD}" -keypass "${DKD_ANDROID_KEY_PASSWORD}" -signedjar dkd_precheck_signed.jar dkd_precheck.jar "${DKD_ANDROID_KEY_ALIAS}" >/dev/null
          jarsigner -verify dkd_precheck_signed.jar >/dev/null
          popd >/dev/null
          rm -rf dkd_keystore_precheck

      - name: Restore public runtime environment
        shell: bash
        run: |
          node ./scripts/dkd_restore_public_env.mjs
          set -a
          . ./.env
          set +a
          dkd_supabase_publishable_key_value="${EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-${EXPO_PUBLIC_SUPABASE_ANON_KEY}}"
          export EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${dkd_supabase_publishable_key_value}"
          for dkd_secret_name in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN; do
            if [ -z "${!dkd_secret_name}" ]; then
              echo "DKD ERROR: ${dkd_secret_name} is empty."
              exit 1
            fi
          done
          if ! echo "${EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN}" | grep -q '^pk\.'; then
            echo "DKD ERROR: EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN must start with pk."
            exit 1
          fi
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\n' "${EXPO_PUBLIC_SUPABASE_URL}" > .env
          printf 'EXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "${EXPO_PUBLIC_SUPABASE_ANON_KEY}" >> .env
          printf 'EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "${EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY}" >> .env
          printf 'EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN=%s\n' "${EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN}" >> .env
          cp .env .env.local
          cp .env .env.production
          node <<'DKD_NODE'
          const fs = require('fs');
          const keys = ['EXPO_PUBLIC_SUPABASE_URL','EXPO_PUBLIC_SUPABASE_ANON_KEY','EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY','EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN'];
          const values = {};
          for (const key of keys) {
            const value = String(process.env[key] || '').trim();
            if (!value) throw new Error(`DKD ERROR: ${key} is empty before bundle generation.`);
            values[key] = value;
          }
          fs.writeFileSync('src/lib/dkd_public_env.generated.js', `export const dkd_generated_public_env_value = ${JSON.stringify(values, null, 2)};\n`);
          DKD_NODE

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Verify v0.0.14 release identity and policy source
        run: |
          npm run dkd:verify-v0.0.14
          npm run dkd:play-risk-scan
          npx expo install --check

      - name: Verify embedded runtime environment
        shell: bash
        run: |
          npx expo config --json > dkd_expo_public_env_config.json
          node <<'DKD_NODE'
          const fs = require('fs');
          const generated = fs.readFileSync('src/lib/dkd_public_env.generated.js', 'utf8');
          const config = JSON.parse(fs.readFileSync('dkd_expo_public_env_config.json', 'utf8'));
          const extra = config?.extra || {};
          const publicEnv = extra.dkd_public_env || {};
          for (const key of ['EXPO_PUBLIC_SUPABASE_URL','EXPO_PUBLIC_SUPABASE_ANON_KEY','EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY','EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN']) {
            const value = String(publicEnv[key] || extra[key] || '').trim();
            if (!value || !generated.includes(key)) throw new Error(`DKD ERROR: ${key} was not embedded.`);
          }
          const permissions = Array.isArray(config?.android?.permissions) ? config.android.permissions : [];
          const forbidden = 'android.permission.FOREGROUND_SERVICE_LOCATION';
          if (permissions.includes(forbidden)) throw new Error(`DKD ERROR: forbidden permission present: ${forbidden}`);
          DKD_NODE

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Configure signed release
        shell: bash
        run: |
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\norg.gradle.daemon=false\norg.gradle.parallel=false\n' >> android/gradle.properties
          mkdir -p android/app/dkd_secure
          printf '%s' "${DKD_ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/dkd_secure/dkd_release_keystore.jks
          cat > android/app/dkd_release_signing.gradle <<'DKD_GRADLE'
          android {
              signingConfigs {
                  dkdRelease {
                      storeFile file('dkd_secure/dkd_release_keystore.jks')
                      storePassword System.getenv('DKD_ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('DKD_ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('DKD_ANDROID_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.dkdRelease }
              }
          }
          DKD_GRADLE
          printf '\napply from: "dkd_release_signing.gradle"\n' >> android/app/build.gradle

      - name: Build signed Release APK
        run: cd android && ./gradlew :app:assembleRelease --no-daemon

      - name: Collect and checksum Release APK
        shell: bash
        run: |
          mkdir -p dkd_signed_apk_output
          cp android/app/build/outputs/apk/release/*.apk dkd_signed_apk_output/DraBornGo-v0.0.14-code14-release.apk
          sha256sum dkd_signed_apk_output/DraBornGo-v0.0.14-code14-release.apk > dkd_signed_apk_output/DraBornGo-v0.0.14-code14-release.apk.sha256
          ls -lh dkd_signed_apk_output

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DraBornGo-v0.0.14-code14-Release-APK
          path: dkd_signed_apk_output/
          if-no-files-found: error
          retention-days: 14
