name: DraBornGo v0.0.17 PR validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sync temporary lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact dependencies
        run: npm ci
      - name: Expo Doctor
        run: npx expo-doctor@latest
      - name: Android Metro export
        run: npx expo export --platform android --output-dir dist-ci
