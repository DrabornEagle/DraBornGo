name: DKD DraBornGo v0.0.6 cleanup

on:
  push:
    branches: [main]
    paths:
      - scripts/dkd_v006_cleanup.mjs

permissions:
  contents: write

concurrency:
  group: dkd-v0-0-6-cleanup
  cancel-in-progress: false

jobs:
  dkd_cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Apply source cleanup
        run: node scripts/dkd_v006_cleanup.mjs apply

      - name: Install Expo SDK 57 dependencies
        run: |
          npm install --legacy-peer-deps --package-lock=false
          npx expo install --fix --npm
          rm -f package-lock.json

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Android JS bundle smoke test
        run: npx expo export --platform android --clear --output-dir /tmp/dkd-v006-export

      - name: Verify forbidden systems are gone
        run: node scripts/dkd_v006_cleanup.mjs verify

      - name: Remove tracked dependency/build artifacts
        run: |
          git rm -r --ignore-unmatch node_modules android ios dist web-build .expo
          rm -rf node_modules android ios dist web-build .expo
          rm -f package-lock.json

      - name: Remove one-shot migration helper
        run: |
          rm -f scripts/dkd_v006_cleanup.mjs
          rm -f .github/workflows/dkd_v0_0_6_cleanup.yml

      - name: Commit v0.0.6
        run: |
          git config user.name "DraBornGo Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "DraBornGo v0.0.6 SDK57 core cleanup" || exit 0
          git push origin main
