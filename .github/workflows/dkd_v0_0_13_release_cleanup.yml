name: DKD v0.0.13 Release Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply v0.0.13 source migration
        run: node tools/dkd_apply_v0013_release_cleanup.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify v0.0.13 identity
        run: npm run dkd:verify-v0.0.13

      - name: Validate retired courier score/rating system
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number -E 'courier_score|courier_rating_avg|courier_rating_count|reward_score' src
          ! grep -R --line-number -E 'courier_score|courier_rating_avg|courier_rating_count|reward_score' \
            supabase/migrations/007_seed_minimal.sql \
            supabase/migrations/20260808172500_dkd_v0_0_9_remove_business_panel_fix_courier.sql \
            supabase/migrations/20260808204500_dkd_v0_0_11_courier_job_complete_rpc.sql \
            supabase/migrations/20260809000519_dkd_v0_0_12_service_hub_support_earnings_admin.sql

      - name: Validate restored v0.0.5-style centers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'GOOGLE PLAY HAZIRLIK' src/features/legal/dkd_google_play_policy_center_modal.js
          grep -q 'Data Safety Özeti' src/features/legal/dkd_google_play_policy_center_modal.js
          grep -q 'Sürüm ve Güncelleme Merkezi' src/features/legal/dkd_app_update_center_modal.js
          grep -q 'dkd_on_app_update_center_value' src/features/navigation/ActionMenuModal.js
          grep -q 'DkdAppUpdateCenterModal' src/core/ModalHost.js
          grep -q 'Saatlik Kazanç' src/features/admin/dkd_admin_user_manager_modal.js
          grep -q 'v0.0.13' src/features/navigation/ActionMenuModal.js

      - name: Android Expo export validation
        run: npx expo export --platform android --output-dir /tmp/dkd-v0013-android

      - name: Web Expo export smoke check
        continue-on-error: true
        run: npx expo export --platform web --output-dir /tmp/dkd-v0013-web

      - name: Write validation marker
        shell: bash
        run: |
          mkdir -p audit
          printf '%s\n' \
            'DraBornGo v0.0.13 release validation: PASS' \
            'Android versionCode: 13' \
            'Checks: identity, retired score/rating/reward code, v0.0.5-style privacy/update centers, admin hourly earnings, Android Expo export' \
            "Validated UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > audit/dkd_v0_0_13_release_validation.txt

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.json package.json package-lock.json scripts src supabase/migrations web audit
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'feat: release DraBornGo v0.0.13 privacy update and courier cleanup [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
