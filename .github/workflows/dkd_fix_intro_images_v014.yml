name: DKD Fix Intro Images v0.0.14

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd_fix_intro_images_v014.yml'

permissions:
  contents: write

jobs:
  fix-intro-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch onboarding image renderer
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/features/onboarding/dkd_pre_login_intro_screen.js';
          let s = fs.readFileSync(path, 'utf8');

          s = s.replace(/\n  Image,\n/, '\n');
          if (!s.includes("from 'expo-image'")) {
            s = s.replace(
              "import { LinearGradient } from 'expo-linear-gradient';",
              "import { LinearGradient } from 'expo-linear-gradient';\nimport { Image as DkdExpoImage } from 'expo-image';"
            );
          }
          s = s.replaceAll('<Image', '<DkdExpoImage');
          s = s.replaceAll('</Image>', '</DkdExpoImage>');
          s = s.replaceAll('resizeMode="cover"', 'contentFit="cover"');

          if (s.includes('<Image') || !s.includes('DkdExpoImage')) throw new Error('expo-image migration failed');
          if (!s.includes("require('../../../assets/dkd_onboarding/dkd_intro_city_ecosystem.png')")) throw new Error('city intro asset missing');
          if (!s.includes("require('../../../assets/dkd_onboarding/dkd_intro_delivery_route.png')")) throw new Error('delivery intro asset missing');
          if (!s.includes("require('../../../assets/dkd_onboarding/dkd_intro_role_hub.png')")) throw new Error('role intro asset missing');
          if (!s.includes("require('../../../assets/dkd_onboarding/dkd_intro_live_tracking.png')")) throw new Error('tracking intro asset missing');

          fs.writeFileSync(path, s);
          NODE

          rm -f .github/workflows/dkd_fix_intro_images_v014.yml

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const s=fs.readFileSync('src/features/onboarding/dkd_pre_login_intro_screen.js','utf8'); if(!s.includes(\"import { Image as DkdExpoImage } from 'expo-image';\")) process.exit(1); if((s.match(/<DkdExpoImage/g)||[]).length<2) process.exit(1); if(s.includes('resizeMode=\"cover\"')) process.exit(1);"
          node -e "const p=require('./package.json'); if(!p.dependencies?.['expo-image']) process.exit(1);"

      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DrabornEagle Release Bot'
          git config user.email 'release-bot@draborneagle.com'
          git add src/features/onboarding/dkd_pre_login_intro_screen.js .github/workflows/dkd_fix_intro_images_v014.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: render onboarding assets with expo-image'
          git push origin HEAD:main
