name: DKD v0.0.7 Remove Legacy Supabase Secrets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd_v007_delete_legacy_edge_functions.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Remove retired SMS secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DKD_PROJECT_REF: ${{ secrets.DKD_SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets unset \
            DKD_ILETIMERKEZI_API_KEY \
            DKD_ILETIMERKEZI_API_HASH \
            DKD_ILETIMERKEZI_OTP_SECRET \
            DKD_ILETIMERKEZI_SENDER \
            --project-ref "$DKD_PROJECT_REF" || true
          {
            echo 'DKD v0.0.7 LEGACY SECRET AUDIT'
            echo 'Remaining ILETIMERKEZI/SMS/OTP project secrets:'
            supabase secrets list --project-ref "$DKD_PROJECT_REF" | grep -Ei 'ILETIMERKEZI|SMS|OTP' || echo 'NONE'
          } > dkd_v007_supabase_secret_audit.txt
      - name: Commit audit
        shell: bash
        run: |
          git config user.name 'DraBornGo v0.0.7 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add dkd_v007_supabase_secret_audit.txt
          git commit -m 'Verify v0.0.7 legacy SMS secrets removed'
          git push origin HEAD:main
