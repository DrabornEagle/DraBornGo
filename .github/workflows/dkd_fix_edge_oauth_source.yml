name: Fix tracked Edge OAuth grant source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd_fix_edge_oauth_source.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix exact OAuth grant type
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/send-courier-order-alert/index.ts')
          s=p.read_text()
          s=s.replace('urn:ietf:params:oauth-type:jwt-bearer','urn:ietf:params:oauth:grant-type:jwt-bearer')
          if 'urn:ietf:params:oauth-type:jwt-bearer' in s:
              raise SystemExit('bad grant type remains')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/send-courier-order-alert/index.ts
          git diff --cached --quiet || (git commit -m 'fix: correct FCM OAuth grant type in tracked Edge source' && git push origin HEAD:main)
