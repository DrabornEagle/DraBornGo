name: DKD v0.0.15 Courier Copy Cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dkd_v0_0_15_courier_copy_cleanup.yml']
permissions:
  contents: write
jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Apply courier-only text migration
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const edits={
            'src/features/auth/AuthScreen.js':[
              ["2026-08-08-v0.0.8","2026-08-09-v0.0.15"],
              ['DraBornGo ŞEHİR GİRİŞ KAPISI','DraBornGo KURYE GİRİŞİ'],
              ['Şehir Ağına Hoş Geldin','Kurye Ağına Hoş Geldin'],
              ['Kurye-Kargo','Görev Havuzu'],['Yemek-Market','Canlı Rota'],['Hizmet Ağı','Kazanç Takibi'],
              ['Şehir merkezine giriş','Kurye merkezine giriş'],
              ['Hesabınla devam et; sipariş havuzu, kurye, işletme ve hizmet ağı akışların açılsın.','Hesabınla devam et; kurye görev havuzu, aktif teslimatlar, canlı rota ve kazanç takibin açılsın.'],
              ['Yeni kayıt sırasında seçtiğin ülke, şehir ve bölge sipariş eşleşmeleri ve hizmet ağı deneyimi için kullanılacak.','Yeni kayıt sırasında seçtiğin ülke, şehir ve bölge; sana uygun kurye görevlerini ve rota akışını göstermek için kullanılacak.'],
              ['Bölgeni seç, kurye-kargo ve market akışlarında doğru sipariş eşleşmesine hazır ol.','Bölgeni seç; kurye görev havuzunda sana uygun teslimatları ve rota akışını görmeye hazır ol.']
            ],
            'src/features/onboarding/dkd_city_gate_transition_screen.js':[
              ["dkd_title_text: 'Rotalar'","dkd_title_text: 'Canlı Rota'"],
              ["dkd_title_text: 'Kurye ağı'","dkd_title_text: 'Görev Havuzu'"],
              ["dkd_icon_name: 'storefront-outline', dkd_title_text: 'Hizmet Ağı', dkd_detail_text: 'aktif'","dkd_icon_name: 'cash-clock', dkd_title_text: 'Kazanç Takibi', dkd_detail_text: 'hazır'"],
              ['DraBornGo güvenli geçiş','DraBornGo kurye geçişi'],['DraBornGo MERKEZİ','DraBornGo KURYE MERKEZİ'],
              ['Şehir ağı açılıyor','Kurye Merkezi Açılıyor'],
              ['Harita, sipariş havuzu, hizmet ağı ve ödül merkezi ana sayfa yüklenene kadar senkronlanıyor.','Görev havuzu, aktif teslimatlar, canlı rota ve kazanç özeti ana sayfa yüklenene kadar hazırlanıyor.']
            ],
            'src/features/onboarding/dkd_pre_login_intro_screen.js':[["KURYE LİSANSI","KURYE ONAYI"]],
            'src/features/applications/dkd_applications_hub_modal.js':[
              ['DKD ONAY MERKEZİ','DBG KURYE ONAY MERKEZİ'],['Kurye Lisansın Aktif','Kurye Onayın Aktif'],
              ['Kurye lisansın onaylandı. Yeni bir kurye başvurusu oluşturman gerekmez.','Kurye hesabın onaylandı. Yeni bir kurye başvurusu oluşturman gerekmez.'],
              ['kurye lisans sürecini başlat','kurye onay sürecini başlat'],
              ['DKD Onay Merkezi kaydın onaylı. Ana sayfadaki Kurye Merkezi ve Sipariş BUL araçlarını kullanabilirsin.','DBG Kurye Onay Merkezi kaydın onaylı. Görev havuzunu açabilir, uygun teslimatları kabul edebilir ve kurye çalışma akışını kullanabilirsin.']
            ],
            'src/features/map/MapHomeScreen.js':[
              ['LİSANS GEREKLİ','KURYE ONAYI GEREKLİ'],['Kurye kimliğini oluştur, lisans onayından sonra canlı görev ağına katıl.','Kurye başvurunu tamamla; onaylandıktan sonra canlı görev havuzuna katıl.'],
              ['SİPARİŞTE','AKTİF GÖREV'],['Siparişte','Görevde'],['Atanmış teslimat tamamlanana kadar kurye durumu kilitli.','Aktif teslimat tamamlanana kadar kurye durumu kilitli.'],
              ['Sipariş araması açık. Yakındaki yeni görevler gerçek zamanlı taranıyor.','Görev araması açık. Yakındaki yeni görevler gerçek zamanlı taranıyor.'],
              ['Hazır olduğunda Sipariş BUL ile yeni görev aramasını başlat.','Hazır olduğunda Görev BUL ile yeni görev aramasını başlat.'],
              ['SİPARİŞ • KURYE RADARI','GÖREV • KURYE RADARI'],['CANLI SİPARİŞ ROTASI','CANLI GÖREV ROTASI'],['Sipariş Havuzu','Görev Havuzu'],['Kurye Ataması','Görevi Kabul Et'],
              ['dkd_label_value="SİPARİŞ"','dkd_label_value="GÖREV"'],['Sipariş Aktif','Görev Aktif'],['Siparişler Taranıyor • Durdur','Görevler Taranıyor • Durdur'],['Sipariş BUL','Görev BUL'],
              ['Sipariş havuzu, aktif teslimatlar, kargo ve performans akışını kurye odaklı tek merkezden yönet.','Görev havuzunu görüntüle, uygun teslimatı kabul et, alım/teslimat adımlarını yönet ve aktif rota ile kazanç özetini takip et.']
            ],
            'src/features/courier/dkd_courier_board_modal_v2.js':[
              ['DKD KURYE MERKEZİ','DBG KURYE MERKEZİ'],['Sipariş tekliflerini, rota adımlarını ve aktif teslimatlarını canlı yönet.','Gelen kurye görevlerini, rota adımlarını ve aktif teslimatlarını canlı yönet.'],
              ['LİSANS DURUMU','ONAY DURUMU'],['Kurye Lisansı Gerekli','Kurye Onayı Gerekli'],['Çevrimiçi • Sipariş Radarı Açık','Çevrimiçi • Görev Radarı Açık'],
              ['Üzerindeki sipariş tamamlanana kadar kurye operasyon durumu aktif kalır.','Üzerindeki görev tamamlanana kadar kurye operasyon durumu aktif kalır.'],['Bölgen için uygun yeni siparişler canlı taranıyor.','Bölgen için uygun yeni görevler canlı taranıyor.'],
              ['Görev almak için çevrimiçi ol ve sipariş radarını başlat.','Görev almak için çevrimiçi ol ve görev radarını başlat.'],['Aktif Siparişi Tamamla','Aktif Görevi Tamamla'],['Sipariş Radarını Durdur','Görev Radarını Durdur'],['Çevrimiçi Ol • Sipariş Ara','Çevrimiçi Ol • Görev Ara']
            ],
            'src/features/courier/CourierBoardModal.js':[['DKD KURYE MERKEZİ','DBG KURYE MERKEZİ'],['Kurye Lisansı Gerekli','Kurye Onayı Gerekli']],
            'src/features/courier/dkd_courier_application_panel.js':[['Kurye lisansını oluştur','Kurye başvurunu tamamla'],['Kimlik, bölge, araç ve iletişim bilgilerini tek akışta tamamla. Başvuru yalnız admin onayından sonra kurye yetkisi açar.','Kimlik, bölge, araç ve iletişim bilgilerini tek akışta tamamla. Kurye görevlerine erişim yalnız admin onayından sonra açılır.']],
            'src/features/profile/ProfileModal.js':[['Profilini, kurye lisansını ve hesap ayarlarını buradan yönet.','Profilini, kurye onay durumunu ve hesap ayarlarını buradan yönet.'],['Kurye Lisansı Aktif','Kurye Onayı Aktif']],
            'src/utils/courier.js':[['Kurye Lisansı Aktif','Kurye Onayı Aktif'],['Kurye lisansın aktif.','Kurye onayın aktif.']],
            'src/core/GameFlow.js':[['Çevrimiçi mod için kurye lisansının onaylanmış olması gerekiyor.','Çevrimiçi mod için kurye başvurunun onaylanmış olması gerekiyor.']],
            'src/features/navigation/ActionMenuModal.js':[['Teslimat, çevrimiçi durum ve aktif kurye araçları.','Görev havuzu, aktif teslimat, canlı rota ve kazanç akışını tek merkezden yönet.'],['Şehir ağı bağlantısı hazır','Kurye ağı bağlantısı hazır']],
            'src/features/admin/AdminMenuModal.js':[['Admin oturumu aktif • DraBornGo v0.0.12','Admin oturumu aktif • DraBornGo v0.0.15'],['Kurye lisans başvurularını incele.','Kurye onay başvurularını incele.']],
            'src/features/admin/dkd_admin_applications_modal.js':[['Kurye lisansı ve hesap silme taleplerini yönet.','Kurye onay başvuruları ve hesap silme taleplerini yönet.']],
            'src/features/legal/dkd_google_play_policy_center_modal.js':[['kurye başvurusu ve lisans durumu','kurye başvurusu ve onay durumu'],['Kurye başvurusu ve lisans/onay sürecinde','Kurye başvurusu ve onay sürecinde']]
          };
          for (const [path,reps] of Object.entries(edits)) {
            let s=fs.readFileSync(path,'utf8');
            for(const [a,b] of reps) s=s.split(a).join(b);
            fs.writeFileSync(path,s);
          }
          NODE
      - name: Verify changed copy
        shell: bash
        run: |
          grep -q 'Kurye Ağına Hoş Geldin' src/features/auth/AuthScreen.js
          grep -q 'Kurye Merkezi Açılıyor' src/features/onboarding/dkd_city_gate_transition_screen.js
          grep -q 'DBG KURYE ONAY MERKEZİ' src/features/applications/dkd_applications_hub_modal.js
          grep -q 'DBG KURYE MERKEZİ' src/features/courier/dkd_courier_board_modal_v2.js
          grep -q 'Kurye Onayı Aktif' src/features/profile/ProfileModal.js
          grep -q 'Görev havuzunu görüntüle, uygun teslimatı kabul et' src/features/map/MapHomeScreen.js
      - run: npm ci
      - run: npm run dkd:verify-v0.0.15
      - run: npm run dkd:play-risk-scan
      - run: npx expo export --platform android --output-dir /tmp/dkd-v0015-courier-copy-export
      - name: Commit result
        shell: bash
        run: |
          rm -f .github/workflows/dkd_v0_0_15_courier_copy_cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ui: align login loading and courier copy with courier-only scope'
          git push
