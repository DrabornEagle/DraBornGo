name: DKD v0.0.5 Manifest Runner

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: dkd-v0-0-5-manifest-runner
  cancel-in-progress: false

jobs:
  manifest:
    if: github.event.pull_request.title == '[DKD] Export v0.0.5 transformed manifest'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Apply deterministic upgrade
        run: python3 scripts/dkd_apply_v0_0_5_upgrade.py

      - name: Restrict verifier to active runtime code
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          dkd_path = Path('scripts/dkd_verify_release_identity.mjs')
          dkd_text = dkd_path.read_text(encoding='utf-8')
          dkd_text = dkd_text.replace("['src', 'scripts', 'tools', 'supabase/functions']", "['src', 'supabase/functions']")
          dkd_path.write_text(dkd_text, encoding='utf-8')
          PY

      - name: Install and align Expo SDK 54 packages
        shell: bash
        run: |
          npm install
          npx expo install --fix
          npm run env:restore

      - name: Verify version, identity and environment
        run: npm run dkd:verify-v0.0.5

      - name: Validate Expo public config
        shell: bash
        run: |
          npx expo config --type public --json >/tmp/dkd_expo_public_config.json
          node -e "const c=require('/tmp/dkd_expo_public_config.json'); if(c.version!=='0.0.5'||Number(c.android?.versionCode)!==5) process.exit(1); console.log('Expo config v0.0.5 / 5 doğrulandı.');"

      - name: Bundle Android JavaScript
        shell: bash
        run: |
          rm -rf .dkd-export-check
          npx expo export --platform android --output-dir .dkd-export-check --clear
          rm -rf .dkd-export-check

      - name: Build Git Data manifest
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64
          import json
          import os
          import stat
          import subprocess

          def dkd_git(*dkd_args, dkd_binary=False):
              dkd_result = subprocess.check_output(['git', *dkd_args])
              return dkd_result if dkd_binary else dkd_result.decode('utf-8').strip()

          def dkd_null_list(dkd_bytes):
              return [dkd_value.decode('utf-8') for dkd_value in dkd_bytes.split(b'\0') if dkd_value]

          dkd_changed_paths = set(dkd_null_list(dkd_git('diff', '--no-renames', '--name-only', '-z', 'HEAD', dkd_binary=True)))
          dkd_changed_paths.update(dkd_null_list(dkd_git('ls-files', '--others', '--exclude-standard', '-z', dkd_binary=True)))
          dkd_entries = []
          for dkd_relative_path in sorted(dkd_changed_paths):
              dkd_path = Path(dkd_relative_path)
              if not dkd_path.exists():
                  dkd_entries.append({'path': dkd_relative_path, 'delete': True})
                  continue
              if not dkd_path.is_file():
                  continue
              dkd_mode = '100755' if (dkd_path.stat().st_mode & stat.S_IXUSR) else '100644'
              dkd_entries.append({
                  'path': dkd_relative_path,
                  'delete': False,
                  'mode': dkd_mode,
                  'content_base64': base64.b64encode(dkd_path.read_bytes()).decode('ascii'),
              })

          dkd_manifest = {
              'parent_sha': dkd_git('rev-parse', 'HEAD'),
              'base_tree_sha': dkd_git('rev-parse', 'HEAD^{tree}'),
              'entries': dkd_entries,
          }
          dkd_output_path = Path('/tmp/dkd_v0_0_5_manifest.json')
          dkd_output_path.write_text(json.dumps(dkd_manifest, ensure_ascii=False), encoding='utf-8')
          print(f'Manifest entries: {len(dkd_entries)}')
          PY

      - name: Upload transformed manifest
        uses: actions/upload-artifact@v4
        with:
          name: dkd-v0-0-5-transformed-manifest
          path: /tmp/dkd_v0_0_5_manifest.json
          if-no-files-found: error
          retention-days: 7
