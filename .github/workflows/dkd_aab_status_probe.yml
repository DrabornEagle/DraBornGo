name: Dkd AAB Status Probe

on:
  push:
    branches:
      - 'release/aab-status-*'

permissions:
  actions: read
  contents: write

jobs:
  dkd_read_aab_status:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dkd checkout status branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dkd read recent AAB workflow runs
        shell: bash
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/dkd_build_signed_aab.yml/runs?branch=main&per_page=10" > dkd_aab_runs_raw.json
          node <<'DKD_NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('dkd_aab_runs_raw.json','utf8'));
          const rows=(data.workflow_runs||[]).map((run)=>({
            id: run.id,
            run_number: run.run_number,
            event: run.event,
            status: run.status,
            conclusion: run.conclusion,
            head_sha: run.head_sha,
            created_at: run.created_at,
            updated_at: run.updated_at
          }));
          fs.writeFileSync('dkd_aab_recent_runs.json',JSON.stringify(rows,null,2)+'\n');
          DKD_NODE
          rm -f dkd_aab_runs_raw.json
          git config user.name 'DrabornEagle AAB Status Probe'
          git config user.email 'actions@users.noreply.github.com'
          git add dkd_aab_recent_runs.json
          git commit -m 'chore: record recent AAB run status'
          git push origin HEAD:${GITHUB_REF_NAME}
