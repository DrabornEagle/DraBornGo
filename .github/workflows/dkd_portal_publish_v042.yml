name: Publish DraBornPortal v0.4.2 APK

permissions:
  contents: write
  actions: read

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd_portal_publish_v042.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified signed APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/DrabornEagle/DraBornGo/actions/artifacts/10542132470/zip > portal.zip
          unzip -q portal.zip -d portal
          test -f portal/DraBornPortal-v0.4.2-code1-signed.apk

      - name: Publish stable download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="drabornportal-v0.4.2-code1"
          apk="portal/DraBornPortal-v0.4.2-code1-signed.apk"
          if gh release view "$tag" -R DrabornEagle/DraBornGo >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber -R DrabornEagle/DraBornGo
          else
            gh release create "$tag" "$apk" -R DrabornEagle/DraBornGo \
              --title "DraBornPortal v0.4.2 • Android code 1" \
              --notes "DrabornEagle Oyun Çevirisi • Signed Release APK • versionName 0.4.2 • versionCode 1."
          fi
