name: Dkd AAB Dispatch Probe

on:
  push:
    branches:
      - 'release/aab-dispatch-*'

permissions:
  contents: write

jobs:
  dkd_probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dkd mark dispatcher branch execution
        shell: bash
        run: |
          printf 'dispatcher branch workflow started\n' > dkd_aab_dispatch_probe_result.txt
          git config user.name 'DrabornEagle Dispatch Probe'
          git config user.email 'actions@users.noreply.github.com'
          git add dkd_aab_dispatch_probe_result.txt
          git commit -m 'chore: confirm AAB dispatch branch workflow'
          git push origin HEAD:${GITHUB_REF_NAME}
