name: DraBornGo v0.0.6 Lockfile

on:
  push:
    paths:
      - '.github/workflows/dkd_generate_lock_v006.yml'

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Generate package-lock
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts

      - name: Commit package-lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock.json already current'
          else
            git commit -m 'Generate SDK57 package lock'
            git push origin main
          fi
