name: DKD Apply Heartbeat Guard Once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  dkd-apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch client heartbeat behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path('src/services/courierService.js')
          s = service.read_text()
          marker = "export async function dkd_reject_courier_job(dkd_job_id_value) {"
          addition = """export async function dkd_courier_online_heartbeat(dkd_input_value = {}) {\n  const dkd_live_lat_value = Number(dkd_input_value?.dkd_live_lat);\n  const dkd_live_lng_value = Number(dkd_input_value?.dkd_live_lng);\n  return supabase.rpc('dkd_courier_online_heartbeat_dkd', {\n    dkd_param_country: String(dkd_input_value?.dkd_country || 'Türkiye').trim() || 'Türkiye',\n    dkd_param_city: String(dkd_input_value?.dkd_city || 'Ankara').trim() || 'Ankara',\n    dkd_param_region: String(dkd_input_value?.dkd_region || '').trim(),\n    dkd_param_live_lat: Number.isFinite(dkd_live_lat_value) ? dkd_live_lat_value : null,\n    dkd_param_live_lng: Number.isFinite(dkd_live_lng_value) ? dkd_live_lng_value : null,\n  });\n}\n\n"""
          if 'export async function dkd_courier_online_heartbeat' not in s:
              if marker not in s: raise SystemExit('service marker missing')
              s = s.replace(marker, addition + marker, 1)
          service.write_text(s)

          watcher = Path('src/features/courier/dkd_courier_online_global_watcher.js')
          w = watcher.read_text()
          if '  dkd_courier_online_heartbeat,\n' not in w:
              w = w.replace('  dkd_set_courier_online_status,\n', '  dkd_courier_online_heartbeat,\n  dkd_set_courier_online_status,\n', 1)
          old = """      const dkd_online_result_value = await dkd_set_courier_online_status({\n        dkd_online: true,\n        dkd_country: dkd_region_value.dkd_country_value,\n        dkd_city: dkd_region_value.dkd_city_value,\n        dkd_region: dkd_region_value.dkd_zone_value,\n        dkd_live_lat: Number.isFinite(dkd_live_lat_value) ? dkd_live_lat_value : null,\n        dkd_live_lng: Number.isFinite(dkd_live_lng_value) ? dkd_live_lng_value : null,\n      });\n      if (dkd_online_result_value?.error) throw dkd_online_result_value.error;\n"""
          new = """      const dkd_online_result_value = await dkd_courier_online_heartbeat({\n        dkd_country: dkd_region_value.dkd_country_value,\n        dkd_city: dkd_region_value.dkd_city_value,\n        dkd_region: dkd_region_value.dkd_zone_value,\n        dkd_live_lat: Number.isFinite(dkd_live_lat_value) ? dkd_live_lat_value : null,\n        dkd_live_lng: Number.isFinite(dkd_live_lng_value) ? dkd_live_lng_value : null,\n      });\n      if (dkd_online_result_value?.error) throw dkd_online_result_value.error;\n      if (dkd_online_result_value?.data?.dkd_online_value === false) {\n        dkd_online_ref_value.current = false;\n        dkd_scan_token_ref_value.current += 1;\n        setDkdOfferJobValue(null);\n        setDkdHasActiveJobStateValue(false);\n        dkd_set_profile_value?.((dkd_previous_profile_value) => (dkd_previous_profile_value ? {\n          ...dkd_previous_profile_value,\n          dkd_courier_online: false,\n          dkd_courier_auto_assigned_job_id: null,\n        } : dkd_previous_profile_value));\n        return;\n      }\n"""
          if 'await dkd_courier_online_heartbeat({' not in w:
              if old not in w: raise SystemExit('watcher marker missing')
              w = w.replace(old, new, 1)
          watcher.write_text(w)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/courierService.js src/features/courier/dkd_courier_online_global_watcher.js
          git rm .github/workflows/dkd-v0016-apply-heartbeat-guard-once.yml
          git commit -m "fix: preserve business forced-offline courier state"
          git push
