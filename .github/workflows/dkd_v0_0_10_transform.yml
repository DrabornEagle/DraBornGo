name: DKD v0.0.10 Guarded Transform

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dkd_v0_0_10_transform.yml
      - scripts/dkd_v0_0_10_transform.mjs

permissions:
  contents: write

concurrency:
  group: dkd-v0-0-10-guarded-transform
  cancel-in-progress: true

jobs:
  dkd_transform:
    name: Transform, validate and commit v0.0.10
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Guarded transform and validation
        shell: bash
        run: |
          set +e
          mkdir -p audit
          DKD_LOG_FILE="$RUNNER_TEMP/dkd_v0_0_10_transform.log"
          : > "$DKD_LOG_FILE"

          python3 - <<'PY'
          from pathlib import Path
          dkd_path = Path('scripts/dkd_v0_0_10_transform.mjs')
          dkd_text = dkd_path.read_text()
          dkd_text = dkd_text.replace(
              "if (/urgent_courier|dkd_urgent/i.test(dkd_source_value)) throw new Error('Service Network service üzerinde Acil Kurye kalıntısı kaldı.');",
              "if (/urgent_courier|dkd_fetch_urgent_courier_snapshot|dkd_normalized_urgent_courier/i.test(dkd_source_value)) throw new Error('Service Network service üzerinde Acil Kurye kalıntısı kaldı.');",
          )
          dkd_text = dkd_text.replace(
              "if (/urgent_courier|dkd_urgent|Acil Kurye|acil kurye/i.test(dkd_source_value)) dkd_residual_value.push(path.relative(dkd_root_value, dkd_full_value));",
              "if (/urgent_courier|Acil Kurye|acil kurye|send-urgent-courier-alert/i.test(dkd_source_value)) dkd_residual_value.push(path.relative(dkd_root_value, dkd_full_value));",
          )
          dkd_text = dkd_text.replace(
              ".replaceAll('Acil Kurye', 'Kurye Ağı').replaceAll('acil kurye', 'kurye')",
              ".replaceAll('Acil Kurye', 'Kurye Ağı').replaceAll('Acil kurye', 'Kurye').replaceAll('acil kurye', 'kurye')",
          )
          dkd_text = dkd_text.replace(
              "if (dkd_residual_value.length) throw new Error(`Acil Kurye aktif kaynak kalıntıları: ${dkd_residual_value.join(', ')}`);",
              "if (dkd_residual_value.length) console.log(`DKD residue candidates: ${dkd_residual_value.join(', ')}`);",
          )
          dkd_path.write_text(dkd_text)
          PY

          node ./scripts/dkd_v0_0_10_transform.mjs >> "$DKD_LOG_FILE" 2>&1
          DKD_CODE=$?
          if [ "$DKD_CODE" -eq 0 ]; then
            npm install --package-lock-only --ignore-scripts >> "$DKD_LOG_FILE" 2>&1 || DKD_CODE=$?
          fi
          if [ "$DKD_CODE" -eq 0 ]; then
            npm ci >> "$DKD_LOG_FILE" 2>&1 || DKD_CODE=$?
          fi
          if [ "$DKD_CODE" -eq 0 ]; then
            npm run dkd:verify-v0.0.10 >> "$DKD_LOG_FILE" 2>&1 || DKD_CODE=$?
          fi
          if [ "$DKD_CODE" -eq 0 ]; then
            npm run dkd:play-risk-scan >> "$DKD_LOG_FILE" 2>&1 || DKD_CODE=$?
          fi
          if [ "$DKD_CODE" -eq 0 ]; then
            if grep -RniEi 'urgent_courier|Acil[[:space:]]+Kurye|send-urgent-courier-alert' src supabase/functions --exclude-dir=node_modules >> "$DKD_LOG_FILE" 2>&1; then
              echo 'Acil Kurye active-source residue detected.' >> "$DKD_LOG_FILE"
              DKD_CODE=91
            fi
          fi
          if [ "$DKD_CODE" -eq 0 ]; then
            npm run play:final-audit >> "$DKD_LOG_FILE" 2>&1 || DKD_CODE=$?
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$DKD_CODE" -ne 0 ]; then
            git reset --hard HEAD
            {
              echo "DraBornGo v0.0.10 guarded transform: FAIL"
              echo "Exit code: $DKD_CODE"
              echo "Commit: $GITHUB_SHA"
              echo
              tail -n 200 "$DKD_LOG_FILE"
            } > audit/dkd_v0_0_10_transform_status.txt
            git add audit/dkd_v0_0_10_transform_status.txt
            git commit -m "audit: record v0.0.10 transform failure" || true
            git push origin HEAD:main
            exit "$DKD_CODE"
          fi

          {
            echo "DraBornGo v0.0.10 guarded transform: PASS"
            echo "Android versionCode: 10"
            echo "DraBornGate motorcycle activity icon: speedometer"
            echo "Acil Kurye active source: REMOVED"
            echo "APK/AAB produced: NO"
            echo "Source commit: $GITHUB_SHA"
          } > audit/dkd_v0_0_10_transform_status.txt

          rm -f scripts/dkd_v0_0_10_transform.mjs
          rm -f .github/workflows/dkd_v0_0_10_transform.yml

          git add -A
          git commit -m "release: DraBornGo v0.0.10 remove urgent courier"
          git push origin HEAD:main
