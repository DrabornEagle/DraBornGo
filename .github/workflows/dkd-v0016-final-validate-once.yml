name: DKD v0.0.16 Final Validate Once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  dkd-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Clean install
        run: npm ci
      - name: Expo Doctor
        run: npx expo-doctor@latest --verbose
      - name: Android Metro bundle
        run: npx expo export --platform android --output-dir /tmp/dkd-v0016-final
      - name: Record success and self-clean
        shell: bash
        run: |
          printf '%s\n' 'DKD_NPM_CI=PASS' 'DKD_EXPO_DOCTOR=PASS' 'DKD_ANDROID_METRO_BUNDLE=PASS' > dkd-v0016-final-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dkd-v0016-final-validation.txt
          git rm .github/workflows/dkd-v0016-final-validate-once.yml
          git commit -m "chore: record final v0.0.16 validation"
          git push
