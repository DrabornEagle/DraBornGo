name: DraBornGo Expo Go Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dkd-expo-go-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dkd_quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22.13
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install Expo Go dependencies
        run: npm install --legacy-peer-deps --package-lock=false

      - name: Metro Babel syntax check
        run: npm run dkd:syntax:check

      - name: Expo dependency compatibility
        run: npx expo install --check

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Verify v0.0.6 release identity and Expo Go policy baseline
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const app = require('./app.json').expo;
          const pkg = require('./package.json');

          const fail = (message) => { throw new Error(message); };
          if (app.version !== '0.0.6') fail(`app.json version beklenmeyen değer: ${app.version}`);
          if (pkg.version !== '0.0.6') fail(`package.json version beklenmeyen değer: ${pkg.version}`);
          if (app.android?.versionCode !== 6) fail(`Android versionCode 6 olmalı: ${app.android?.versionCode}`);
          if (app.android?.package !== 'com.draborneagle.draborngo') fail('Android package değişmiş.');
          if (!String(pkg.dependencies?.expo || '').startsWith('~57.')) fail('Expo SDK 57 hattı gerekli.');
          if (pkg.dependencies?.react !== '19.2.3') fail('SDK 57 React 19.2.3 hattı gerekli.');
          if (!String(pkg.dependencies?.['react-native'] || '').startsWith('0.86.')) fail('SDK 57 React Native 0.86 hattı gerekli.');
          if (app.newArchEnabled === false) fail('SDK 57/Expo Go New Architecture kapatılamaz; newArchEnabled:false kaldırılmalı.');

          const requested = new Set(app.android?.permissions || []);
          const allowed = new Set([
            'android.permission.ACCESS_COARSE_LOCATION',
            'android.permission.ACCESS_FINE_LOCATION',
          ]);
          for (const permission of requested) {
            if (!allowed.has(permission)) fail(`v0.0.6 için beklenmeyen Android izni: ${permission}`);
          }

          const requiredBlocked = [
            'android.permission.ACCESS_BACKGROUND_LOCATION',
            'android.permission.FOREGROUND_SERVICE',
            'android.permission.FOREGROUND_SERVICE_LOCATION',
            'android.permission.RECORD_AUDIO',
            'android.permission.READ_MEDIA_IMAGES',
            'android.permission.READ_MEDIA_VIDEO',
            'android.permission.READ_EXTERNAL_STORAGE',
            'android.permission.WRITE_EXTERNAL_STORAGE',
            'android.permission.SYSTEM_ALERT_WINDOW',
            'android.permission.QUERY_ALL_PACKAGES',
            'android.permission.REQUEST_INSTALL_PACKAGES',
            'android.permission.USE_FULL_SCREEN_INTENT',
          ];
          const blocked = new Set(app.android?.blockedPermissions || []);
          for (const permission of requiredBlocked) {
            if (!blocked.has(permission)) fail(`Politika koruması eksik: ${permission}`);
          }

          const forbiddenExpoGoDeps = [
            '@rnmapbox/maps',
            'expo-camera',
            'expo-image-picker',
            'expo-notifications',
            'expo-task-manager',
          ];
          for (const dep of forbiddenExpoGoDeps) {
            if (pkg.dependencies?.[dep] || pkg.devDependencies?.[dep]) fail(`v0.0.6 Expo Go tabanında yasak bağımlılık: ${dep}`);
          }

          const scripts = Object.values(pkg.scripts || {}).join('\n');
          if (/eas\s+build|gradlew|assembleRelease|bundleRelease|fastlane/i.test(scripts)) {
            fail('APK/AAB/build komutu v0.0.6 test scriptlerine eklenmiş.');
          }

          for (const path of [
            'web/DraBornGo/privacy/index.html',
            'web/DraBornGo/account-deletion/index.html',
            'web/DraBornGo/terms/index.html',
          ]) {
            if (!fs.existsSync(path)) fail(`Google Play web kaynağı eksik: ${path}`);
          }
          NODE

      - name: Verify public runtime config has no unused Mapbox token
        run: |
          node -e "const c=require('./config/dkd_public_env.defaults.json'); if(c.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN) throw new Error('Kullanılmayan Mapbox tokenı public defaults içinde kalmış.');"
