name: DraBornGo Expo Go Quality

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dkd_quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --package-lock=false

      - name: Metro Babel syntax check
        run: npm run dkd:syntax:check

      - name: Expo dependency check
        run: npx expo install --check

      - name: Expo Doctor
        run: npx expo-doctor
