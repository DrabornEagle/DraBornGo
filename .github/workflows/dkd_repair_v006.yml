name: DraBornGo v0.0.6 Repair

on:
  push:
    paths:
      - '.dkd-repair-trigger'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Repair courier flow syntax and version label
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/core/dkd_courier_flow_v2.js')
          text = path.read_text(encoding='utf-8')
          old = "dkd_e_value(Ionicons, { name: 'arrow-forward-circle', size: 23, color: '#041019' })) })) )),"
          new = "dkd_e_value(Ionicons, { name: 'arrow-forward-circle', size: 23, color: '#041019' })) }) )),"
          if old not in text:
              raise SystemExit('Expected syntax pattern not found; refusing blind edit.')
          text = text.replace(old, new, 1)
          text = text.replace('Expo Go 57.0.2 • Android versionCode 3', 'Expo Go 57.0.2 • Android versionCode 6')
          path.write_text(text, encoding='utf-8')
          PY
          node --check src/core/dkd_courier_flow_v2.js

      - name: Install Expo compatible dependencies
        shell: bash
        run: |
          npx expo install expo-font
          npm install --save-dev typescript@~6.0.3 @types/react@~19.2.4 --legacy-peer-deps
          npm install --legacy-peer-deps

      - name: Validate
        shell: bash
        run: |
          node --check src/core/dkd_courier_flow_v2.js
          npx expo-doctor || true

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "DraBornGo Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/core/dkd_courier_flow_v2.js package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix DraBornGo v0.0.6 Expo Go startup"
          git push origin HEAD:main
