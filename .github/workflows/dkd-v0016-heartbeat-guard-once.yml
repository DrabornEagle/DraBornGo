name: DKD v0.0.16 Heartbeat Guard Once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  dkd-heartbeat-guard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Apply heartbeat guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dkd_service_path = Path('src/services/courierService.js')
          dkd_service_text = dkd_service_path.read_text()
          dkd_marker = """export async function dkd_reject_courier_job(dkd_job_id_value) {"""
          dkd_addition = """export async function dkd_courier_online_heartbeat(dkd_input_value = {}) {\n  const dkd_live_lat_value = Number(dkd_input_value?.dkd_live_lat);\n  const dkd_live_lng_value = Number(dkd_input_value?.dkd_live_lng);\n  return supabase.rpc('dkd_courier_online_heartbeat_dkd', {\n    dkd_param_country: String(dkd_input_value?.dkd_country || 'Türkiye').trim() || 'Türkiye',\n    dkd_param_city: String(dkd_input_value?.dkd_city || 'Ankara').trim() || 'Ankara',\n    dkd_param_region: String(dkd_input_value?.dkd_region || '').trim(),\n    dkd_param_live_lat: Number.isFinite(dkd_live_lat_value) ? dkd_live_lat_value : null,\n    dkd_param_live_lng: Number.isFinite(dkd_live_lng_value) ? dkd_live_lng_value : null,\n  });\n}\n\n"""
          if 'export async function dkd_courier_online_heartbeat' not in dkd_service_text:
              if dkd_marker not in dkd_service_text:
                  raise SystemExit('courierService heartbeat insertion marker missing')
              dkd_service_text = dkd_service_text.replace(dkd_marker, dkd_addition + dkd_marker)
          dkd_service_path.write_text(dkd_service_text)

          dkd_watcher_path = Path('src/features/courier/dkd_courier_online_global_watcher.js')
          dkd_watcher_text = dkd_watcher_path.read_text()
          dkd_watcher_text = dkd_watcher_text.replace(
              "  dkd_set_courier_online_status,\n",
              "  dkd_courier_online_heartbeat,\n  dkd_set_courier_online_status,\n",
              1,
          )
          dkd_old_call = """      const dkd_online_result_value = await dkd_set_courier_online_status({\n        dkd_online: true,\n        dkd_country: dkd_region_value.dkd_country_value,\n        dkd_city: dkd_region_value.dkd_city_value,\n        dkd_region: dkd_region_value.dkd_zone_value,\n        dkd_live_lat: Number.isFinite(dkd_live_lat_value) ? dkd_live_lat_value : null,\n        dkd_live_lng: Number.isFinite(dkd_live_lng_value) ? dkd_live_lng_value : null,\n      });\n      if (dkd_online_result_value?.error) throw dkd_online_result_value.error;\n"""
          dkd_new_call = """      const dkd_online_result_value = await dkd_courier_online_heartbeat({\n        dkd_country: dkd_region_value.dkd_country_value,\n        dkd_city: dkd_region_value.dkd_city_value,\n        dkd_region: dkd_region_value.dkd_zone_value,\n        dkd_live_lat: Number.isFinite(dkd_live_lat_value) ? dkd_live_lat_value : null,\n        dkd_live_lng: Number.isFinite(dkd_live_lng_value) ? dkd_live_lng_value : null,\n      });\n      if (dkd_online_result_value?.error) throw dkd_online_result_value.error;\n      if (dkd_online_result_value?.data?.dkd_online_value === false) {\n        dkd_online_ref_value.current = false;\n        dkd_scan_token_ref_value.current += 1;\n        setDkdOfferJobValue(null);\n        setDkdHasActiveJobStateValue(false);\n        dkd_set_profile_value?.((dkd_previous_profile_value) => (dkd_previous_profile_value ? {\n          ...dkd_previous_profile_value,\n          dkd_courier_online: false,\n          dkd_courier_auto_assigned_job_id: null,\n        } : dkd_previous_profile_value));\n        return;\n      }\n"""
          if 'await dkd_courier_online_heartbeat({' not in dkd_watcher_text:
              if dkd_old_call not in dkd_watcher_text:
                  raise SystemExit('watcher online heartbeat call marker missing')
              dkd_watcher_text = dkd_watcher_text.replace(dkd_old_call, dkd_new_call, 1)
          dkd_watcher_path.write_text(dkd_watcher_text)
          PY
      - name: Clean install
        run: npm ci
      - name: Expo Doctor
        run: npx expo-doctor@latest --verbose
      - name: Android Metro bundle
        run: npx expo export --platform android --output-dir /tmp/dkd-v0016-heartbeat
      - name: Commit and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/courierService.js src/features/courier/dkd_courier_online_global_watcher.js
          git rm .github/workflows/dkd-v0016-heartbeat-guard-once.yml
          git commit -m "fix: preserve business forced-offline courier state"
          git push
