name: DKD v0.0.14 PR Source Sync

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: dkd-v0-0-14-pr-source-sync
  cancel-in-progress: false

jobs:
  dkd_sync_v014:
    if: github.event.pull_request.title == '[DKD] Sync DraBornGo v0.0.14 Source'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply v0.0.14 source sync
        run: node ./tools/dkd_v0_0_14_release_sync.mjs

      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify release identity
        run: npm run dkd:verify-v0.0.14

      - name: Install dependencies for validation
        run: npm install --no-package-lock

      - name: Expo dependency check
        run: npx expo install --check

      - name: Google Play source risk scan
        run: npm run dkd:play-risk-scan

      - name: Android and web source audit
        run: npm run play:final-audit

      - name: Commit synchronized source to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json app.config.js package.json package-lock.json scripts/dkd_verify_release_identity.mjs src web supabase/migrations/20260809161500_dkd_v0_0_14_policy_and_courier_rpc_grants.sql
          if git diff --cached --quiet; then
            echo "DraBornGo v0.0.14 source already synchronized."
            exit 0
          fi
          git commit -m "release: DraBornGo v0.0.14 source and policy sync"
          git pull --rebase origin main
          git push origin HEAD:main
