name: DKD v0.0.10 Full Repo Residue Scan

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dkd_v0_0_10_repo_scan.yml

permissions:
  contents: write

jobs:
  dkd_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scan complete repository
        shell: bash
        run: |
          mkdir -p audit
          {
            echo "DraBornGo v0.0.10 full repository Acil Kurye residue scan"
            echo "Commit: ${GITHUB_SHA}"
            echo
            grep -RniEi 'urgent_courier|Acil[[:space:]]+Kurye|send-urgent-courier-alert' . \
              --exclude-dir=.git \
              --exclude-dir=node_modules \
              --exclude='dkd_v0_0_10_full_repo_residue.txt' \
              --exclude='dkd_v0_0_10_transform_status.txt' \
              || true
          } > audit/dkd_v0_0_10_full_repo_residue.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/dkd_v0_0_10_full_repo_residue.txt
          git commit -m "audit: record v0.0.10 full repo residue scan" || true
          git push origin HEAD:main
