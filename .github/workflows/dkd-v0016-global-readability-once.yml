name: DKD v0.0.16 Global Readability Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  dkd-readability:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Raise only micro typography
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          dkd_extensions = {'.js', '.jsx', '.ts', '.tsx'}
          dkd_paths = [p for p in Path('src').rglob('*') if p.is_file() and p.suffix in dkd_extensions]

          def dkd_raise_micro_font(dkd_match):
              dkd_value = float(dkd_match.group(1))
              if dkd_value >= 11:
                  return dkd_match.group(0)
              dkd_new_value = min(12.5, max(11.0, dkd_value + 2.0))
              dkd_text = f'{dkd_new_value:.1f}'.rstrip('0').rstrip('.')
              return 'fontSize: ' + dkd_text

          for dkd_path in dkd_paths:
              dkd_text = dkd_path.read_text()
              dkd_new_text = re.sub(r'fontSize:\s*(\d+(?:\.\d+)?)', dkd_raise_micro_font, dkd_text)
              if dkd_new_text != dkd_text:
                  dkd_path.write_text(dkd_new_text)
          PY
      - name: Install
        run: npm ci
      - name: Expo Doctor
        run: npx expo-doctor@latest --verbose
      - name: Android Metro bundle
        run: npx expo export --platform android --output-dir /tmp/dkd-v0016-global-readability
      - name: Commit and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git rm .github/workflows/dkd-v0016-global-readability-once.yml
          git commit -m "feat: improve app-wide micro text readability"
          git push
