name: DKD v0.0.5 Git Data Publisher

on:
  push:
    paths:
      - ".dkd_run_v0_0_5_gitdata"
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: dkd-v0-0-5-gitdata-publisher
  cancel-in-progress: false

jobs:
  upgrade:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'issues' && github.event.issue.title == '[DKD] Publish v0.0.5 with Git Data') ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.title == '[DKD] Publish v0.0.5 with Git Data')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      DKD_TARGET_BRANCH: "dkd-v0-0-5-ready"
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Apply deterministic upgrade
        run: python3 scripts/dkd_apply_v0_0_5_upgrade.py

      - name: Restrict verifier to active runtime code
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          dkd_path = Path('scripts/dkd_verify_release_identity.mjs')
          dkd_text = dkd_path.read_text(encoding='utf-8')
          dkd_text = dkd_text.replace("['src', 'scripts', 'tools', 'supabase/functions']", "['src', 'supabase/functions']")
          dkd_path.write_text(dkd_text, encoding='utf-8')
          PY

      - name: Install and align Expo SDK 54 packages
        shell: bash
        run: |
          npm install
          npx expo install --fix
          npm run env:restore

      - name: Verify version, identity and environment
        run: npm run dkd:verify-v0.0.5

      - name: Validate Expo public config
        shell: bash
        run: |
          npx expo config --type public --json >/tmp/dkd_expo_public_config.json
          node -e "const c=require('/tmp/dkd_expo_public_config.json'); if(c.version!=='0.0.5'||Number(c.android?.versionCode)!==5) process.exit(1); console.log('Expo config v0.0.5 / 5 doğrulandı.');"

      - name: Bundle Android JavaScript
        shell: bash
        run: |
          rm -rf .dkd-export-check
          npx expo export --platform android --output-dir .dkd-export-check --clear
          rm -rf .dkd-export-check

      - name: Publish transformed tree through Git Data API
        uses: actions/github-script@v7
        env:
          DKD_COMMIT_MESSAGE: "DraBornGo v0.0.5: Expo 54, DBG identity and fixed public env"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');

            const dkdRun = (args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
            const dkdRunBuffer = (args) => execFileSync('git', args);
            const dkdSplitNull = (buffer) => buffer.toString('utf8').split('\0').filter(Boolean);

            const dkdParentSha = dkdRun(['rev-parse', 'HEAD']);
            const dkdBaseTreeSha = dkdRun(['rev-parse', 'HEAD^{tree}']);
            const dkdChangedPaths = new Set([
              ...dkdSplitNull(dkdRunBuffer(['diff', '--no-renames', '--name-only', '-z', 'HEAD'])),
              ...dkdSplitNull(dkdRunBuffer(['ls-files', '--others', '--exclude-standard', '-z'])),
            ]);

            if (!dkdChangedPaths.size) {
              core.setFailed('DraBornGo v0.0.5 dönüşümünde Git ağacına yazılacak değişiklik bulunamadı.');
              return;
            }

            const dkdTreeElements = [];
            for (const dkdPath of [...dkdChangedPaths].sort()) {
              if (!fs.existsSync(dkdPath)) {
                dkdTreeElements.push({ path: dkdPath, mode: '100644', type: 'blob', sha: null });
                continue;
              }

              const dkdStat = fs.lstatSync(dkdPath);
              if (!dkdStat.isFile()) continue;
              const dkdContentBase64 = fs.readFileSync(dkdPath).toString('base64');
              const dkdBlob = await github.rest.git.createBlob({
                owner: context.repo.owner,
                repo: context.repo.repo,
                content: dkdContentBase64,
                encoding: 'base64',
              });
              dkdTreeElements.push({
                path: dkdPath,
                mode: (dkdStat.mode & 0o111) ? '100755' : '100644',
                type: 'blob',
                sha: dkdBlob.data.sha,
              });
            }

            const dkdTree = await github.rest.git.createTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base_tree: dkdBaseTreeSha,
              tree: dkdTreeElements,
            });

            const dkdCommit = await github.rest.git.createCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              message: process.env.DKD_COMMIT_MESSAGE,
              tree: dkdTree.data.sha,
              parents: [dkdParentSha],
            });

            const dkdRefName = `heads/${process.env.DKD_TARGET_BRANCH}`;
            try {
              await github.rest.git.getRef({ owner: context.repo.owner, repo: context.repo.repo, ref: dkdRefName });
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: dkdRefName,
                sha: dkdCommit.data.sha,
                force: true,
              });
            } catch (dkdError) {
              if (dkdError.status !== 404) throw dkdError;
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/${dkdRefName}`,
                sha: dkdCommit.data.sha,
              });
            }

            core.notice(`DraBornGo v0.0.5 hazır dalı oluşturuldu: ${dkdCommit.data.sha}`);
