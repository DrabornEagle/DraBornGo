name: DKD DraBornGo v0.0.5 Cleanup Runner

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: dkd-v0-0-5-cleanup-runner
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.pull_request.title == '[DKD] Apply DraBornGo v0.0.5 cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply cleanup
        run: python3 scripts/dkd_v0_0_5_cleanup.py

      - name: Install packages
        run: npm ci

      - name: Restore pinned public environment
        run: npm run env:restore

      - name: Verify identity and version
        run: npm run dkd:verify-v0.0.5

      - name: Verify repository cleanup
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          dkd_root_path = Path('.')
          dkd_current_migration_path = dkd_root_path / 'supabase/migrations/20260722133353_dkd_draborngo_v0_0_5_remove_draborndeal_and_fix_version.sql'
          if not dkd_current_migration_path.is_file():
              raise SystemExit('DKD current v0.0.5 cleanup migration is missing.')

          dkd_obsolete_file_values = []
          for dkd_base_path in [
              dkd_root_path / 'supabase/migrations',
              dkd_root_path / 'supabase/sql',
              dkd_root_path / 'supabase/functions',
          ]:
              if not dkd_base_path.exists():
                  continue
              for dkd_path_value in dkd_base_path.rglob('*'):
                  if not dkd_path_value.is_file() or dkd_path_value == dkd_current_migration_path:
                      continue
                  dkd_lower_path_value = str(dkd_path_value).lower()
                  if 'dkd_deal' in dkd_lower_path_value or 'draborndeal' in dkd_lower_path_value or 'v0_0_6' in dkd_lower_path_value:
                      dkd_obsolete_file_values.append(str(dkd_path_value))

          if dkd_obsolete_file_values:
              raise SystemExit('Obsolete DraBornDeal/v0.0.6 Supabase files remain:\n' + '\n'.join(dkd_obsolete_file_values))

          dkd_active_target_values = [
              dkd_root_path / 'src',
              dkd_root_path / 'web/DraBornGo/App',
              dkd_root_path / 'app.json',
              dkd_root_path / 'app.config.js',
              dkd_root_path / 'package.json',
              dkd_root_path / '.github/workflows/dkdev_build_apk.yml',
              dkd_root_path / '.github/workflows/dkd_build_signed_apk.yml',
              dkd_root_path / '.github/workflows/dkd_build_signed_aab.yml',
          ]
          dkd_old_visible_tokens = ('0.0.4', 'v0_0_4', 'code4', 'Kod 4')
          dkd_old_visible_file_values = []

          for dkd_target_path in dkd_active_target_values:
              if not dkd_target_path.exists():
                  continue
              dkd_file_values = [dkd_target_path] if dkd_target_path.is_file() else [
                  dkd_path_value for dkd_path_value in dkd_target_path.rglob('*') if dkd_path_value.is_file()
              ]
              for dkd_path_value in dkd_file_values:
                  try:
                      dkd_text_value = dkd_path_value.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  if any(dkd_token_value in dkd_text_value for dkd_token_value in dkd_old_visible_tokens):
                      dkd_old_visible_file_values.append(str(dkd_path_value))

          if dkd_old_visible_file_values:
              raise SystemExit('Old v0.0.4/code4 visible remnants remain:\n' + '\n'.join(sorted(set(dkd_old_visible_file_values))))

          dkd_update_service_text = (dkd_root_path / 'src/services/dkd_app_update_service.js').read_text(encoding='utf-8')
          if 'return dkd_expo_build_value || dkd_native_build_value || 5;' not in dkd_update_service_text:
              raise SystemExit('Expo project versionCode is not preferred over Expo Go native build code.')
          if "return dkd_update_text_value(Constants?.expoConfig?.version" not in dkd_update_service_text:
              raise SystemExit('Expo project version is not preferred over Expo Go native app version.')

          dkd_policy_service_text = (dkd_root_path / 'src/services/dkd_policy_center_service.js').read_text(encoding='utf-8')
          if 'dkd_input_value.dkd_version_code_value || 5' not in dkd_policy_service_text:
              raise SystemExit('Policy center service fallback code is not 5.')

          dkd_policy_modal_text = (dkd_root_path / 'src/features/legal/dkd_google_play_policy_center_modal.js').read_text(encoding='utf-8')
          if "dkd_version_code_value: '5'" not in dkd_policy_modal_text:
              raise SystemExit('Policy center modal default code is not 5.')

          print('DraBornGo repository cleanup and v0.0.5/code5 visible identity verified.')
          PY

      - name: Validate Expo public config
        shell: bash
        run: |
          npx expo config --type public --json > /tmp/dkd_public_config.json
          node - <<'DKD_NODE'
          const fs = require('fs');
          const dkdConfig = JSON.parse(fs.readFileSync('/tmp/dkd_public_config.json', 'utf8'));
          if (dkdConfig.name !== 'DraBornGo') throw new Error('App name is not DraBornGo.');
          if (dkdConfig.version !== '0.0.5') throw new Error('Expo version is not 0.0.5.');
          if (Number(dkdConfig.android?.versionCode) !== 5) throw new Error('Android versionCode is not 5.');
          console.log('DraBornGo v0.0.5 / code 5 config verified.');
          DKD_NODE

      - name: Bundle Android JavaScript
        run: |
          rm -rf .dkd-v0-0-5-cleanup-export
          npx expo export --platform android --output-dir .dkd-v0-0-5-cleanup-export --clear
          rm -rf .dkd-v0-0-5-cleanup-export

      - name: Publish validated cleanup to main
        shell: bash
        run: |
          git config user.name 'DKD Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No repository changes to publish.'
            exit 0
          fi
          git commit -m 'DraBornGo v0.0.5: remove DraBornDeal remnants and fix visible versions'
          git push origin HEAD:main
