name: DKD v0.0.15 Final Source Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd_v015_final_source_validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Release identity
        run: npm run dkd:verify-v0.0.15
      - name: Play risk scan
        run: npm run dkd:play-risk-scan
      - name: Removed source audit
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/features/serviceNetwork/dkd_service_network_modal.js
          test ! -e src/features/serviceNetwork/dkd_service_network_modal_v2.js
          test ! -e src/features/courier/dkd_cargo_sender_panel.js
          test ! -e src/features/courier/dkd_cargo_live_map_modal.js
          test ! -e src/services/dkd_cargo_service.js
          ! grep -R -n -E 'DkdServiceNetworkModal|dkd_service_network_modal|dkd_cargo_sender_panel|dkd_create_cargo_shipment|dkd_fetch_my_cargo_shipments|dkd_upload_cargo_package_art|dkd_emit_cargo_shipment_push_event' src
          grep -R -n 'dkd_courier_live_location_service' src/features/courier/dkd_courier_live_sync_bridge.js
      - name: Metro Android bundle smoke test
        run: npx expo export --platform android --output-dir /tmp/dkd-v015-export
      - name: Self cleanup
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/dkd_v015_final_source_validation.yml
          git config user.name 'DrabornEagle Release Bot'
          git config user.email 'release-bot@draborneagle.com'
          git add -A
          git commit -m 'test: v0.0.15 source cleanup validated' || exit 0
          git push origin HEAD:main
