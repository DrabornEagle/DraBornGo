name: Dkd Actions Probe

on:
  push:
    branches:
      - 'release/actions-probe'
    paths:
      - '.github/dkd_actions_probe_trigger.txt'

permissions:
  contents: write

jobs:
  dkd_probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/actions-probe
      - name: Dkd mark successful push trigger
        shell: bash
        run: |
          printf 'GitHub Actions push trigger OK\n' > dkd_actions_probe_result.txt
          git config user.name 'DrabornEagle Actions Probe'
          git config user.email 'actions@users.noreply.github.com'
          git add dkd_actions_probe_result.txt
          git commit -m 'chore: confirm actions push trigger'
          git push origin HEAD:release/actions-probe
