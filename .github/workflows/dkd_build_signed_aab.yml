name: DraBornGo Release AAB

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/dkd_release_build_trigger/**'

concurrency:
  group: draborngo-release-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dkd_build_signed_aab:
    name: DraBornGo v0.0.16 code 3 signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      DKD_ANDROID_KEYSTORE_BASE64: ${{ secrets.DKD_ANDROID_KEYSTORE_BASE64 }}
      DKD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DKD_ANDROID_KEYSTORE_PASSWORD }}
      DKD_ANDROID_KEY_ALIAS: ${{ secrets.DKD_ANDROID_KEY_ALIAS }}
      DKD_ANDROID_KEY_PASSWORD: ${{ secrets.DKD_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Dkd checkout
        uses: actions/checkout@v4

      - name: Dkd setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dkd setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dkd validate Android signing secrets
        shell: bash
        run: |
          mkdir -p dkd_keystore_precheck
          printf '%s' "${DKD_ANDROID_KEYSTORE_BASE64}" | base64 --decode > dkd_keystore_precheck/dkd_release_keystore.jks
          test -s dkd_keystore_precheck/dkd_release_keystore.jks
          keytool -list -keystore dkd_keystore_precheck/dkd_release_keystore.jks -storepass "${DKD_ANDROID_KEYSTORE_PASSWORD}" -alias "${DKD_ANDROID_KEY_ALIAS}" >/dev/null
          pushd dkd_keystore_precheck >/dev/null
          printf 'dkd signing precheck\n' > dkd_precheck.txt
          jar cf dkd_precheck.jar dkd_precheck.txt
          jarsigner -keystore dkd_release_keystore.jks -storepass "${DKD_ANDROID_KEYSTORE_PASSWORD}" -keypass "${DKD_ANDROID_KEY_PASSWORD}" -signedjar dkd_precheck_signed.jar dkd_precheck.jar "${DKD_ANDROID_KEY_ALIAS}" >/dev/null
          jarsigner -verify dkd_precheck_signed.jar >/dev/null
          popd >/dev/null
          rm -rf dkd_keystore_precheck
          echo 'DKD signing secrets verified.'

      - name: Dkd write embedded public env module
        shell: bash
        run: |
          node ./scripts/dkd_restore_public_env.mjs
          set -a
          . ./.env
          set +a
          dkd_supabase_publishable_key_value="${EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-${EXPO_PUBLIC_SUPABASE_ANON_KEY}}"
          export EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${dkd_supabase_publishable_key_value}"
          for dkd_secret_name in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN DKD_ANDROID_KEYSTORE_BASE64 DKD_ANDROID_KEYSTORE_PASSWORD DKD_ANDROID_KEY_ALIAS DKD_ANDROID_KEY_PASSWORD; do
            if [ -z "${!dkd_secret_name}" ]; then echo "DKD ERROR: ${dkd_secret_name} is empty"; exit 1; fi
          done
          if ! echo "${EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN}" | grep -q '^pk\.'; then echo 'DKD ERROR: Mapbox public token must start with pk.'; exit 1; fi
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\n' "${EXPO_PUBLIC_SUPABASE_URL}" > .env
          printf 'EXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "${EXPO_PUBLIC_SUPABASE_ANON_KEY}" >> .env
          printf 'EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "${EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY}" >> .env
          printf 'EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN=%s\n' "${EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN}" >> .env
          cp .env .env.local
          cp .env .env.production
          node <<'DKD_NODE'
          const fs=require('fs');
          const keys=['EXPO_PUBLIC_SUPABASE_URL','EXPO_PUBLIC_SUPABASE_ANON_KEY','EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY','EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN'];
          const out={}; for(const k of keys){const v=String(process.env[k]||'').trim(); if(!v) throw new Error(`DKD ERROR: ${k} missing`); out[k]=v;}
          fs.writeFileSync('src/lib/dkd_public_env.generated.js',`export const dkd_generated_public_env_value = ${JSON.stringify(out,null,2)};\n`);
          DKD_NODE

      - name: Dkd install packages
        run: npm install --no-package-lock

      - name: Dkd verify v0.0.16 code 3 release identity
        shell: bash
        run: |
          node <<'DKD_NODE'
          const a=require('./app.json').expo; const p=require('./package.json');
          if(a.version!=='0.0.16'||p.version!=='0.0.16') throw new Error('DKD ERROR: version must be 0.0.16');
          if(Number(a.android.versionCode)!==3) throw new Error('DKD ERROR: versionCode must be 3');
          if(a.android.package!=='com.draborneagle.draborngo') throw new Error('DKD ERROR: Android package mismatch');
          console.log('DKD identity OK: DraBornGo v0.0.16 / code 3');
          DKD_NODE

      - name: Dkd verify Expo runtime and Play permissions
        shell: bash
        run: |
          npx expo config --json > dkd_expo_config.json
          node <<'DKD_NODE'
          const fs=require('fs'); const c=JSON.parse(fs.readFileSync('dkd_expo_config.json','utf8'));
          if(c.version!=='0.0.16'||Number(c.android.versionCode)!==3) throw new Error('DKD ERROR: resolved Expo identity mismatch');
          const permissions=Array.isArray(c?.android?.permissions)?c.android.permissions:[];
          const forbidden=['android.permission.ACCESS_BACKGROUND_LOCATION','android.permission.READ_EXTERNAL_STORAGE','android.permission.WRITE_EXTERNAL_STORAGE','android.permission.READ_MEDIA_IMAGES','android.permission.READ_MEDIA_VIDEO','android.permission.RECORD_AUDIO','android.permission.FOREGROUND_SERVICE_LOCATION'];
          for(const value of forbidden){if(permissions.includes(value)) throw new Error(`DKD ERROR: forbidden permission ${value}`);}
          const generated=fs.readFileSync('src/lib/dkd_public_env.generated.js','utf8');
          for(const key of ['EXPO_PUBLIC_SUPABASE_URL','EXPO_PUBLIC_SUPABASE_ANON_KEY','EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY','EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN']) if(!generated.includes(key)) throw new Error(`DKD ERROR: generated env missing ${key}`);
          console.log('DKD Expo runtime and permission audit OK.');
          DKD_NODE

      - name: Dkd prepare Android SDK
        shell: bash
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Dkd generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Dkd tune Gradle release memory
        shell: bash
        run: |
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\norg.gradle.daemon=false\norg.gradle.parallel=false\n' >> android/gradle.properties

      - name: Dkd inject release signing config
        shell: bash
        run: |
          mkdir -p android/app/dkd_secure
          printf '%s' "${DKD_ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/dkd_secure/dkd_release_keystore.jks
          cat > android/app/dkd_release_signing.gradle <<'DKD_GRADLE'
          android {
              signingConfigs {
                  dkdRelease {
                      storeFile file('dkd_secure/dkd_release_keystore.jks')
                      storePassword System.getenv('DKD_ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('DKD_ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('DKD_ANDROID_KEY_PASSWORD')
                  }
              }
              buildTypes { release { signingConfig signingConfigs.dkdRelease } }
          }
          DKD_GRADLE
          printf '\napply from: "dkd_release_signing.gradle"\n' >> android/app/build.gradle

      - name: Dkd build signed AAB
        shell: bash
        run: |
          cd android
          ./gradlew :app:bundleRelease --no-daemon

      - name: Dkd collect and verify signed AAB
        shell: bash
        run: |
          mkdir -p dkd_signed_aab_output
          dkd_aab_path="$(find android/app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1)"
          test -n "${dkd_aab_path}"
          cp "${dkd_aab_path}" dkd_signed_aab_output/DraBornGo-v0.0.16-code3-release.aab
          jarsigner -verify -strict dkd_signed_aab_output/DraBornGo-v0.0.16-code3-release.aab
          sha256sum dkd_signed_aab_output/DraBornGo-v0.0.16-code3-release.aab
          ls -lh dkd_signed_aab_output

      - name: Dkd upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: DraBornGo_Release_AAB_v0_0_16_code3
          path: dkd_signed_aab_output/DraBornGo-v0.0.16-code3-release.aab
          retention-days: 14
