name: DKD v0.0.15 Courier Only Onboarding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd_v0_0_15_courier_only_onboarding.yml'

permissions:
  contents: write

jobs:
  update-onboarding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update courier-only welcome flow
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const p = 'src/features/onboarding/dkd_pre_login_intro_screen.js';
          let s = fs.readFileSync(p, 'utf8');

          function replaceExact(from, to, label) {
            if (!s.includes(from)) throw new Error(`Missing expected onboarding text: ${label}`);
            s = s.replace(from, to);
          }

          replaceExact("const dkd_pre_login_role_storage_key_value = 'dkd_dkd_draborngo_pre_login_role_hint_v7';", "const dkd_pre_login_role_storage_key_value = 'dkd_dkd_draborngo_pre_login_role_hint_v8';", 'storage key');

          replaceExact("dkd_badge_text: 'DraBornGo v0.0.15 • ŞEHİR GİRİŞİ'", "dkd_badge_text: 'DraBornGo v0.0.15 • KURYE GİRİŞİ'", 'step 1 badge');
          replaceExact("dkd_title_text: \"DraBornGo'ya hoş geldin — şehir operasyonu tek ekranda\"", "dkd_title_text: \"DraBornGo'ya hoş geldin — kurye operasyonun tek ekranda\"", 'step 1 title');
          replaceExact("dkd_body_text: 'Kurye, işletme, destek ve canlı görev akışını modern şehir merkezi mantığıyla tek ekranda buluşturuyoruz.'", "dkd_body_text: 'Gelen teslimat görevlerini gör, uygun görevi kabul et, rotanı takip et ve kazancını tek merkezden izle.'", 'step 1 body');

          replaceExact("dkd_badge_text: 'CANLI TESLİMAT MOTORU'", "dkd_badge_text: 'CANLI KURYE GÖREVLERİ'", 'step 2 badge');
          replaceExact("dkd_body_text: 'Kurye görevleri ve işletme bağlantıları güncel kartlar, canlı durum ve teslimat adımlarıyla tek operasyon akışında görünür olur.'", "dkd_body_text: 'Görev havuzundaki teslimatları gör; kabul ettiğin görevin alım ve teslimat adımlarını canlı durum ve rota akışıyla yönet.'", 'step 2 body');

          replaceExact("dkd_badge_text: 'ROLÜNÜ SEÇ'", "dkd_badge_text: 'KURYE LİSANSI'", 'step 3 badge');
          replaceExact("dkd_title_text: \"DraBornGo'yu kendi akışına göre aç\"", "dkd_title_text: 'Onaylı kurye olarak görev akışına katıl'", 'step 3 title');
          replaceExact("dkd_body_text: 'Kurye veya işletme akışını seç; karşılama ekranı tercihini bu cihazda saklar ve girişe daha anlaşılır bir başlangıç sağlar.'", "dkd_body_text: 'Kurye başvurun onaylandığında lisans durumun aktif görünür; görev havuzuna erişerek teslimat operasyonuna başlayabilirsin.'", 'step 3 body');
          replaceExact("dkd_art_mode_value: 'role'", "dkd_art_mode_value: 'license'", 'step 3 mode');
          replaceExact("dkd_primary_icon_name: 'account-switch-outline'", "dkd_primary_icon_name: 'badge-account-horizontal-outline'", 'step 3 icon');

          replaceExact("dkd_badge_text: 'CANLI TAKİP & BİLDİRİM'", "dkd_badge_text: 'CANLI TAKİP & KAZANÇ'", 'step 4 badge');
          replaceExact("dkd_title_text: 'Görev havuzu, canlı rota ve bildirimler aynı ritimde'", "dkd_title_text: 'Teslimat, rota ve kazanç aynı akışta'", 'step 4 title');
          replaceExact("dkd_body_text: 'Görevi kabul etme, teslim alma, rota ve teslim edildi adımları daha okunur; kurye ve işletme operasyonu girişten önce bile net biçimde tanıtılır.'", "dkd_body_text: 'Görevi kabul et, teslim al, rotanı tamamla, teslim edildi olarak kapat ve çalışma-kazanç özetlerini tek merkezden takip et.'", 'step 4 body');

          const oldRoleList = `const dkd_role_option_list_value = [\n  { dkd_key_value: 'courier', dkd_label_text: 'Kuryeyim', dkd_icon_name: 'bike-fast' },\n  { dkd_key_value: 'business', dkd_label_text: 'İşletmeyim', dkd_icon_name: 'storefront-outline' },\n];`;
          const newRoleList = `const dkd_role_option_list_value = [\n  { dkd_key_value: 'courier', dkd_label_text: 'Kuryeyim', dkd_icon_name: 'bike-fast' },\n];`;
          replaceExact(oldRoleList, newRoleList, 'role list');

          const oldCards = `const dkd_delivery_card_list_value = [\n  { dkd_title_text: 'Kurye Merkezi', dkd_body_text: 'Görev havuzu ve teslimat', dkd_icon_name: 'bike-fast', dkd_color_value: '#22C55E' },\n  { dkd_title_text: 'Canlı Görevler', dkd_body_text: 'Kurye görevi ve rota akışı', dkd_icon_name: 'map-marker-path', dkd_color_value: '#0EA5E9' },\n  { dkd_title_text: 'Destek Merkezi', dkd_body_text: 'Admin ile doğrudan destek', dkd_icon_name: 'headset', dkd_color_value: '#A855F7' },\n  { dkd_title_text: 'İşletme Ağı', dkd_body_text: 'İşletme ve operasyon bağlantısı', dkd_icon_name: 'storefront-outline', dkd_color_value: '#F97316' },\n];`;
          const newCards = `const dkd_delivery_card_list_value = [\n  { dkd_title_text: 'Görev Havuzu', dkd_body_text: 'Güncel teslimat görevleri', dkd_icon_name: 'clipboard-text-clock-outline', dkd_color_value: '#22C55E' },\n  { dkd_title_text: 'Canlı Rota', dkd_body_text: 'Alım ve teslimat rotası', dkd_icon_name: 'map-marker-path', dkd_color_value: '#0EA5E9' },\n  { dkd_title_text: 'Teslimat Adımları', dkd_body_text: 'Kabul et, teslim al, teslim et', dkd_icon_name: 'package-variant-closed-check', dkd_color_value: '#A855F7' },\n  { dkd_title_text: 'Kazanç Takibi', dkd_body_text: 'Çalışma ve kazanç özetleri', dkd_icon_name: 'cash-clock', dkd_color_value: '#F97316' },\n];`;
          replaceExact(oldCards, newCards, 'delivery cards');

          replaceExact("const [dkd_selected_role_value, dkd_set_selected_role_value] = useState(null);", "const [dkd_selected_role_value, dkd_set_selected_role_value] = useState('courier');", 'default role');

          replaceExact('Kurye görev havuzunda güncel teslimat akışı', 'Kurye görev havuzunda güncel teslimat görevleri', 'control line 1');
          replaceExact('Kurye görevleri ve işletme akışı için canlı durum', 'Kabul edilen görev için canlı rota ve teslimat durumu', 'control line 2');
          replaceExact('Giriş sonrası DraBornGo ana merkezine geçiş', 'Tamamlanan görevler ve çalışma-kazanç özetleri', 'control line 3');

          fs.writeFileSync(p, s);
          NODE

      - name: Validate courier-only onboarding copy
        shell: bash
        run: |
          set -euo pipefail
          FILE='src/features/onboarding/dkd_pre_login_intro_screen.js'
          grep -q 'DraBornGo v0.0.15 • KURYE GİRİŞİ' "$FILE"
          grep -q 'Onaylı kurye olarak görev akışına katıl' "$FILE"
          grep -q 'Teslimat, rota ve kazanç aynı akışta' "$FILE"
          grep -q 'Kazanç Takibi' "$FILE"
          if grep -Eqi 'işletme|business|ROLÜNÜ SEÇ|İşletmeyim' "$FILE"; then
            echo 'Courier-only onboarding still contains business/role-selection copy.' >&2
            exit 1
          fi

      - name: Install and smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run dkd:verify-v0.0.15
          npx expo export --platform android --output-dir /tmp/dkd-v0015-onboarding-export

      - name: Commit updated onboarding
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/dkd_v0_0_15_courier_only_onboarding.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ui: align v0.0.15 onboarding with courier-only scope'
          git push

# trigger-2
