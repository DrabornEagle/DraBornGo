name: DKD Validate Final State Once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  dkd-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: NPM clean install
        run: npm ci
      - name: Expo Doctor
        run: npx expo-doctor@latest --verbose
      - name: Android Metro bundle
        run: npx expo export --platform android --output-dir /tmp/dkd-final-state
      - name: Save success and self-clean
        shell: bash
        run: |
          printf '%s\n' 'npm ci: PASS' 'Expo Doctor: PASS' 'Android Metro bundle: PASS' > dkd-v0016-final-state-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dkd-v0016-final-state-validation.txt
          git rm .github/workflows/dkd-v0016-validate-final-state-once.yml
          git commit -m "chore: validate final v0.0.16 courier state"
          git push
