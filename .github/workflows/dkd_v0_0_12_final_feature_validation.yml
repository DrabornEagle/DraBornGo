name: DKD v0.0.12 Final Feature Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd_v0_0_12_final_feature_validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify v0.0.12 identity
        run: npm run dkd:verify-v0.0.12
      - name: Runtime scope audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'DraBornGo v0.0.12' src/features/navigation/ActionMenuModal.js
          grep -q 'Kazanç Tablosu' src/features/navigation/ActionMenuModal.js
          grep -q 'Siparişlerim' src/features/serviceNetwork/dkd_service_network_modal.js
          grep -q 'Gönderi Oluştur' src/features/serviceNetwork/dkd_service_network_modal.js
          grep -q 'DrabornEagle Destek' src/features/support/dkd_live_support_modal.js
          grep -q 'Kullanıcı Yönetimi' src/features/admin/AdminMenuModal.js
          test ! -e src/services/dkd_service_network_service.js
          test ! -e src/features/social/DBGHubModal.js
          ! grep -Rni "service_network" src supabase/functions/send-courier-order-alert supabase/functions/send-push-event-bridge --exclude-dir=node_modules
          ! grep -n "Gönderi Oluştur" src/features/courier/CourierBoardModal.js
          grep -q "!dkd_approved_flag" src/features/courier/CourierBoardModal.js
      - name: Android Expo bundle validation
        run: npx expo export --platform android --output-dir /tmp/dkd-v0-0-12-final-export
      - name: Record PASS audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          printf 'DraBornGo v0.0.12 final feature validation: PASS\nAndroid versionCode: 12\nValidated commit: %s\nValidated UTC: %s\nChecks: npm ci, release identity, runtime scope audit, Android Expo export\n' "$(git rev-parse HEAD)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > audit/dkd_v0_0_12_final_feature_validation.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/dkd_v0_0_12_final_feature_validation.txt
          git commit -m 'test: validate final DraBornGo v0.0.12 feature set'
          git push origin HEAD:main
