name: DraBornPortal v0.4 Signed APK\n# DraBornPortal source refresh 2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd_portal_v04_signed.yml'

jobs:
  dkd_portal_signed_release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DKD_ANDROID_KEYSTORE_BASE64: ${{ secrets.DKD_ANDROID_KEYSTORE_BASE64 }}
      DKD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DKD_ANDROID_KEYSTORE_PASSWORD }}
      DKD_ANDROID_KEY_ALIAS: ${{ secrets.DKD_ANDROID_KEY_ALIAS }}
      DKD_ANDROID_KEY_PASSWORD: ${{ secrets.DKD_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout DraBornPortal
        uses: actions/checkout@v4
        with:
          repository: DrabornEagle/DraBornPortal
          ref: main
          path: portal

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Validate persistent signing key
        shell: bash
        run: |
          for n in DKD_ANDROID_KEYSTORE_BASE64 DKD_ANDROID_KEYSTORE_PASSWORD DKD_ANDROID_KEY_ALIAS DKD_ANDROID_KEY_PASSWORD; do
            test -n "${!n}" || { echo "Missing signing secret: $n"; exit 1; }
          done
          printf '%s' "${DKD_ANDROID_KEYSTORE_BASE64}" | base64 --decode > "$GITHUB_WORKSPACE/dkd_release_keystore.jks"
          keytool -list -keystore "$GITHUB_WORKSPACE/dkd_release_keystore.jks" -storepass "${DKD_ANDROID_KEYSTORE_PASSWORD}" -alias "${DKD_ANDROID_KEY_ALIAS}" >/dev/null
          echo "Signing key verified."

      - name: Verify v0.4 code 1
        shell: bash
        run: |
          grep -q 'versionCode = 1' portal/app/build.gradle.kts
          grep -q 'versionName = "0.4"' portal/app/build.gradle.kts

      - name: Test and build signed release APK
        working-directory: portal
        env:
          DKD_KEYSTORE_PATH: ${{ github.workspace }}/dkd_release_keystore.jks
        run: |
          gradle testDebugUnitTest --stacktrace
          gradle assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          mkdir -p signed_output
          apk_path="$(find portal/app/build/outputs/apk/release -type f -name '*.apk' | head -n1)"
          test -n "$apk_path"
          cp "$apk_path" signed_output/DraBornPortal-v0.4-code1-signed.apk
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          "$apksigner_path" verify --verbose --print-certs signed_output/DraBornPortal-v0.4-code1-signed.apk
          sha256sum signed_output/DraBornPortal-v0.4-code1-signed.apk | tee signed_output/SHA256.txt

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: DraBornPortal-v0.4-code1-signed
          path: signed_output/
          retention-days: 14
