name: DraBornGo final courier live hotfix validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd_courier_modal_state_hotfix.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Validate Android Metro export only
        run: npx expo export --platform android --output-dir dist-final-courier-live-hotfix
