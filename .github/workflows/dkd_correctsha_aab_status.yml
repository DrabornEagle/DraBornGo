name: Dkd Correct SHA AAB Status

on:
  push:
    branches:
      - 'release/aab-status-correct-*'

permissions:
  actions: read
  contents: write

jobs:
  dkd_status:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dkd read corrected AAB run
        shell: bash
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/dkd_build_signed_aab.yml/runs?branch=release%2Faab-build-v0016-code3-correctsha-20260810&per_page=5" > dkd_correctsha_runs_raw.json
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('dkd_correctsha_runs_raw.json','utf8'));const rows=(d.workflow_runs||[]).map(r=>({id:r.id,run_number:r.run_number,event:r.event,status:r.status,conclusion:r.conclusion,head_sha:r.head_sha,created_at:r.created_at,updated_at:r.updated_at}));fs.writeFileSync('dkd_correctsha_aab_runs.json',JSON.stringify(rows,null,2)+'\\n');"
          rm dkd_correctsha_runs_raw.json
          git config user.name 'DrabornEagle AAB Status'
          git config user.email 'actions@users.noreply.github.com'
          git add dkd_correctsha_aab_runs.json
          git commit -m 'chore: record corrected AAB run status'
          git push origin HEAD:${GITHUB_REF_NAME}
