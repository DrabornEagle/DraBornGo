name: DKD v0.0.5 Target Runner

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dkd-v0-0-5-target-runner
  cancel-in-progress: false

jobs:
  upgrade:
    if: github.event.pull_request.title == '[DKD] Run DraBornGo v0.0.5 upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Apply deterministic upgrade
        run: python3 scripts/dkd_apply_v0_0_5_upgrade.py

      - name: Restrict verifier to active runtime code
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          dkd_path = Path('scripts/dkd_verify_release_identity.mjs')
          dkd_text = dkd_path.read_text(encoding='utf-8')
          dkd_text = dkd_text.replace("['src', 'scripts', 'tools', 'supabase/functions']", "['src', 'supabase/functions']")
          dkd_path.write_text(dkd_text, encoding='utf-8')
          PY

      - name: Install and align Expo SDK 54 packages
        shell: bash
        run: |
          npm install
          npx expo install --fix
          npm run env:restore

      - name: Verify version, identity and environment
        run: npm run dkd:verify-v0.0.5

      - name: Validate Expo public config
        shell: bash
        run: |
          npx expo config --type public --json >/tmp/dkd_expo_public_config.json
          node -e "const c=require('/tmp/dkd_expo_public_config.json'); if(c.version!=='0.0.5'||Number(c.android?.versionCode)!==5) process.exit(1); console.log('Expo config v0.0.5 / 5 doğrulandı.');"

      - name: Bundle Android JavaScript
        shell: bash
        run: |
          rm -rf .dkd-export-check
          npx expo export --platform android --output-dir .dkd-export-check --clear
          rm -rf .dkd-export-check

      - name: Stage upgrade changes
        shell: bash
        run: |
          git config user.name "DKD Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --stat

      - name: Commit upgrade changes
        shell: bash
        run: git commit -m "DraBornGo v0.0.5: Expo 54, DBG identity and fixed public env"

      - name: Push upgrade branch
        shell: bash
        run: git push --force origin HEAD:refs/heads/dkd-v0-0-5-ready
