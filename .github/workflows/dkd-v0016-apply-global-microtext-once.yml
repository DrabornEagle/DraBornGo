name: DKD Apply Global Microtext Once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  dkd-apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply microtext floor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path('src').rglob('*'):
              if not p.is_file() or p.suffix not in {'.js','.jsx','.ts','.tsx'}:
                  continue
              s=p.read_text()
              def f(m):
                  v=float(m.group(1))
                  if v >= 11: return m.group(0)
                  n=min(12.5,max(11.0,v+2.0))
                  return 'fontSize: '+f'{n:.1f}'.rstrip('0').rstrip('.')
              n=re.sub(r'fontSize:\s*(\d+(?:\.\d+)?)',f,s)
              if n != s: p.write_text(n)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git rm .github/workflows/dkd-v0016-apply-global-microtext-once.yml
          git commit -m "feat: enlarge app-wide micro text for readability"
          git push
