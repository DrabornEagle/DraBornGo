name: DKD v0.0.12 Lock Sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dkd_v0_0_12_lock_sync.yml

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronize package lock identity
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify source identity
        run: node ./scripts/dkd_verify_release_identity_v12.mjs
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/dkd_v0_0_12_lock_sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/dkd_v0_0_12_lock_sync.yml
          git commit -m "chore: sync v0.0.12 package lock" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
