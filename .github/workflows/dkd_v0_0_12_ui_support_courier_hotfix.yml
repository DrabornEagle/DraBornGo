name: DKD v0.0.12 UI Support Courier Hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply UI hotfix
        run: node tools/dkd_run_v0012_ui_support_courier_hotfix.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify release identity
        run: npm run dkd:verify-v0.0.12

      - name: Validate retired UI strings
        shell: bash
        run: |
          if grep -R --line-number --fixed-strings 'shield-car-outline' src; then
            echo 'Invalid MaterialCommunity icon still exists.'
            exit 1
          fi
          if grep -R --line-number --fixed-strings '>Kontrollü erişim<' src/features/map/MapHomeScreen.js; then
            echo 'Controlled access strip still exists.'
            exit 1
          fi

      - name: Android Expo export validation
        run: npx expo export --platform android --output-dir /tmp/dkd-v0012-ui-hotfix-export

      - name: Write validation marker
        shell: bash
        run: |
          mkdir -p audit
          printf '%s\n' \
            'DraBornGo v0.0.12 UI/support/courier hotfix validation: PASS' \
            'Android versionCode: 12' \
            "Validated source commit: $GITHUB_SHA" \
            "Validated UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            'Checks: UI patch, npm ci, release identity, invalid icon audit, controlled-access removal, Android Expo export' \
            > audit/dkd_v0_0_12_ui_support_courier_hotfix_validation.txt

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tools audit
          if git diff --cached --quiet; then
            echo 'No patch changes to commit.'
          else
            git commit -m 'fix: complete v0.0.12 UI support courier hotfix [skip ci]'
            git push origin HEAD:main
          fi
