name: DKD v0.0.12 Runtime Patch Commit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd_v0_0_12_runtime_patch_commit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch routes and courier center
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def one(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if old in text:
                  text=text.replace(old,new,1); p.write_text(text,encoding='utf-8')

          p=Path('src/features/courier/CourierBoardModal.js')
          text=p.read_text(encoding='utf-8')
          text=text.replace("import DkdCargoSenderPanelValue from './dkd_cargo_sender_panel';\n",'')
          text=text.replace("  if (['cargo', 'cargo_sender', 'sender', 'shipment'].includes(dkd_key_value)) return 'cargo';\n",'')
          text=text.replace("  const dkd_title_value = dkd_panel_value === 'application' ? 'Kurye Başvurusu' : dkd_panel_value === 'cargo' ? 'Gönderi & Kargo' : 'Kurye Görevleri';","  const dkd_title_value = dkd_panel_value === 'application' ? 'Kurye Başvurusu' : 'Kurye Görevleri';")
          text=text.replace('''          {dkd_panel_value === 'cargo' ? (\n            <View style={dkd_styles_value.panelBody}>\n              <DkdCargoSenderPanelValue dkd_visible_value dkd_panel_mode_value="embedded" dkd_current_location_value={currentLocation} dkd_on_created_value={() => dkd_load_jobs_value(true)} dkd_on_home_return_value={() => dkd_set_panel_value('jobs')} />\n            </View>\n          ) : dkd_panel_value === 'application' ? (''',"          {dkd_panel_value === 'application' ? (")
          text=text.replace('''              <View style={dkd_styles_value.shortcutRow}><Pressable onPress={() => dkd_set_panel_value('cargo')} style={dkd_styles_value.shortcut}><MaterialCommunityIcons name="package-variant-closed" size={20} color="#7EEBFF" /><Text style={dkd_styles_value.shortcutText}>Gönderi Oluştur</Text></Pressable><Pressable onPress={() => dkd_set_panel_value('application')} style={dkd_styles_value.shortcut}><MaterialCommunityIcons name="card-account-details-outline" size={20} color="#7EEBFF" /><Text style={dkd_styles_value.shortcutText}>Kurye Başvurusu</Text></Pressable></View>''','''              {!dkd_approved_flag ? <View style={dkd_styles_value.shortcutRow}><Pressable onPress={() => dkd_set_panel_value('application')} style={dkd_styles_value.shortcut}><MaterialCommunityIcons name="card-account-details-outline" size={20} color="#7EEBFF" /><Text style={dkd_styles_value.shortcutText}>Kurye Başvurusu</Text></Pressable></View> : null}''')
          p.write_text(text,encoding='utf-8')

          one('src/core/ModalHost.js',"import DBGHubModal from '../features/social/DBGHubModal';","import DkdLiveSupportModal from '../features/support/dkd_live_support_modal';")
          one('src/core/ModalHost.js',"onDBGHub={() => { setActionMenuOpen(false); setActiveTab('dbg'); }}","onSupport={() => { setActionMenuOpen(false); setActiveTab('support'); }}")
          one('src/core/ModalHost.js',"{activeTab === 'dbg' ? <DBGHubModal visible onClose={() => setActiveTab('map')} sessionUserId={sessionUserId} profile={profile} refreshProfile={refreshProfile} /> : null}","{activeTab === 'support' ? <DkdLiveSupportModal dkd_visible_value dkd_on_close_value={() => setActiveTab('map')} dkd_is_admin_value={isAdmin} /> : null}")
          one('src/core/propBuilders.js',"    || activeTab === 'dbg'","    || activeTab === 'support'")
          one('src/features/map/MapHomeScreen.js','Kurye, kargo ve şehir içi hizmet taleplerini tek şehir ağı üzerinden keşfet.','Gönderi oluştur, siparişlerini takip et ve kurye teslimat akışını tek merkezden yönet.')
          one('src/features/map/MapHomeScreen.js','<DkdQuickTile dkd_icon_value="message-processing-outline" dkd_title_value="Sohbet" dkd_subtitle_value="DBG mesaj ve ekip alanı" dkd_accent_value="#A33D80" dkd_on_press_value={() => onTabChange?.(\'dbg\')} />','<DkdQuickTile dkd_icon_value="headset" dkd_title_value="Destek" dkd_subtitle_value="DrabornEagle admin canlı destek" dkd_accent_value="#A33D80" dkd_on_press_value={() => onTabChange?.(\'support\')} />')
          Path('src/services/dkd_service_network_service.js').unlink(missing_ok=True)
          Path('src/features/social/DBGHubModal.js').unlink(missing_ok=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: finalize v0.0.12 runtime routes and courier center'
          git push origin HEAD:main
