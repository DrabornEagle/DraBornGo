name: DKD v0.0.12 Admin Courier Cleanup

on:
  push:
    branches: [main]
    paths:
      - 'tools/dkd_apply_v0012_admin_courier_cleanup.mjs'
      - '.github/workflows/dkd_v0_0_12_admin_courier_cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply source cleanup
        run: node tools/dkd_apply_v0012_admin_courier_cleanup.mjs

      - name: Clean install
        run: npm ci

      - name: Verify release identity
        run: npm run dkd:verify-v0.0.12

      - name: Validate requested cleanup
        shell: bash
        run: |
          grep -q 'DBG RIDER' src/features/map/MapHomeScreen.js
          ! grep -q 'DKD RIDER' src/features/map/MapHomeScreen.js
          grep -q 'dkd_visible_user_count_value' src/features/admin/dkd_admin_user_manager_modal.js
          grep -q 'Daha Fazla' src/features/admin/dkd_admin_user_manager_modal.js
          ! grep -q 'dkd_label_value="Saatlik"' src/features/admin/dkd_admin_user_manager_modal.js
          ! grep -q 'dkd_label_value="Skor"' src/features/admin/dkd_admin_user_manager_modal.js
          ! grep -q 'dkd_label_value="Puan Ort."' src/features/admin/dkd_admin_user_manager_modal.js
          ! grep -q 'dkd_label_value="Puan Sayısı"' src/features/admin/dkd_admin_user_manager_modal.js
          grep -q 'dkd_courier_approved_value && dkd_courier_online_value' src/features/map/MapHomeScreen.js

      - name: Android Expo export validation
        run: npx expo export --platform android --output-dir /tmp/dkd-v0012-admin-courier-cleanup

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'fix: complete v0.0.12 admin courier cleanup [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
