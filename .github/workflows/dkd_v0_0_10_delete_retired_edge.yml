name: DKD v0.0.10 Retired Edge Cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dkd_v0_0_10_delete_retired_edge.yml

permissions:
  contents: read

jobs:
  dkd_delete_retired_edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DKD_SUPABASE_PROJECT_REF: ${{ secrets.DKD_SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Delete retired edge function
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$DKD_SUPABASE_PROJECT_REF"
          echo "Deleting retired DraBornGo edge function..."
          supabase functions delete send-urgent-courier-alert \
            --project-ref "$DKD_SUPABASE_PROJECT_REF" \
            --yes

      - name: Verify deletion
        shell: bash
        run: |
          if supabase functions list --project-ref "$DKD_SUPABASE_PROJECT_REF" | grep -q 'send-urgent-courier-alert'; then
            echo 'Retired edge function still exists.'
            exit 1
          fi
          echo 'Retired edge function removed.'
