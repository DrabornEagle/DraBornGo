name: DKD Workflow Inventory

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  dkd_inventory:
    if: github.event.pull_request.title == '[DKD] Inventory DraBornGo Workflows'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Inventory workflows
        shell: bash
        run: |
          mkdir -p audit
          find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort > audit/dkd_workflow_inventory.txt
          cat audit/dkd_workflow_inventory.txt
      - name: Commit inventory
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/dkd_workflow_inventory.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: inventory GitHub workflows"
          git pull --rebase origin main
          git push origin HEAD:main
