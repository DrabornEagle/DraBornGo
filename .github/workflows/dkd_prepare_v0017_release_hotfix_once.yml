name: Prepare DraBornGo v0.0.17 release hotfix branch once retry
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dkd_prepare_v0017_release_hotfix_once.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v0.0.17-release-hotfix-2026-08-11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Synchronize release identity and APK workflow
        shell: bash
        run: |
          node <<'DKD_NODE'
          const fs=require('fs');
          const svc='src/services/dkd_app_update_service.js'; let s=fs.readFileSync(svc,'utf8');
          s=s.replace("const dkd_current_release_name_value = '0.0.16';","const dkd_current_release_name_value = '0.0.17';"); fs.writeFileSync(svc,s);
          const wf='.github/workflows/dkd_build_signed_apk.yml'; let w=fs.readFileSync(wf,'utf8');
          w=w.replaceAll('v0.0.16','v0.0.17').replaceAll("'0.0.16'","'0.0.17'").replaceAll('0_0_16','0_0_17'); fs.writeFileSync(wf,w);
          DKD_NODE
      - run: npm ci
      - name: Validate identities and Android Metro
        shell: bash
        run: |
          node <<'DKD_NODE'
          const fs=require('fs'); const a=require('./app.json').expo; const p=require('./package.json');
          if(a.version!=='0.0.17'||p.version!=='0.0.17'||Number(a.android.versionCode)!==3) throw new Error('release identity mismatch');
          if(!fs.readFileSync('src/services/dkd_app_update_service.js','utf8').includes("dkd_current_release_name_value = '0.0.17'")) throw new Error('update center identity stale');
          const m=JSON.parse(fs.readFileSync('web/DraBornGo/App/dkd_draborngo_update_manifest.json','utf8')); if(m.dkd_latest_version_name!=='0.0.17') throw new Error('web manifest stale');
          DKD_NODE
          npx expo export --platform android --output-dir dist-ci
      - name: Commit prepared branch
        shell: bash
        run: |
          printf 'DraBornGo v0.0.17 release hotfix validated: web/update-center sync, route UI and Android Metro export passed.\n' > .github/dkd-v0.0.17-release-hotfix-validation.txt
          git add src/services/dkd_app_update_service.js .github/workflows/dkd_build_signed_apk.yml .github/dkd-v0.0.17-release-hotfix-validation.txt
          if ! git diff --cached --quiet; then git commit -m 'chore: prepare DraBornGo v0.0.17 release hotfix'; git push origin HEAD:work/v0.0.17-release-hotfix-2026-08-11; fi
