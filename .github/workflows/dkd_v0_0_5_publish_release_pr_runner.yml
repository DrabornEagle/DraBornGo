name: DKD DraBornGo v0.0.5 Release Publisher

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  actions: read
  contents: write

concurrency:
  group: dkd-v0-0-5-release-publisher
  cancel-in-progress: false

jobs:
  dkd_publish_release:
    if: github.event.pull_request.title == '[DKD] Publish DraBornGo v0.0.5 signed APK'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      DKD_BUILD_RUN_ID: '29931807984'
      DKD_ARTIFACT_NAME: DKD_DraBornGo_v0_0_5_code5_signed_apk
      DKD_RELEASE_TAG: dkd_draborngo_v0.0.5
      DKD_APK_NAME: DraBornGo-v0.0.5-code5-release.apk
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download validated signed APK artifact
        shell: bash
        run: |
          rm -rf dkd_release_assets
          mkdir -p dkd_release_assets
          gh run download "${DKD_BUILD_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${DKD_ARTIFACT_NAME}" \
            --dir dkd_release_assets
          ls -lh dkd_release_assets

      - name: Verify APK SHA-256
        shell: bash
        run: |
          cd dkd_release_assets
          test -s "${DKD_APK_NAME}"
          test -s "${DKD_APK_NAME}.sha256"
          dkd_expected_sha_value="$(tr -d '[:space:]' < "${DKD_APK_NAME}.sha256")"
          dkd_actual_sha_value="$(sha256sum "${DKD_APK_NAME}" | awk '{print $1}')"
          if [ "${dkd_expected_sha_value}" != "${dkd_actual_sha_value}" ]; then
            echo "DKD ERROR: APK SHA-256 mismatch."
            exit 1
          fi
          if [ "${dkd_actual_sha_value}" != '7b7bdc301eaaba4c4484ce18464c242fe98d4492012d44171c31394f72ed762f' ]; then
            echo "DKD ERROR: APK SHA-256 differs from the downloaded artifact verification."
            exit 1
          fi
          echo "DKD APK SHA-256 verified: ${dkd_actual_sha_value}"

      - name: Publish GitHub release asset
        shell: bash
        run: |
          gh release delete "${DKD_RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag || true
          gh release create "${DKD_RELEASE_TAG}" \
            "dkd_release_assets/${DKD_APK_NAME}#DraBornGo v0.0.5 Signed APK" \
            "dkd_release_assets/${DKD_APK_NAME}.sha256#SHA-256" \
            --repo "${GITHUB_REPOSITORY}" \
            --target main \
            --title 'DraBornGo v0.0.5 • Kod 5' \
            --notes 'DraBornGo v0.0.5 imzalı Android APK. Expo SDK 54 uyumu, DBG kimliği, görünür sürüm düzeltmeleri ve DraBornDeal veritabanı temizliği içerir. SHA-256: 7b7bdc301eaaba4c4484ce18464c242fe98d4492012d44171c31394f72ed762f'

      - name: Verify public release asset
        shell: bash
        run: |
          dkd_asset_url_value="https://github.com/${GITHUB_REPOSITORY}/releases/download/${DKD_RELEASE_TAG}/${DKD_APK_NAME}"
          curl --fail --location --head "${dkd_asset_url_value}"
          echo "DKD public APK URL verified: ${dkd_asset_url_value}"
