name: DKD v0.0.16 Release Patch Runner v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/dkd_release_patch_trigger/**'

permissions:
  contents: write

jobs:
  dkd_patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply v0.0.16 mobile release patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def rep(path, old, new, label):
              p = Path(path)
              t = p.read_text()
              if old not in t:
                  raise SystemExit(f'DKD ERROR: {label} pattern missing')
              p.write_text(t.replace(old, new))

          home = Path('src/features/map/MapHomeScreen.js')
          t = home.read_text()
          old = '            <DkdQuickTile dkd_icon_value="headset" dkd_title_value="Destek" dkd_subtitle_value="DrabornEagle admin canlı destek" dkd_accent_value="#A33D80" dkd_on_press_value={() => onTabChange?.(\'support\')} />\n'
          if old not in t:
              raise SystemExit('DKD ERROR: quick support tile pattern missing')
          home.write_text(t.replace(old, ''))

          rep('src/features/navigation/ActionMenuModal.js','DraBornGo v0.0.15','DraBornGo v0.0.16','center menu version')
          rep('src/features/navigation/ActionMenuModal.js','Kullanıcı, kurye, başvuru ve destek operasyonlarını yönet.','Kullanıcı, kurye, destek ve operasyon araçlarını yönet.','admin menu retired wording')

          board = Path('src/features/courier/dkd_courier_board_modal_v2.js')
          t = board.read_text()
          pairs = [
            ("dkd_status_hero: { minHeight: 272,", "dkd_status_hero: { minHeight: 300,"),
            ("dkd_status_kicker: { color: 'rgba(226,245,255,.62)', fontSize: 8.5, fontWeight: '900', letterSpacing: 1.1 },", "dkd_status_kicker: { color: 'rgba(226,245,255,.72)', fontSize: 11, fontWeight: '900', letterSpacing: 1.2 },"),
            ("dkd_status_title: { color: '#FFFFFF', fontSize: 17, lineHeight: 21, fontWeight: '900', marginTop: 3 },", "dkd_status_title: { color: '#FFFFFF', fontSize: 21, lineHeight: 26, fontWeight: '900', marginTop: 4 },"),
            ("dkd_status_sub: { color: 'rgba(235,245,255,.64)', fontSize: 10, lineHeight: 15, fontWeight: '700', marginTop: 4 },", "dkd_status_sub: { color: 'rgba(235,245,255,.72)', fontSize: 12.5, lineHeight: 18, fontWeight: '700', marginTop: 5 },"),
            ("dkd_metric: { flex: 1, minHeight: 64,", "dkd_metric: { flex: 1, minHeight: 72,"),
            ("dkd_metric_label: { color: 'rgba(229,243,255,.45)', fontSize: 7.5, fontWeight: '900', letterSpacing: .7 },", "dkd_metric_label: { color: 'rgba(229,243,255,.58)', fontSize: 9.5, fontWeight: '900', letterSpacing: .75 },"),
            ("dkd_metric_value: { color: '#FFFFFF', fontSize: 12, fontWeight: '900', marginTop: 7 },", "dkd_metric_value: { color: '#FFFFFF', fontSize: 15, fontWeight: '900', marginTop: 6 },"),
            ("dkd_status_button: { minHeight: 55,", "dkd_status_button: { minHeight: 58,"),
            ("dkd_status_button_text: { color: '#06111B', fontSize: 12, fontWeight: '900' },", "dkd_status_button_text: { color: '#06111B', fontSize: 14, fontWeight: '900' },"),
          ]
          for a,b in pairs:
              if a not in t:
                  raise SystemExit(f'DKD ERROR: courier style pattern missing: {a[:45]}')
              t = t.replace(a,b)
          board.write_text(t)

          pkgp = Path('package.json')
          pkg = json.loads(pkgp.read_text())
          pkg.setdefault('dependencies', {})['expo-navigation-bar'] = '~57.0.2'
          pkgp.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n')

          appp = Path('app.json')
          app = json.loads(appp.read_text())
          expo = app['expo']
          expo['androidNavigationBar'] = {'barStyle':'light-content','enforceContrast':False}
          plugins = expo.setdefault('plugins', [])
          plugins = [x for x in plugins if not ((isinstance(x,list) and x and x[0]=='expo-navigation-bar') or x=='expo-navigation-bar')]
          plugins.append(['expo-navigation-bar', {'enforceContrast':False,'style':'dark'}])
          expo['plugins'] = plugins
          appp.write_text(json.dumps(app, ensure_ascii=False, indent=2) + '\n')

          appjs = Path('App.js')
          t = appjs.read_text()
          imp = "import * as dkd_system_ui_module from 'expo-system-ui';\n"
          if "from 'expo-navigation-bar'" not in t:
              if imp not in t: raise SystemExit('DKD ERROR: App.js import anchor missing')
              t = t.replace(imp, imp + "import { NavigationBar } from 'expo-navigation-bar';\n")
          root = "    <SafeAreaProvider>\n      <View style={{ flex: 1, backgroundColor: dkd_android_system_bar_background_value }}>"
          if '<NavigationBar style="dark" />' not in t:
              if root not in t: raise SystemExit('DKD ERROR: App.js root anchor missing')
              t = t.replace(root, "    <SafeAreaProvider>\n      <NavigationBar style=\"dark\" />\n      <View style={{ flex: 1, backgroundColor: dkd_android_system_bar_background_value }}>")
          appjs.write_text(t)
          PY

      - name: Prepare only DraBornGo Release APK and AAB workflows
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path, kind in [(Path('.github/workflows/dkd_build_signed_apk.yml'),'APK'),(Path('.github/workflows/dkd_build_signed_aab.yml'),'AAB')]:
              t = path.read_text()
              oldname = f'name: DKD Build Signed {kind}'
              if oldname not in t: raise SystemExit(f'DKD ERROR: old {kind} workflow name missing')
              t = t.replace(oldname, f'name: DraBornGo Release {kind}', 1)
              oldtr = 'on:\n  workflow_dispatch:\n'
              newtr = "on:\n  workflow_dispatch:\n  pull_request:\n    branches: [main]\n    paths:\n      - '.github/dkd_release_build_trigger/**'\n"
              if oldtr not in t: raise SystemExit(f'DKD ERROR: {kind} trigger anchor missing')
              t = t.replace(oldtr,newtr,1)
              t = t.replace('DraBornGo-v0.0.6-code6-release.apk','DraBornGo-v0.0.16-code3-release.apk')
              t = t.replace('DraBornGo-v0.0.6-code6-release.aab','DraBornGo-v0.0.16-code3-release.aab')
              t = t.replace('DKD_DraBornGo_v0_0_6_code6_signed_apk','DraBornGo_Release_APK_v0_0_16_code3')
              t = t.replace('DKD_DraBornGo_v0_0_6_code6_signed_aab','DraBornGo_Release_AAB_v0_0_16_code3')
              anchor = '      - name: Dkd verify embedded runtime env\n'
              identity = """      - name: Dkd verify DraBornGo v0.0.16 code 3 identity\n        shell: bash\n        run: |\n          node <<'DKD_NODE'\n          const a=require('./app.json').expo; const p=require('./package.json');\n          if(a.version!=='0.0.16'||p.version!=='0.0.16'||Number(a.android.versionCode)!==3||a.android.package!=='com.draborneagle.draborngo') throw new Error('DKD ERROR: release identity mismatch');\n          console.log('DKD release identity verified: v0.0.16 / code 3');\n          DKD_NODE\n\n"""
              if identity.strip() not in t:
                  if anchor not in t: raise SystemExit(f'DKD ERROR: {kind} identity anchor missing')
                  t=t.replace(anchor,identity+anchor,1)
              if kind=='APK':
                  up='      - name: Dkd upload signed APK artifact\n'
                  ver="""      - name: Dkd verify signed APK output\n        shell: bash\n        run: |\n          \"$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner\" verify --verbose dkd_signed_apk_output/DraBornGo-v0.0.16-code3-release.apk\n          sha256sum dkd_signed_apk_output/DraBornGo-v0.0.16-code3-release.apk\n\n"""
              else:
                  up='      - name: Dkd upload signed AAB artifact\n'
                  ver="""      - name: Dkd verify signed AAB output\n        shell: bash\n        run: |\n          jarsigner -verify -strict dkd_signed_aab_output/DraBornGo-v0.0.16-code3-release.aab\n          sha256sum dkd_signed_aab_output/DraBornGo-v0.0.16-code3-release.aab\n\n"""
              if ver.strip() not in t:
                  if up not in t: raise SystemExit(f'DKD ERROR: {kind} upload anchor missing')
                  t=t.replace(up,ver+up,1)
              path.write_text(t)
          PY

      - name: Install, validate, and resolve Expo config
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          node <<'DKD_NODE'
          const fs=require('fs'); const a=require('./app.json').expo; const p=require('./package.json');
          if(a.version!=='0.0.16'||p.version!=='0.0.16'||Number(a.android.versionCode)!==3) throw new Error('DKD identity mismatch');
          if(p.dependencies['expo-navigation-bar']!=='~57.0.2') throw new Error('DKD navigation dependency mismatch');
          const h=fs.readFileSync('src/features/map/MapHomeScreen.js','utf8');
          const m=fs.readFileSync('src/features/navigation/ActionMenuModal.js','utf8');
          const b=fs.readFileSync('src/features/courier/dkd_courier_board_modal_v2.js','utf8');
          if(h.includes('dkd_title_value="Destek"')||!h.includes('dkd_title_value="Tüm Menü"')) throw new Error('DKD quick access mismatch');
          if(m.includes('DraBornGo v0.0.15')||!m.includes('DraBornGo v0.0.16')) throw new Error('DKD menu version mismatch');
          if(!b.includes('fontSize: 21, lineHeight: 26')) throw new Error('DKD network typography mismatch');
          DKD_NODE
          npx expo config --json > /tmp/dkd_cfg.json
          node <<'DKD_NODE'
          const c=JSON.parse(require('fs').readFileSync('/tmp/dkd_cfg.json','utf8'));
          if(c.version!=='0.0.16'||Number(c.android.versionCode)!==3) throw new Error('DKD resolved Expo identity mismatch');
          console.log('DKD resolved Expo config verified: v0.0.16 / code 3');
          DKD_NODE
          git diff --check

      - name: Commit verified patch and retire patch runner
        shell: bash
        run: |
          rm -f .github/workflows/dkd_release_patch_pr_v2.yml .github/workflows/dkd_release_patch_pr.yml
          rm -rf .github/dkd_release_patch_trigger
          git config user.name "DraBornGo Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "release: finalize DraBornGo v0.0.16 code 3 UI and release workflows"
          git push origin HEAD:${{ github.head_ref }}
