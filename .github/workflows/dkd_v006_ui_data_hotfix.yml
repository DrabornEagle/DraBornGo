name: DraBornGo v0.0.6 UI Data Hotfix

on:
  push:
    paths:
      - '.dkd-v006-ui-data-hotfix-trigger'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix visible release label and onboarding image renderer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home_path = Path('src/features/map/MapHomeScreen.js')
          home_text = home_path.read_text(encoding='utf-8')
          old_version = 'DKD_DraBornGo_v0.0.5'
          new_version = 'DKD_DraBornGo_v0.0.6'
          if old_version not in home_text:
              raise SystemExit('Expected v0.0.5 home badge not found; refusing blind edit.')
          home_text = home_text.replace(old_version, new_version)
          home_path.write_text(home_text, encoding='utf-8')

          intro_path = Path('src/features/onboarding/dkd_pre_login_intro_screen.js')
          intro_text = intro_path.read_text(encoding='utf-8')
          rn_image_line = '  Image,\n'
          if rn_image_line not in intro_text:
              raise SystemExit('Expected React Native Image import not found; refusing blind edit.')
          intro_text = intro_text.replace(rn_image_line, '', 1)

          expo_gradient_import = "import { LinearGradient } from 'expo-linear-gradient';\n"
          expo_image_import = "import { Image } from 'expo-image';\n"
          if expo_image_import not in intro_text:
              if expo_gradient_import not in intro_text:
                  raise SystemExit('Expected LinearGradient import anchor not found.')
              intro_text = intro_text.replace(expo_gradient_import, expo_gradient_import + expo_image_import, 1)

          resize_count = intro_text.count('resizeMode="cover"')
          if resize_count < 2:
              raise SystemExit(f'Expected at least 2 onboarding cover image usages, found {resize_count}.')
          intro_text = intro_text.replace('resizeMode="cover"', 'contentFit="cover"')
          intro_path.write_text(intro_text, encoding='utf-8')

          verify_home = home_path.read_text(encoding='utf-8')
          verify_intro = intro_path.read_text(encoding='utf-8')
          assert old_version not in verify_home
          assert new_version in verify_home
          assert "import { Image } from 'expo-image';" in verify_intro
          assert "  Image," not in verify_intro.split("} from 'react-native';", 1)[0]
          PY

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "DraBornGo Hotfix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/features/map/MapHomeScreen.js src/features/onboarding/dkd_pre_login_intro_screen.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix v0.0.6 badge and onboarding image rendering"
          git push origin HEAD:main
