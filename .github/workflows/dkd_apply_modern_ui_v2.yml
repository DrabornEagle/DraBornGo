name: DraBornGo Modern UI v2

on:
  push:
    paths:
      - '.github/workflows/dkd_apply_modern_ui_v2.yml'

permissions:
  contents: write

jobs:
  apply-modern-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore modern courier UI
        shell: bash
        run: |
          mkdir -p src/core
          printf '%s' '' | base64 -d | gzip -d > src/core/dkd_courier_flow.js
          node --check src/core/dkd_courier_flow.js
          if grep -Ein '\b(level|lvl|xp|courier_level|courier_xp)\b' src/core/dkd_courier_flow.js; then
            echo 'Progression residue found in modern UI' >&2
            exit 1
          fi

      - name: Commit modern UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/dkd_courier_flow.js
          if git diff --cached --quiet; then
            echo 'Modern UI already current'
          else
            git commit -m 'Rebuild DraBornGo modern courier UI v2'
            git push origin main
          fi
