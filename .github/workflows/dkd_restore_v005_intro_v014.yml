name: DKD Restore v0.0.5 Welcome v0.0.14

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd_restore_v005_intro_v014.yml'

permissions:
  contents: write

jobs:
  restore-welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore v0.0.5 welcome UI and adapt v0.0.14 content
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin backup/v0.0.5-final-20260808
          git show origin/backup/v0.0.5-final-20260808:src/features/onboarding/dkd_pre_login_intro_screen.js > /tmp/dkd_pre_login_intro_screen.js

          node <<'NODE'
          const fs = require('fs');

          const target = 'src/features/onboarding/dkd_pre_login_intro_screen.js';
          let source = fs.readFileSync('/tmp/dkd_pre_login_intro_screen.js', 'utf8');

          source = source.replace(
            "const dkd_pre_login_role_storage_key_value = 'dkd_dkd_draborngo_pre_login_role_hint_v6';",
            "const dkd_pre_login_role_storage_key_value = 'dkd_dkd_draborngo_pre_login_role_hint_v7';"
          );

          const newSteps = `const dkd_intro_step_list_value = [
            {
              dkd_badge_text: 'DraBornGo v0.0.14 • ŞEHİR GİRİŞİ',
              dkd_title_text: "DraBornGo'ya hoş geldin — şehir operasyonu tek ekranda",
              dkd_body_text: 'Kurye, işletme, gönderi/kargo, Hizmet Ağı, destek ve canlı görev akışını modern şehir merkezi mantığıyla tek ekranda buluşturuyoruz.',
              dkd_art_mode_value: 'welcome',
              dkd_art_image_source_value: require('../../../assets/dkd_onboarding/dkd_intro_city_ecosystem.png'),
              dkd_primary_icon_name: 'city-variant-outline',
              dkd_accent_colors_value: ['#38BDF8', '#A78BFA', '#F472B6'],
              dkd_screen_gradient_colors_value: ['#040617', '#111827', '#32115F', '#0B5C72'],
            },
            {
              dkd_badge_text: 'CANLI TESLİMAT MOTORU',
              dkd_title_text: 'Görev gelir, rota açılır, teslimat netleşir',
              dkd_body_text: 'Kurye görevleri, gönderi/kargo ve işletme bağlantıları güncel kartlar, canlı durum ve teslimat adımlarıyla tek operasyon akışında görünür olur.',
              dkd_art_mode_value: 'delivery',
              dkd_art_image_source_value: require('../../../assets/dkd_onboarding/dkd_intro_delivery_route.png'),
              dkd_primary_icon_name: 'bike-fast',
              dkd_accent_colors_value: ['#34D399', '#22D3EE', '#FACC15'],
              dkd_screen_gradient_colors_value: ['#02140D', '#053B2A', '#0F766E', '#13213F'],
            },
            {
              dkd_badge_text: 'ROLÜNÜ SEÇ',
              dkd_title_text: "DraBornGo'yu kendi akışına göre aç",
              dkd_body_text: 'Kurye veya işletme akışını seç; karşılama ekranı tercihini bu cihazda saklar ve girişe daha anlaşılır bir başlangıç sağlar.',
              dkd_art_mode_value: 'role',
              dkd_art_image_source_value: require('../../../assets/dkd_onboarding/dkd_intro_role_hub.png'),
              dkd_primary_icon_name: 'account-switch-outline',
              dkd_accent_colors_value: ['#FB7185', '#A78BFA', '#60A5FA'],
              dkd_screen_gradient_colors_value: ['#16051B', '#35124F', '#1E1B4B', '#0F172A'],
            },
            {
              dkd_badge_text: 'CANLI TAKİP & BİLDİRİM',
              dkd_title_text: 'Görev havuzu, canlı rota ve bildirimler aynı ritimde',
              dkd_body_text: 'Görevi kabul etme, teslim alma, rota ve teslim edildi adımları daha okunur; kurye ve işletme operasyonu girişten önce bile net biçimde tanıtılır.',
              dkd_art_mode_value: 'control',
              dkd_art_image_source_value: require('../../../assets/dkd_onboarding/dkd_intro_live_tracking.png'),
              dkd_primary_icon_name: 'map-marker-path',
              dkd_accent_colors_value: ['#F59E0B', '#22C55E', '#38BDF8'],
              dkd_screen_gradient_colors_value: ['#130B02', '#3B1F09', '#14213D', '#031A30'],
            },
          ];`;

          source = source.replace(/const dkd_intro_step_list_value = \[[\s\S]*?\n\];\n\nconst dkd_role_option_list_value/, `${newSteps}\n\nconst dkd_role_option_list_value`);

          const newRoles = `const dkd_role_option_list_value = [
            { dkd_key_value: 'courier', dkd_label_text: 'Kuryeyim', dkd_icon_name: 'bike-fast' },
            { dkd_key_value: 'business', dkd_label_text: 'İşletmeyim', dkd_icon_name: 'storefront-outline' },
          ];`;
          source = source.replace(/const dkd_role_option_list_value = \[[\s\S]*?\n\];\n\nconst dkd_delivery_card_list_value/, `${newRoles}\n\nconst dkd_delivery_card_list_value`);

          const newDeliveryCards = `const dkd_delivery_card_list_value = [
            { dkd_title_text: 'Kurye Merkezi', dkd_body_text: 'Görev havuzu ve teslimat', dkd_icon_name: 'bike-fast', dkd_color_value: '#22C55E' },
            { dkd_title_text: 'Gönderi & Kargo', dkd_body_text: 'Paket ve rota akışı', dkd_icon_name: 'package-variant-closed', dkd_color_value: '#0EA5E9' },
            { dkd_title_text: 'Hizmet Ağı', dkd_body_text: 'Şehir içi hizmet akışı', dkd_icon_name: 'tools', dkd_color_value: '#A855F7' },
            { dkd_title_text: 'İşletme Ağı', dkd_body_text: 'İşletme ve operasyon bağlantısı', dkd_icon_name: 'storefront-outline', dkd_color_value: '#F97316' },
          ];`;
          source = source.replace(/const dkd_delivery_card_list_value = \[[\s\S]*?\n\];\n\nfunction DkdIntroIllustration/, `${newDeliveryCards}\n\nfunction DkdIntroIllustration`);

          source = source.replace(
            'export default function DkdPreLoginIntroScreen({ dkd_on_complete_value })',
            'export default function DkdPreLoginIntroScreen({ dkd_on_continue_value })'
          );
          source = source.replace(
            "if (typeof dkd_on_complete_value === 'function') await dkd_on_complete_value();",
            "if (typeof dkd_on_continue_value === 'function') await dkd_on_continue_value({ dkd_role_value: dkd_selected_role_value || null });"
          );

          source = source.replace(
            'İlk olarak hangi akış sana yakın?',
            'DraBornGo’yu hangi rolde kullanacaksın?'
          );
          source = source.replace(
            'Sipariş havuzunda kategori odaklı görev akışı',
            'Kurye görev havuzunda güncel teslimat akışı'
          );
          source = source.replace(
            'Kargo, restoran ve acil kurye için canlı durum',
            'Gönderi, kargo ve Hizmet Ağı için canlı durum'
          );
          source = source.replace(
            'Login sonrası DraBornGo şehir merkezine geçiş',
            'Giriş sonrası DraBornGo ana merkezine geçiş'
          );

          if (!source.includes("Kuryeyim") || !source.includes("İşletmeyim") || source.includes("Müşteriyim")) {
            throw new Error('Role adaptation failed');
          }
          if (!source.includes("DraBornGo v0.0.14 • ŞEHİR GİRİŞİ")) {
            throw new Error('Versioned welcome content missing');
          }

          fs.writeFileSync(target, source);

          const menuPath = 'src/features/navigation/ActionMenuModal.js';
          let menu = fs.readFileSync(menuPath, 'utf8');
          menu = menu.replaceAll('DraBornGo v0.0.13', 'DraBornGo v0.0.14');
          if (menu.includes('DraBornGo v0.0.13')) throw new Error('Menu version update failed');
          fs.writeFileSync(menuPath, menu);

          const appPath = 'App.js';
          let app = fs.readFileSync(appPath, 'utf8');
          app = app.replaceAll('dkd_dkd_draborngo_pre_login_intro_completed_v6', 'dkd_dkd_draborngo_pre_login_intro_completed_v7');
          fs.writeFileSync(appPath, app);
          NODE

          rm -f .github/workflows/dkd_restore_v005_intro_v014.yml

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs'); const s=fs.readFileSync('src/features/onboarding/dkd_pre_login_intro_screen.js','utf8'); if(!s.includes('Kuryeyim')||!s.includes('İşletmeyim')||s.includes('Müşteriyim')) process.exit(1); if(!s.includes('dkd_on_continue_value')) process.exit(1);"
          node -e "const fs=require('fs'); const s=fs.readFileSync('src/features/navigation/ActionMenuModal.js','utf8'); if(s.includes('DraBornGo v0.0.13')||!s.includes('DraBornGo v0.0.14')) process.exit(1);"
          node -e "const fs=require('fs'); const s=fs.readFileSync('App.js','utf8'); if(!s.includes('pre_login_intro_completed_v7')) process.exit(1);"

      - name: Commit restored welcome
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DrabornEagle Release Bot'
          git config user.email 'release-bot@draborneagle.com'
          git add App.js src/features/onboarding/dkd_pre_login_intro_screen.js src/features/navigation/ActionMenuModal.js .github/workflows/dkd_restore_v005_intro_v014.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: restore v0.0.5 pre-login welcome for v0.0.14'
          git push origin HEAD:main
