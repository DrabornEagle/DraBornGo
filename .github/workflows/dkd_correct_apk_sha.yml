name: Dkd Correct APK SHA

on:
  push:
    branches:
      - 'release/apk-sha-fix-*'

permissions:
  contents: write

jobs:
  dkd_correct_apk_sha:
    runs-on: ubuntu-latest
    steps:
      - name: Dkd checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Dkd correct release APK SHA everywhere
        shell: bash
        run: |
          node <<'DKD_NODE'
          const fs=require('fs');
          const dkd_old_sha='a2c6d6c1a8db8eedbe49a550c8bf7775ff64c13146429b85ebc9aa201dae0f66';
          const dkd_new_sha='f6214c8a1e9d48b7e0cc5718a9172cce88dd2620a48c1debbbaffca1549accba';
          const dkd_paths=[
            'src/features/legal/dkd_app_update_center_modal.js',
            'src/services/dkd_app_update_service.js',
            'web/DraBornGo/App/dkd_draborngo_update_manifest.json',
            'scripts/dkd_release_metadata_patch.mjs'
          ];
          let dkd_changes=0;
          for(const dkd_path of dkd_paths){
            const dkd_before=fs.readFileSync(dkd_path,'utf8');
            const dkd_after=dkd_before.split(dkd_old_sha).join(dkd_new_sha);
            if(dkd_after!==dkd_before){fs.writeFileSync(dkd_path,dkd_after);dkd_changes++;}
            if(!dkd_after.includes(dkd_new_sha)) throw new Error(`DKD ERROR: corrected SHA missing from ${dkd_path}`);
          }
          const dkd_manifest=JSON.parse(fs.readFileSync('web/DraBornGo/App/dkd_draborngo_update_manifest.json','utf8'));
          if(dkd_manifest.dkd_sha256!==dkd_new_sha) throw new Error('DKD ERROR: manifest SHA mismatch');
          if(dkd_changes<1) throw new Error('DKD ERROR: no SHA values changed');
          console.log(`DKD corrected APK SHA in ${dkd_changes} files: ${dkd_new_sha}`);
          DKD_NODE

          git config user.name 'DrabornEagle Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/features/legal/dkd_app_update_center_modal.js src/services/dkd_app_update_service.js web/DraBornGo/App/dkd_draborngo_update_manifest.json scripts/dkd_release_metadata_patch.mjs
          git commit -m 'fix: use actual v0.0.16 release APK SHA-256'
          git push origin HEAD:main
