name: DKD v0.0.13 Courier Scroll Applications Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd_v0_0_13_courier_scroll_applications_hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dkd_hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply requested hotfix
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          function replaceOnce(path, before, after, label) {
            let text = fs.readFileSync(path, 'utf8');
            if (!text.includes(before)) {
              throw new Error(`Pattern not found for ${label} in ${path}`);
            }
            text = text.replace(before, after);
            fs.writeFileSync(path, text);
          }

          // 1) Kurye görev ekranı: aktif sahipli görev varsa kurye ağı çevrimdışı görünmesin.
          const board = 'src/features/courier/dkd_courier_board_modal_v2.js';
          replaceOnce(
            board,
            "  const dkd_approved_flag = String(profile?.courier_status || '').toLowerCase() === 'approved';\n  const dkd_online_flag = profile?.dkd_courier_online === true;\n  const dkd_active_count_value = dkd_visible_jobs_value.length;",
            "  const dkd_approved_flag = String(profile?.courier_status || '').toLowerCase() === 'approved';\n  const dkd_active_owned_job_value = useMemo(() => dkd_visible_jobs_value.find((dkd_job_value) => {\n    if (!dkd_owned_value(dkd_job_value, dkd_user_id_value)) return false;\n    const dkd_status_value = dkd_text_value(dkd_job_value?.status).toLowerCase();\n    const dkd_pickup_value = dkd_text_value(dkd_job_value?.pickup_status).toLowerCase();\n    return !['completed', 'delivered', 'cancelled', 'canceled', 'rejected'].includes(dkd_status_value)\n      && !['delivered', 'cancelled', 'canceled'].includes(dkd_pickup_value);\n  }) || null, [dkd_visible_jobs_value, dkd_user_id_value]);\n  const dkd_has_active_owned_job_flag = Boolean(dkd_active_owned_job_value?.id);\n  const dkd_online_flag = profile?.dkd_courier_online === true;\n  const dkd_network_active_flag = dkd_online_flag || dkd_has_active_owned_job_flag;\n  const dkd_active_count_value = dkd_visible_jobs_value.length;",
            'active owned job network state'
          );

          replaceOnce(
            board,
            "                <LinearGradient colors={dkd_online_flag ? ['#075F54', '#095C78', '#25498B'] : ['#252A46', '#153B54', '#35284F']} style={dkd_styles_value.dkd_status_hero}>",
            "                <LinearGradient colors={dkd_network_active_flag ? ['#075F54', '#095C78', '#25498B'] : ['#252A46', '#153B54', '#35284F']} style={dkd_styles_value.dkd_status_hero}>",
            'network active gradient'
          );

          replaceOnce(
            board,
            "                    <View style={dkd_styles_value.dkd_status_icon_stage}><Animated.View style={[dkd_styles_value.dkd_status_halo, { opacity: dkd_pulse_opacity_value, transform: [{ scale: dkd_pulse_scale_value }], borderColor: dkd_online_flag ? '#62EBB4' : '#83A7D8' }]} /><View style={[dkd_styles_value.dkd_status_icon, dkd_online_flag && dkd_styles_value.dkd_status_icon_online]}><MaterialCommunityIcons name={dkd_online_flag ? 'radar' : 'power-standby'} size={27} color={dkd_online_flag ? '#06111B' : '#DDEAFF'} /></View></View>\n                    <View style={{ flex: 1 }}><Text style={dkd_styles_value.dkd_status_kicker}>{dkd_approved_flag ? 'KURYE AĞ DURUMU' : 'LİSANS DURUMU'}</Text><Text style={dkd_styles_value.dkd_status_title}>{dkd_approved_flag ? (dkd_online_flag ? 'Çevrimiçi • Sipariş Radarı Açık' : 'Çevrimdışı • Hazır Bekliyor') : 'Kurye Lisansı Gerekli'}</Text><Text style={dkd_styles_value.dkd_status_sub}>{dkd_approved_flag ? (dkd_online_flag ? 'Bölgen için uygun yeni siparişler canlı taranıyor.' : 'Görev almak için çevrimiçi ol ve sipariş radarını başlat.') : 'Kurye görevlerini kabul etmek için başvurunu tamamla.'}</Text></View>",
            "                    <View style={dkd_styles_value.dkd_status_icon_stage}><Animated.View style={[dkd_styles_value.dkd_status_halo, { opacity: dkd_pulse_opacity_value, transform: [{ scale: dkd_pulse_scale_value }], borderColor: dkd_network_active_flag ? '#62EBB4' : '#83A7D8' }]} /><View style={[dkd_styles_value.dkd_status_icon, dkd_network_active_flag && dkd_styles_value.dkd_status_icon_online]}><MaterialCommunityIcons name={dkd_has_active_owned_job_flag ? 'bike-fast' : (dkd_online_flag ? 'radar' : 'power-standby')} size={27} color={dkd_network_active_flag ? '#06111B' : '#DDEAFF'} /></View></View>\n                    <View style={{ flex: 1 }}><Text style={dkd_styles_value.dkd_status_kicker}>{dkd_approved_flag ? 'KURYE AĞ DURUMU' : 'LİSANS DURUMU'}</Text><Text style={dkd_styles_value.dkd_status_title}>{dkd_approved_flag ? (dkd_has_active_owned_job_flag ? 'Aktif Teslimatta • Kurye Ağına Bağlı' : (dkd_online_flag ? 'Çevrimiçi • Sipariş Radarı Açık' : 'Çevrimdışı • Hazır Bekliyor')) : 'Kurye Lisansı Gerekli'}</Text><Text style={dkd_styles_value.dkd_status_sub}>{dkd_approved_flag ? (dkd_has_active_owned_job_flag ? 'Üzerindeki sipariş tamamlanana kadar kurye operasyon durumu aktif kalır.' : (dkd_online_flag ? 'Bölgen için uygun yeni siparişler canlı taranıyor.' : 'Görev almak için çevrimiçi ol ve sipariş radarını başlat.')) : 'Kurye görevlerini kabul etmek için başvurunu tamamla.'}</Text></View>",
            'network active hero copy'
          );

          replaceOnce(
            board,
            "                  <Pressable onPress={dkd_toggle_online_value} disabled={dkd_online_busy_value} style={dkd_styles_value.dkd_status_button}>{dkd_online_busy_value ? <ActivityIndicator color=\"#06111B\" /> : <><MaterialCommunityIcons name={dkd_approved_flag ? (dkd_online_flag ? 'pause-circle-outline' : 'radar') : 'clipboard-account-outline'} size={20} color=\"#06111B\" /><Text style={dkd_styles_value.dkd_status_button_text}>{dkd_approved_flag ? (dkd_online_flag ? 'Sipariş Radarını Durdur' : 'Çevrimiçi Ol • Sipariş Ara') : 'Kurye Başvurusunu Aç'}</Text></>}</Pressable>",
            "                  <Pressable onPress={dkd_toggle_online_value} disabled={dkd_online_busy_value || dkd_has_active_owned_job_flag} style={[dkd_styles_value.dkd_status_button, dkd_has_active_owned_job_flag && { opacity: .82 }]}>{dkd_online_busy_value ? <ActivityIndicator color=\"#06111B\" /> : <><MaterialCommunityIcons name={dkd_has_active_owned_job_flag ? 'package-variant-closed-check' : (dkd_approved_flag ? (dkd_online_flag ? 'pause-circle-outline' : 'radar') : 'clipboard-account-outline')} size={20} color=\"#06111B\" /><Text style={dkd_styles_value.dkd_status_button_text}>{dkd_has_active_owned_job_flag ? 'Aktif Siparişi Tamamla' : (dkd_approved_flag ? (dkd_online_flag ? 'Sipariş Radarını Durdur' : 'Çevrimiçi Ol • Sipariş Ara') : 'Kurye Başvurusunu Aç')}</Text></>}</Pressable>",
            'active job toggle guard'
          );

          // 2) Merkez Menü: Kazanç Tablosu açıldığında ScrollView dokunma/scroll yakalamasını daha güvenilir yap.
          const menu = 'src/features/navigation/ActionMenuModal.js';
          replaceOnce(
            menu,
            "      <Pressable onPress={onClose} style={styles.dkd_backdrop}>\n        <Animated.View style={[styles.dkd_modal_motion, { opacity: dkd_entry_value, transform: [{ translateY: dkd_translate_value }, { scale: dkd_scale_value }] }]}>\n          <Pressable onPress={() => {}} style={styles.dkd_modal_shell}>",
            "      <View style={styles.dkd_backdrop}>\n        <Pressable onPress={onClose} style={StyleSheet.absoluteFill} />\n        <Animated.View pointerEvents=\"box-none\" style={[styles.dkd_modal_motion, { opacity: dkd_entry_value, transform: [{ translateY: dkd_translate_value }, { scale: dkd_scale_value }] }]}>\n          <View style={styles.dkd_modal_shell}>",
            'menu backdrop scroll capture'
          );
          replaceOnce(
            menu,
            "            <ScrollView showsVerticalScrollIndicator={false} contentContainerStyle={styles.dkd_list_content}>",
            "            <ScrollView showsVerticalScrollIndicator={false} nestedScrollEnabled keyboardShouldPersistTaps=\"handled\" scrollEventThrottle={16} contentContainerStyle={styles.dkd_list_content}>",
            'menu scroll props'
          );
          replaceOnce(menu, "          </Pressable>\n        </Animated.View>\n      </Pressable>", "          </View>\n        </Animated.View>\n      </View>", 'menu closing tags');

          // 3) Admin başvuruları: başvuru kartlarını daha ayrıntılı göster.
          const apps = 'src/features/admin/dkd_admin_applications_modal.js';
          let appsText = fs.readFileSync(apps, 'utf8');
          appsText = appsText.replace(
            "          {dkd_courier_rows_value.length ? dkd_courier_rows_value.map((dkd_row_value) => (\n            <View key={String(dkd_row_value.id)} style={dkd_styles_value.card}>\n              <Text style={dkd_styles_value.cardTitle}>{dkd_row_value.full_name || dkd_row_value.name || dkd_row_value.user_id || 'Kurye Adayı'}</Text>\n              <Text style={dkd_styles_value.cardSub}>Durum: {dkd_row_value.status || 'pending'}</Text>\n              <View style={dkd_styles_value.actions}>",
            "          {dkd_courier_rows_value.length ? dkd_courier_rows_value.map((dkd_row_value) => {\n            const dkd_first_name_value = String(dkd_row_value.first_name || dkd_row_value?.payload?.firstName || '').trim();\n            const dkd_last_name_value = String(dkd_row_value.last_name || dkd_row_value?.payload?.lastName || '').trim();\n            const dkd_full_name_value = `${dkd_first_name_value} ${dkd_last_name_value}`.trim() || dkd_row_value.full_name || dkd_row_value.name || 'Kurye Adayı';\n            const dkd_email_value = String(dkd_row_value.email || dkd_row_value?.payload?.email || '').trim() || 'E-posta yok';\n            const dkd_phone_value = String(dkd_row_value.phone || dkd_row_value?.payload?.phone || '').trim() || 'Telefon yok';\n            const dkd_country_value = String(dkd_row_value.dkd_country || dkd_row_value?.payload?.dkd_country || 'Türkiye').trim();\n            const dkd_city_value = String(dkd_row_value.city || dkd_row_value?.payload?.city || '').trim();\n            const dkd_zone_value = String(dkd_row_value.zone || dkd_row_value?.payload?.zone || '').trim();\n            const dkd_vehicle_value = String(dkd_row_value.vehicle_type || dkd_row_value?.payload?.vehicleType || '').trim() || 'Araç belirtilmedi';\n            const dkd_plate_value = String(dkd_row_value.plate_no || dkd_row_value?.payload?.plateNo || '').trim() || 'Plaka yok';\n            const dkd_national_id_value = String(dkd_row_value.national_id || dkd_row_value?.payload?.nationalId || '').replace(/\\D/g, '');\n            const dkd_masked_national_id_value = dkd_national_id_value.length >= 4 ? `${dkd_national_id_value.slice(0, 3)}••••${dkd_national_id_value.slice(-4)}` : 'T.C. yok';\n            const dkd_created_value = dkd_row_value.created_at ? new Date(dkd_row_value.created_at).toLocaleString('tr-TR') : '';\n            return (\n            <View key={String(dkd_row_value.id)} style={dkd_styles_value.card}>\n              <View style={dkd_styles_value.courierHead}>\n                <View style={dkd_styles_value.courierAvatar}><Text style={dkd_styles_value.courierAvatarText}>{dkd_full_name_value.slice(0, 1).toUpperCase()}</Text></View>\n                <View style={{ flex: 1 }}><Text style={dkd_styles_value.cardTitle}>{dkd_full_name_value}</Text><Text style={dkd_styles_value.courierEmail}>{dkd_email_value}</Text></View>\n                <View style={dkd_styles_value.statusPill}><Text style={dkd_styles_value.statusPillText}>{String(dkd_row_value.status || 'pending').toUpperCase()}</Text></View>\n              </View>\n              <View style={dkd_styles_value.detailGrid}>\n                <View style={dkd_styles_value.detailCell}><Text style={dkd_styles_value.detailLabel}>TELEFON</Text><Text style={dkd_styles_value.detailValue}>{dkd_phone_value}</Text></View>\n                <View style={dkd_styles_value.detailCell}><Text style={dkd_styles_value.detailLabel}>TC KİMLİK</Text><Text style={dkd_styles_value.detailValue}>{dkd_masked_national_id_value}</Text></View>\n                <View style={dkd_styles_value.detailCell}><Text style={dkd_styles_value.detailLabel}>BÖLGE</Text><Text style={dkd_styles_value.detailValue}>{[dkd_country_value, dkd_city_value, dkd_zone_value].filter(Boolean).join(' / ') || 'Belirtilmedi'}</Text></View>\n                <View style={dkd_styles_value.detailCell}><Text style={dkd_styles_value.detailLabel}>ARAÇ / PLAKA</Text><Text style={dkd_styles_value.detailValue}>{dkd_vehicle_value} • {dkd_plate_value}</Text></View>\n              </View>\n              <Text style={dkd_styles_value.cardSub}>Kullanıcı ID: {dkd_row_value.user_id || dkd_row_value.applicant_user_id || dkd_row_value.dkd_user_id || '—'}{dkd_created_value ? ` • Başvuru: ${dkd_created_value}` : ''}</Text>\n              <View style={dkd_styles_value.actions}>",
          );
          appsText = appsText.replace(
            "              </View>\n            </View>\n          )) : <Text style={dkd_styles_value.empty}>Kurye başvurusu yok.</Text>}",
            "              </View>\n            </View>\n            );\n          }) : <Text style={dkd_styles_value.empty}>Kurye başvurusu yok.</Text>}",
          );
          appsText = appsText.replace(
            "  cardSub: { color: 'rgba(231,241,255,.60)', fontSize: 11, marginTop: 5 },",
            "  cardSub: { color: 'rgba(231,241,255,.60)', fontSize: 10, lineHeight: 15, marginTop: 9 },\n  courierHead: { flexDirection: 'row', alignItems: 'center', gap: 10 },\n  courierAvatar: { width: 44, height: 44, borderRadius: 15, backgroundColor: 'rgba(126,235,255,.14)', borderWidth: 1, borderColor: 'rgba(126,235,255,.20)', alignItems: 'center', justifyContent: 'center' },\n  courierAvatarText: { color: '#BDF5FF', fontSize: 18, fontWeight: '900' },\n  courierEmail: { color: '#8BEAFF', fontSize: 10.5, fontWeight: '800', marginTop: 3 },\n  statusPill: { borderRadius: 999, paddingHorizontal: 9, paddingVertical: 6, backgroundColor: 'rgba(99,231,177,.10)', borderWidth: 1, borderColor: 'rgba(99,231,177,.20)' },\n  statusPillText: { color: '#8EF0C1', fontSize: 8, fontWeight: '900', letterSpacing: .7 },\n  detailGrid: { flexDirection: 'row', flexWrap: 'wrap', gap: 8, marginTop: 12 },\n  detailCell: { width: '48%', minHeight: 62, borderRadius: 14, padding: 9, backgroundColor: 'rgba(4,16,31,.42)', borderWidth: 1, borderColor: 'rgba(255,255,255,.07)' },\n  detailLabel: { color: 'rgba(218,238,255,.45)', fontSize: 7.5, fontWeight: '900', letterSpacing: .7 },\n  detailValue: { color: '#FFFFFF', fontSize: 10, lineHeight: 14, fontWeight: '800', marginTop: 5 },",
          );
          if (!appsText.includes('dkd_full_name_value') || !appsText.includes('detailGrid')) throw new Error('Admin application enhancement failed');
          fs.writeFileSync(apps, appsText);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Verify v0.0.13
        run: npm run dkd:verify-v0.0.13

      - name: Android Expo export
        run: npx expo export --platform android --output-dir /tmp/dkd-v0-0-13-hotfix

      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/courier/dkd_courier_board_modal_v2.js src/features/navigation/ActionMenuModal.js src/features/admin/dkd_admin_applications_modal.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: courier active state menu scroll and application details'
          git push origin HEAD:main
