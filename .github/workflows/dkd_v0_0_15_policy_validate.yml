name: DKD v0.0.15 Policy Validate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd_v0_0_15_policy_validate.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dkd:verify-v0.0.15
      - run: npm run dkd:play-risk-scan
      - run: npx expo export --platform android --output-dir /tmp/dkd-policy-export
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/dkd_v0_0_15_policy_validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "test: v0.0.15 privacy center validated"
            git push
          fi
