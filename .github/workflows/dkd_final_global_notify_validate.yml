name: Validate global courier notification bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd_final_global_notify_validate.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx expo export --platform android --output-dir dist-global-notify-validate
