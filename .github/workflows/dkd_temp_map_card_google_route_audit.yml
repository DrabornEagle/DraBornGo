name: DraBornGo map card Google route audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Validate MaterialCommunityIcons literals
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const glyphPath=require.resolve('@expo/vector-icons/build/vendor/react-native-vector-icons/glyphmaps/MaterialCommunityIcons.json');
          const glyphs=JSON.parse(fs.readFileSync(glyphPath,'utf8'));
          const files=[];
          function walk(dir){for(const name of fs.readdirSync(dir)){const p=path.join(dir,name);const s=fs.statSync(p);if(s.isDirectory())walk(p);else if(/\.(js|jsx|ts|tsx)$/.test(name))files.push(p)}}
          walk('src');
          const bad=[];
          for(const file of files){const text=fs.readFileSync(file,'utf8');for(const match of text.matchAll(/MaterialCommunityIcons[^>]*name=["']([^"']+)["']/g)){if(!glyphs[match[1]])bad.push(`${file}: ${match[1]}`)}}
          if(bad.length){console.error(bad.join('\n'));process.exit(1)}
          console.log('MaterialCommunityIcons literal names valid');
          NODE
      - name: Validate Android Metro export only
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npx expo export --platform android --output-dir /tmp/dkd-map-card-export
