name: Dkd AAB Dispatcher

on:
  push:
    branches:
      - 'release/aab-dispatch-*'
    paths:
      - '.github/dkd_aab_dispatch_trigger.txt'

permissions:
  actions: write
  contents: write

jobs:
  dkd_dispatch_aab:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dkd checkout dispatcher branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dkd dispatch permanent AAB workflow and record result
        shell: bash
        run: |
          set +e
          dkd_dispatch_output="$(gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/dkd_build_signed_aab.yml/dispatches" \
            -f ref='main' 2>&1)"
          dkd_dispatch_exit=$?

          dkd_run_id=''
          dkd_query_output=''
          if [ "${dkd_dispatch_exit}" -eq 0 ]; then
            for dkd_try in 1 2 3 4 5 6; do
              sleep 5
              dkd_query_output="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/dkd_build_signed_aab.yml/runs?event=workflow_dispatch&branch=main&per_page=5" 2>&1)"
              dkd_query_exit=$?
              if [ "${dkd_query_exit}" -eq 0 ]; then
                dkd_run_id="$(printf '%s' "${dkd_query_output}" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);const r=(j.workflow_runs||[]).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)))[0];process.stdout.write(r?String(r.id):'')}catch{}})")"
              fi
              if [ -n "${dkd_run_id}" ]; then break; fi
            done
          fi

          export DKD_DISPATCH_EXIT="${dkd_dispatch_exit}"
          export DKD_DISPATCH_OUTPUT="${dkd_dispatch_output}"
          export DKD_QUERY_OUTPUT="${dkd_query_output}"
          export DKD_RUN_ID="${dkd_run_id}"
          node <<'DKD_NODE'
          const fs=require('fs');
          const dkd_run_id=String(process.env.DKD_RUN_ID||'').trim();
          const dkd_value={
            dkd_status: dkd_run_id ? 'dispatched' : 'dispatch_failed',
            dkd_run_id: dkd_run_id ? Number(dkd_run_id) : null,
            dkd_dispatch_exit: Number(process.env.DKD_DISPATCH_EXIT||0),
            dkd_dispatch_output: String(process.env.DKD_DISPATCH_OUTPUT||'').slice(0,3000),
            dkd_query_output: String(process.env.DKD_QUERY_OUTPUT||'').slice(0,3000),
            dkd_workflow: 'DraBornGo Release AAB',
            dkd_ref: 'main',
            dkd_version_name: '0.0.16',
            dkd_version_code: 3
          };
          fs.writeFileSync('dkd_aab_dispatch_receipt.json', JSON.stringify(dkd_value,null,2)+'\n');
          DKD_NODE

          git config user.name 'DrabornEagle AAB Dispatcher'
          git config user.email 'actions@users.noreply.github.com'
          git add dkd_aab_dispatch_receipt.json
          git commit -m "release: record AAB dispatch result ${dkd_run_id:-failed}"
          git push origin HEAD:${GITHUB_REF_NAME}

          if [ -z "${dkd_run_id}" ]; then exit 1; fi
