name: Dkd AAB Dispatcher

on:
  push:
    branches:
      - 'release/aab-dispatch-*'
    paths:
      - '.github/dkd_aab_dispatch_trigger.txt'

permissions:
  actions: write
  contents: write

jobs:
  dkd_dispatch_aab:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dkd checkout dispatcher branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dkd dispatch permanent AAB workflow
        shell: bash
        run: |
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/dkd_build_signed_aab.yml/dispatches" \
            -f ref='main'

          dkd_run_id=''
          for dkd_try in 1 2 3 4 5 6; do
            sleep 5
            dkd_run_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/dkd_build_signed_aab.yml/runs?event=workflow_dispatch&branch=main&per_page=5" --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0].id // empty')"
            if [ -n "${dkd_run_id}" ]; then break; fi
          done
          if [ -z "${dkd_run_id}" ]; then echo 'DKD ERROR: dispatched AAB run id not found'; exit 1; fi

          cat > dkd_aab_dispatch_receipt.json <<DKD_JSON
          {
            "dkd_status": "dispatched",
            "dkd_run_id": ${dkd_run_id},
            "dkd_workflow": "DraBornGo Release AAB",
            "dkd_ref": "main",
            "dkd_version_name": "0.0.16",
            "dkd_version_code": 3
          }
          DKD_JSON

          git config user.name 'DrabornEagle AAB Dispatcher'
          git config user.email 'actions@users.noreply.github.com'
          git add dkd_aab_dispatch_receipt.json
          git commit -m "release: record dispatched AAB run ${dkd_run_id}"
          git push origin HEAD:${GITHUB_REF_NAME}
