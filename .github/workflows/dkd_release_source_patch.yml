name: DKD v0.0.16 Source Patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/dkd_release_patch_trigger/**'

permissions:
  contents: write

jobs:
  dkd_patch_source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply requested source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def rep(path, old, new, label):
              p=Path(path); t=p.read_text()
              if old not in t: raise SystemExit(f'DKD ERROR: {label} pattern missing')
              p.write_text(t.replace(old,new))

          p=Path('src/features/map/MapHomeScreen.js'); t=p.read_text()
          old='            <DkdQuickTile dkd_icon_value="headset" dkd_title_value="Destek" dkd_subtitle_value="DrabornEagle admin canlı destek" dkd_accent_value="#A33D80" dkd_on_press_value={() => onTabChange?.(\'support\')} />\n'
          if old not in t: raise SystemExit('DKD ERROR: Destek quick tile missing')
          p.write_text(t.replace(old,''))

          rep('src/features/navigation/ActionMenuModal.js','DraBornGo v0.0.15','DraBornGo v0.0.16','Merkez Menü version')
          rep('src/features/navigation/ActionMenuModal.js','Kullanıcı, kurye, başvuru ve destek operasyonlarını yönet.','Kullanıcı, kurye, destek ve operasyon araçlarını yönet.','retired application wording')

          p=Path('src/features/courier/dkd_courier_board_modal_v2.js'); t=p.read_text()
          pairs=[
            ("dkd_status_hero: { minHeight: 272,","dkd_status_hero: { minHeight: 300,"),
            ("dkd_status_kicker: { color: 'rgba(226,245,255,.62)', fontSize: 8.5, fontWeight: '900', letterSpacing: 1.1 },","dkd_status_kicker: { color: 'rgba(226,245,255,.72)', fontSize: 11, fontWeight: '900', letterSpacing: 1.2 },"),
            ("dkd_status_title: { color: '#FFFFFF', fontSize: 17, lineHeight: 21, fontWeight: '900', marginTop: 3 },","dkd_status_title: { color: '#FFFFFF', fontSize: 21, lineHeight: 26, fontWeight: '900', marginTop: 4 },"),
            ("dkd_status_sub: { color: 'rgba(235,245,255,.64)', fontSize: 10, lineHeight: 15, fontWeight: '700', marginTop: 4 },","dkd_status_sub: { color: 'rgba(235,245,255,.72)', fontSize: 12.5, lineHeight: 18, fontWeight: '700', marginTop: 5 },"),
            ("dkd_metric: { flex: 1, minHeight: 64,","dkd_metric: { flex: 1, minHeight: 72,"),
            ("dkd_metric_label: { color: 'rgba(229,243,255,.45)', fontSize: 7.5, fontWeight: '900', letterSpacing: .7 },","dkd_metric_label: { color: 'rgba(229,243,255,.58)', fontSize: 9.5, fontWeight: '900', letterSpacing: .75 },"),
            ("dkd_metric_value: { color: '#FFFFFF', fontSize: 12, fontWeight: '900', marginTop: 7 },","dkd_metric_value: { color: '#FFFFFF', fontSize: 15, fontWeight: '900', marginTop: 6 },"),
            ("dkd_status_button: { minHeight: 55,","dkd_status_button: { minHeight: 58,"),
            ("dkd_status_button_text: { color: '#06111B', fontSize: 12, fontWeight: '900' },","dkd_status_button_text: { color: '#06111B', fontSize: 14, fontWeight: '900' },"),
          ]
          for a,b in pairs:
              if a not in t: raise SystemExit(f'DKD ERROR: courier style pattern missing: {a[:45]}')
              t=t.replace(a,b)
          p.write_text(t)

          p=Path('package.json'); pkg=json.loads(p.read_text()); pkg.setdefault('dependencies',{})['expo-navigation-bar']='~57.0.2'; p.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n')
          p=Path('app.json'); app=json.loads(p.read_text()); expo=app['expo']; expo['androidNavigationBar']={'barStyle':'light-content','enforceContrast':False}; plugins=expo.setdefault('plugins',[]); plugins=[x for x in plugins if not ((isinstance(x,list) and x and x[0]=='expo-navigation-bar') or x=='expo-navigation-bar')]; plugins.append(['expo-navigation-bar',{'enforceContrast':False,'style':'dark'}]); expo['plugins']=plugins; p.write_text(json.dumps(app,ensure_ascii=False,indent=2)+'\n')
          p=Path('App.js'); t=p.read_text(); imp="import * as dkd_system_ui_module from 'expo-system-ui';\n"; root="    <SafeAreaProvider>\n      <View style={{ flex: 1, backgroundColor: dkd_android_system_bar_background_value }}>"
          if "from 'expo-navigation-bar'" not in t:
              if imp not in t: raise SystemExit('DKD ERROR: App import anchor missing')
              t=t.replace(imp,imp+"import { NavigationBar } from 'expo-navigation-bar';\n")
          if '<NavigationBar style="dark" />' not in t:
              if root not in t: raise SystemExit('DKD ERROR: App root anchor missing')
              t=t.replace(root,"    <SafeAreaProvider>\n      <NavigationBar style=\"dark\" />\n      <View style={{ flex: 1, backgroundColor: dkd_android_system_bar_background_value }}>")
          p.write_text(t)
          PY
      - name: Install and validate
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          node <<'DKD_NODE'
          const fs=require('fs'),a=require('./app.json').expo,p=require('./package.json');
          if(a.version!=='0.0.16'||p.version!=='0.0.16'||Number(a.android.versionCode)!==3) throw new Error('DKD identity mismatch');
          if(p.dependencies['expo-navigation-bar']!=='~57.0.2') throw new Error('DKD navigation dependency mismatch');
          const h=fs.readFileSync('src/features/map/MapHomeScreen.js','utf8'),m=fs.readFileSync('src/features/navigation/ActionMenuModal.js','utf8'),b=fs.readFileSync('src/features/courier/dkd_courier_board_modal_v2.js','utf8');
          if(h.includes('dkd_title_value="Destek"')||!h.includes('dkd_title_value="Tüm Menü"')) throw new Error('DKD quick access mismatch');
          if(m.includes('DraBornGo v0.0.15')||!m.includes('DraBornGo v0.0.16')) throw new Error('DKD menu mismatch');
          if(!b.includes('fontSize: 21, lineHeight: 26')) throw new Error('DKD typography mismatch');
          DKD_NODE
          npx expo config --json > /tmp/cfg.json
          node -e "const c=JSON.parse(require('fs').readFileSync('/tmp/cfg.json')); if(c.version!=='0.0.16'||Number(c.android.versionCode)!==3) throw Error('resolved config mismatch'); console.log('DKD v0.0.16 / code 3 Expo config OK')"
          git diff --check
      - name: Commit source patch to PR branch
        shell: bash
        run: |
          rm -rf .github/dkd_release_patch_trigger
          git config user.name "DraBornGo Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add App.js app.json package.json package-lock.json src/features/map/MapHomeScreen.js src/features/navigation/ActionMenuModal.js src/features/courier/dkd_courier_board_modal_v2.js .github/dkd_release_patch_trigger
          git commit -m "release: finalize DraBornGo v0.0.16 code 3 UI"
          git push origin HEAD:${{ github.head_ref }}
