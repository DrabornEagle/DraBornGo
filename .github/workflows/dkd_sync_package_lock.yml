name: DKD Sync Release Metadata

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/dkd_sync_package_lock.yml

permissions:
  contents: write

concurrency:
  group: dkd-sync-release-metadata-main
  cancel-in-progress: true

jobs:
  dkd_sync_release_metadata:
    name: Sync lockfile and policy metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Sync package lock without build scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Sync Login policy acceptance metadata without UI changes
        shell: bash
        run: |
          sed -i "s/2026-08-08-v0\.0\.7/2026-08-08-v0.0.8/g" src/features/auth/AuthScreen.js

      - name: Commit synchronized metadata only when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json src/features/auth/AuthScreen.js; then
            echo "Release metadata already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src/features/auth/AuthScreen.js
          git commit -m "chore: sync v0.0.8 release metadata"
          git push origin HEAD:main
