name: DKD Sync Package Lock

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/dkd_sync_package_lock.yml

permissions:
  contents: write

concurrency:
  group: dkd-sync-package-lock-main
  cancel-in-progress: true

jobs:
  dkd_sync_package_lock:
    name: Keep package lock synchronized
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Sync package lock without build scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lock only when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Package lock already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync package lock"
          git push origin HEAD:main
