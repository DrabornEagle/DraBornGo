name: DKD v0.0.12 Courier Watcher Hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  dkd_hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Fix malformed pickup fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/features/courier/dkd_courier_online_global_watcher.js')
          text = path.read_text(encoding='utf-8')
          old = "return dkd_trim_text_value(dkd_job_value?.pickup)\n    )\n    || 'Gönderici noktası';"
          new = "return dkd_trim_text_value(dkd_job_value?.pickup)\n    || 'Gönderici noktası';"
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
              print('Fixed courier watcher malformed pickup fallback.')
          else:
              print('Courier watcher malformed pickup fallback already fixed.')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify release identity
        run: npm run dkd:verify-v0.0.12
      - name: Verify Android Expo bundle
        run: npx expo export --platform android --output-dir /tmp/dkd-v0-0-12-export
      - name: Commit hotfix if needed
        run: |
          if git diff --quiet -- src/features/courier/dkd_courier_online_global_watcher.js; then
            echo 'No source change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/courier/dkd_courier_online_global_watcher.js
          git commit -m 'fix: repair courier watcher syntax in v0.0.12'
          git push origin HEAD:main
