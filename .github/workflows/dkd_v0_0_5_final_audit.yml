name: DKD DraBornGo v0.0.5 Final Audit

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: dkd-draborngo-v0-0-5-final-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.event.pull_request.title == '[DKD] Audit DraBornGo v0.0.5 final state'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Restore pinned public environment
        run: npm run env:restore

      - name: Verify release identity
        run: npm run dkd:verify-v0.0.5

      - name: Verify legacy identity is absent from active project files
        shell: bash
        run: |
          node - <<'DKD_NODE'
          const fs = require('fs');
          const path = require('path');
          const dkdProjectTitle = ['Loo', 'tonia'].join('');
          const dkdSocialTitle = ['Al', 'ly'].join('');
          const dkdSocialLower = dkdSocialTitle.toLowerCase();
          const dkdForbidden = [
            dkdProjectTitle,
            dkdProjectTitle.toLowerCase(),
            dkdProjectTitle.toUpperCase(),
            dkdSocialTitle,
            `${dkdSocialLower}_id`,
            `${dkdSocialTitle}Hub`,
            `${dkdSocialLower}Service`,
            `use${dkdSocialTitle}HubState`,
          ];
          const dkdRoots = ['App.js', 'app.json', 'app.config.js', 'package.json', 'src', 'scripts', 'supabase/functions', 'web'];
          const dkdExtensions = new Set(['.js', '.jsx', '.ts', '.tsx', '.mjs', '.cjs', '.json', '.md', '.html', '.yml', '.yaml', '.sh', '.txt']);
          const dkdErrors = [];
          function dkdScan(dkdFilePath) {
            if (!fs.existsSync(dkdFilePath)) return;
            const dkdStat = fs.statSync(dkdFilePath);
            if (dkdStat.isDirectory()) {
              for (const dkdName of fs.readdirSync(dkdFilePath)) dkdScan(path.join(dkdFilePath, dkdName));
              return;
            }
            if (!dkdExtensions.has(path.extname(dkdFilePath).toLowerCase())) return;
            const dkdText = fs.readFileSync(dkdFilePath, 'utf8');
            for (const dkdToken of dkdForbidden) {
              if (dkdText.includes(dkdToken)) dkdErrors.push(`${dkdFilePath}: ${dkdToken}`);
            }
          }
          for (const dkdRoot of dkdRoots) dkdScan(dkdRoot);
          if (dkdErrors.length) {
            console.error(dkdErrors.join('\n'));
            process.exit(1);
          }
          console.log('Active project files contain no legacy identity literals.');
          DKD_NODE

      - name: Verify v0.0.5 and code5 state
        shell: bash
        run: |
          node - <<'DKD_NODE'
          const fs = require('fs');
          const path = require('path');
          const dkdScanRoots = [
            'app.json',
            'app.config.js',
            'package.json',
            'src',
            'web',
            '.github/workflows/dkdev_build_apk.yml',
            '.github/workflows/dkd_build_signed_apk.yml',
            '.github/workflows/dkd_build_signed_aab.yml',
          ];
          const dkdExtensions = new Set(['.js', '.jsx', '.ts', '.tsx', '.mjs', '.cjs', '.json', '.md', '.html', '.yml', '.yaml', '.txt']);
          const dkdErrors = [];
          function dkdScan(dkdFilePath) {
            if (!fs.existsSync(dkdFilePath)) return;
            const dkdStat = fs.statSync(dkdFilePath);
            if (dkdStat.isDirectory()) {
              for (const dkdName of fs.readdirSync(dkdFilePath)) dkdScan(path.join(dkdFilePath, dkdName));
              return;
            }
            if (!dkdExtensions.has(path.extname(dkdFilePath).toLowerCase())) return;
            const dkdText = fs.readFileSync(dkdFilePath, 'utf8');
            for (const dkdPattern of [/0\.0\.4/g, /v0_0_4/g, /code4/g]) {
              if (dkdPattern.test(dkdText)) dkdErrors.push(`${dkdFilePath}: ${dkdPattern.source}`);
            }
          }
          for (const dkdRoot of dkdScanRoots) dkdScan(dkdRoot);

          const dkdApp = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          const dkdPackage = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const dkdWebManifest = JSON.parse(fs.readFileSync('web/DraBornGo/App/dkd_draborngo_update_manifest.json', 'utf8'));
          if (dkdPackage.version !== '0.0.5') dkdErrors.push('package.json version is not 0.0.5');
          if (dkdApp?.expo?.version !== '0.0.5') dkdErrors.push('app.json version is not 0.0.5');
          if (Number(dkdApp?.expo?.android?.versionCode) !== 5) dkdErrors.push('app.json versionCode is not 5');
          if (dkdWebManifest.dkd_latest_version_name !== '0.0.5') dkdErrors.push('web manifest version is not 0.0.5');
          if (Number(dkdWebManifest.dkd_latest_version_code) !== 5) dkdErrors.push('web manifest versionCode is not 5');

          for (const dkdWorkflowPath of [
            '.github/workflows/dkdev_build_apk.yml',
            '.github/workflows/dkd_build_signed_apk.yml',
            '.github/workflows/dkd_build_signed_aab.yml',
          ]) {
            const dkdText = fs.readFileSync(dkdWorkflowPath, 'utf8');
            if (!dkdText.includes('v0.0.5')) dkdErrors.push(`${dkdWorkflowPath}: v0.0.5 missing`);
            if (!dkdText.includes('v0_0_5')) dkdErrors.push(`${dkdWorkflowPath}: v0_0_5 missing`);
            if (!dkdText.includes('code5')) dkdErrors.push(`${dkdWorkflowPath}: code5 missing`);
          }

          if (dkdErrors.length) {
            console.error(dkdErrors.join('\n'));
            process.exit(1);
          }
          console.log('DraBornGo v0.0.5 and Android code5 state verified.');
          DKD_NODE

      - name: Verify removed silent-install notice
        shell: bash
        run: |
          node - <<'DKD_NODE'
          const fs = require('fs');
          const path = require('path');
          const dkdNeedle = ['sessiz', 'kurulum'].join(' ');
          const dkdErrors = [];
          function dkdScan(dkdFilePath) {
            if (!fs.existsSync(dkdFilePath)) return;
            const dkdStat = fs.statSync(dkdFilePath);
            if (dkdStat.isDirectory()) {
              for (const dkdName of fs.readdirSync(dkdFilePath)) dkdScan(path.join(dkdFilePath, dkdName));
              return;
            }
            if (!['.js', '.jsx', '.ts', '.tsx', '.html', '.json', '.md'].includes(path.extname(dkdFilePath).toLowerCase())) return;
            if (fs.readFileSync(dkdFilePath, 'utf8').toLowerCase().includes(dkdNeedle)) dkdErrors.push(dkdFilePath);
          }
          dkdScan('src');
          dkdScan('web');
          if (dkdErrors.length) {
            console.error(`Silent-install notice remains in: ${dkdErrors.join(', ')}`);
            process.exit(1);
          }
          console.log('Silent-install notice area is absent.');
          DKD_NODE

      - name: Verify DBG files and removed legacy files
        shell: bash
        run: |
          node - <<'DKD_NODE'
          const fs = require('fs');
          const dkdSocialTitle = ['Al', 'ly'].join('');
          const dkdSocialLower = dkdSocialTitle.toLowerCase();
          const dkdRequired = [
            'src/features/social/DBGHubModal.js',
            'src/hooks/useDBGHubState.js',
            'src/services/dbgService.js',
          ];
          const dkdRemoved = [
            `src/features/social/${dkdSocialTitle}HubModal.js`,
            `src/hooks/use${dkdSocialTitle}HubState.js`,
            `src/services/${dkdSocialLower}Service.js`,
          ];
          for (const dkdPath of dkdRequired) if (!fs.existsSync(dkdPath)) throw new Error(`Missing ${dkdPath}`);
          for (const dkdPath of dkdRemoved) if (fs.existsSync(dkdPath)) throw new Error(`Legacy file remains: ${dkdPath}`);
          console.log('DBG runtime files verified.');
          DKD_NODE

      - name: Validate Expo public config
        shell: bash
        run: |
          npx expo config --type public --json >/tmp/dkd_expo_public_config.json
          node - <<'DKD_NODE'
          const dkdConfig = require('/tmp/dkd_expo_public_config.json');
          const dkdRequiredKeys = [
            'EXPO_PUBLIC_SUPABASE_URL',
            'EXPO_PUBLIC_SUPABASE_ANON_KEY',
            'EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY',
            'EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN',
          ];
          if (dkdConfig.name !== 'DraBornGo') throw new Error('DraBornGo app name missing.');
          if (dkdConfig.version !== '0.0.5') throw new Error('Expo version is not 0.0.5.');
          if (Number(dkdConfig.android?.versionCode) !== 5) throw new Error('Android versionCode is not 5.');
          for (const dkdKey of dkdRequiredKeys) {
            const dkdValue = String(dkdConfig.extra?.dkd_public_env?.[dkdKey] || '').trim();
            if (!dkdValue) throw new Error(`${dkdKey} is missing from Expo config.`);
          }
          console.log('DraBornGo v0.0.5 Expo config and pinned public env verified.');
          DKD_NODE

      - name: Bundle Android JavaScript
        shell: bash
        run: |
          rm -rf .dkd-final-audit-export
          npx expo export --platform android --output-dir .dkd-final-audit-export --clear
          rm -rf .dkd-final-audit-export
