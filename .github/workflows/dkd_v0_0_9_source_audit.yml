name: DKD v0.0.9 Expo Source Audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dkd_v0_0_9_source_audit.yml

permissions:
  contents: write

concurrency:
  group: dkd-v0-0-9-source-audit
  cancel-in-progress: true

jobs:
  dkd_source_audit:
    name: Expo Go source and web audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci

      - name: Verify v0.0.9 identity
        run: npm run dkd:verify-v0.0.9

      - name: Run Google Play risk scan
        run: npm run dkd:play-risk-scan

      - name: Run Expo source and web export audit only
        run: npm run play:final-audit

      - name: Record successful non-build audit
        shell: bash
        run: |
          mkdir -p audit
          {
            echo "DraBornGo v0.0.9 remote source audit: PASS"
            echo "Android versionCode: 9"
            echo "Mode: Expo source export + web export only"
            echo "APK/AAB produced: NO"
            echo "Commit: ${GITHUB_SHA}"
          } > audit/dkd_v0_0_9_remote_audit.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/dkd_v0_0_9_remote_audit.txt
          git commit -m "audit: confirm v0.0.9 Expo source checks"
          git push origin HEAD:main
